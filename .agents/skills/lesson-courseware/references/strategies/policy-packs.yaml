# 策略偏好包 (policy-packs.yaml)
#
# 用途: 给"某个单元 / 某份课时教学设计"一个第四维策略入口 —— 在
# 年级认知 × 学科表达 × 课型骨架之外, 沉淀单元/课时级的表现偏好,
# 不必改代码或重复传 CLI 参数。挂在 modular-architecture.md 4.4 的
# Level 5 (教师/情境偏好), 永远压不过 L1 知识库 SSOT 与 L2 认知底线。
#
# 合并优先级 (高 → 低):
#   CLI/显式 userPreferences > lessons[lesson_id] > units[unitKey] > meta 默认
#
# 允许键 (白名单, 未知键加载即报错, 防止静默拼错):
#   style:           风格包 id (clean/warm/chalk)
#   preset:          场景预设 id (standard/open_class/review/parent_meeting/new_teacher)
#   layout_variant:  单页型变体偏好 (如 grid / two_column)
#   layout_variants: 按页型的变体映射, 如 { objectives_card: grid }
#   skeleton_fill:   是否为缺失必备环节补占位页 (布尔, 默认 true)
#
# unitKey 与 block-layout-map 一致: {subject}-g{grade}-t{1|2}-u{unit 补零两位}。

version: 1

# 单元级偏好示例 (解除注释即生效):
# units:
#   math-g3-t1-u04:
#     style: warm
#     layout_variants: { objectives_card: grid }

# 课时级偏好示例 (lesson_id 与教学设计 lesson_id 一致):
# lessons:
#   math-g3-t1-u04-l01:
#     preset: open_class
#     skeleton_fill: true

units: {}
lessons: {}
