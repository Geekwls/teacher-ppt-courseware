name: Style Matrix

on:
  schedule:
    # 每周一 02:00 (Asia/Shanghai) = 周日 18:00 UTC
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 6 金样 x 5 风格矩阵 (断言 0 Critical)
        run: npm run test:matrix
