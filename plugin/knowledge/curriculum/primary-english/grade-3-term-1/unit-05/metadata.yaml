unit_overview: >
  本单元为教育部审定2024年版义务教育教科书《英语（三年级起点）三年级上册》第五单元，围绕大问题“Why are colours important?”展开。
  通过艺术课堂调色探索、大自然与生活物品色彩观察、英文字母Qq-Uu的认读与拼读、色彩功能标志（Colours can talk!）阅读等活动，
  引导学生掌握10种基础颜色词汇（red, yellow, blue, green, orange, purple, brown, pink, white, black），
  掌握询问颜色（What colour is it? It's...）、表达色彩混合原理（Red and blue make purple.）、询问色彩偏好（What colours do you like? I like...）以及提出绘画建议（Let's draw some...），
  理解颜色在生活中的警示与指示功能（Red can say "No!" Green can say "Go!"），
  规范书写字母Qq-Uu并掌握其发音规律，提升审美感知与安全守则意识。
