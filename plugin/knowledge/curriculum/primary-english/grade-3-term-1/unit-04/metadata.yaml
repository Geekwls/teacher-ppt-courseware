unit_overview: >
  本单元为教育部审定2024年版义务教育教科书《英语（三年级起点）三年级上册》第四单元，围绕大问题“How do we connect with plants?”展开。
  通过农场水果采摘、校园绿化与花园养护、英文字母Mm-Pp的书写与拼读、植物生长条件探究等活动，
  引导学生掌握常见水果（apples, bananas, oranges, grapes）与植物环境要素（plants, trees, flowers, grass, air, water, sun）词汇，
  掌握询问个人对水果喜好的疑问句（Do you like apples? Yes, I do. / No, I don't. I like bananas.）、建设绿色校园与养护植物的倡议句型（We can water the flowers / plant new trees.），
  理解植物与人类互利共生的关系（Plants need air, water and sun. Plants can give us many things. We need plants.），
  规范书写字母Mm-Pp并掌握其自然拼读规律，树立爱护绿植、呵护生态的环保意识。
