unit_id: "unit-4"
blueprints:
  - blueprint_id: "bp-eng-g3-t1-u04-standard"
    title: "Unit 4 Plants around us 标准练习卷蓝图"
    target_practice: "单元基础达标与绿色自然探究素养提升练习（6:3:1 阶梯）"
    total_score: 100
    suggested_time_minutes: 40
    difficulty_ratio:
      basic: 0.60
      variation: 0.30
      challenge: 0.10
    question_slots:
      # 一、字母乐园 (Letters & Phonics)（20分）
      - slot_id: "slot-01"
        section: "一、字母乐园：规范书写与大小写配对"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["eng-g3-t1-u04-p01"]
        guidelines: "考查字母 Mm, Nn, Oo, Pp 的大小写对应、四线三格占位与按字母表顺序填空（特别关注小写 p 占中下格）。"

      - slot_id: "slot-02"
        section: "二、拼读侦探：字母发音与例词拼读"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["eng-g3-t1-u04-p02"]
        guidelines: "考查 Mm-Pp 在核心词汇（map, new, orange, pen）中的发音，找出首音或短元音 /ɒ/ 匹配项及 CVC 拼读（nod, hop）。"

      # 二、词汇天地 (Vocabulary & Expressions)（20分）
      - slot_id: "slot-03"
        section: "三、词汇天地：选出不同类的一项"
        question_type: "choice"
        difficulty: "variation"
        points_per_item: 2
        item_count: 5
        target_points: ["eng-g3-t1-u04-p03", "eng-g3-t1-u04-p05"]
        guidelines: "选出每组不同类的词汇（如水果词汇与环境要素混排、植物名词与动词 water/plant 混排）。"

      - slot_id: "slot-04"
        section: "四、看图与语境水果及植物要素填空"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["eng-g3-t1-u04-p03", "eng-g3-t1-u04-p05"]
        guidelines: "根据图片或中文提示补全水果与植物生态单词（apples, bananas, flowers, water, sun），注意单复数形式。"

      # 三、情境交际 (Contextual Communication)（20分）
      - slot_id: "slot-05"
        section: "五、情境交际单项选择"
        question_type: "choice"
        difficulty: "variation"
        points_per_item: 4
        item_count: 5
        target_points: ["eng-g3-t1-u04-p04", "eng-g3-t1-u04-p06"]
        guidelines: "考查 Do you like apples? 及答语、And you? 反问、How can we help? 及倡议 We can water the flowers / plant new trees 的真实运用。"

      # 四、连词成句与生态倡议匹配 (Sentence Building & Matching)（20分）
      - slot_id: "slot-06"
        section: "六、绿化行动手拉手与规范连词"
        question_type: "match"
        difficulty: "variation"
        points_per_item: 4
        item_count: 5
        target_points: ["eng-g3-t1-u04-p06", "eng-g3-t1-u04-p07"]
        guidelines: "将护绿行动与对象连线（water the flowers, plant new trees, water the grass, need air, need water）。"

      # 五、阅读理解与探究大问题 (Reading & Challenge)（20分）
      - slot_id: "slot-07"
        section: "七、阅读短文并完成任务（人与植物的美丽约定）"
        question_type: "reading_comprehension"
        difficulty: "challenge"
        points_per_item: 4
        item_count: 5
        target_points: ["eng-g3-t1-u04-p03", "eng-g3-t1-u04-p05", "eng-g3-t1-u04-p07"]
        guidelines: "阅读关于校园花园或果园生态的短篇语篇（约35-45词），根据文章完成判断正误或归类植物的需要与给予，回答单元大问题。"
