unit_overview: >
  本单元为教育部审定2024年版义务教育教科书《英语（三年级起点）三年级上册》起始单元，围绕大问题“How do we make friends?”展开。
  通过问候交友、认识身体五官与交往动作、英文字母Aa-Dd的认读与自然拼读、友好分享与感谢，以及好朋友优秀品质海报的阅读，
  引导学生掌握初次结交朋友的礼貌用语（Hello/Hi, I'm.../My name is..., Nice to meet you. Too），
  身体部位与动作词汇（ear, eye, mouth, hand, arm, wave, listen, smile），友好分享与互助表达（It's OK. We can share. Thanks. / I help.），
  以及字母Aa至Dd的大小写规范书写与基本拼读规律。
