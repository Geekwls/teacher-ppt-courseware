unit_overview: >
  本单元为教育部审定2024年版义务教育教科书《英语（三年级起点）三年级上册》第二单元，围绕大问题“What makes a family?”展开。
  通过家庭照片分享、家庭成员称谓学习、英文字母Ee-Hh的认读与自然拼读、确认家庭成员的一般疑问句对话，以及不同家庭结构与亲情主题海报的阅读，
  引导学生掌握核心家庭成员称谓（father/dad, mother/mum, grandfather/grandpa, grandmother/grandma, brother, sister, baby sister, uncle, aunt, cousin），
  掌握介绍家庭成员（This is my...）及询问确认家庭成员（Is this/that your...? Yes, it is. / No, it's my...）的核心句型，
  熟练书写字母Ee至Hh并掌握自然拼读发音，懂得感恩长辈、关爱家人。
