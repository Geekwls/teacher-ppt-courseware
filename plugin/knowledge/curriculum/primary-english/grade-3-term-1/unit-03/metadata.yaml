unit_overview: >
  本单元为教育部审定2024年版义务教育教科书《英语（三年级起点）三年级上册》第三单元（课本主标Unit 3 Our animal friends，教参标Unit 3 Amazing animals），围绕大问题“How are animals different?”展开。
  通过家庭宠物交流、动物园参观调查、英文字母Ii-Ll的书写与拼读、事物指认与特征描述等活动，
  引导学生掌握常见宠物（cat, dog, fish, bird, rabbit）与野生动物（panda, red panda, monkey, tiger, elephant, lion, fox, giraffe）词汇，
  掌握询问拥有宠物的句型（Do you have a pet? Yes, I do. / No, I don't.）、指认事物的特殊疑问句（What's this/that? It's a/an...）以及动物特征描述句型（The giraffe is tall! The elephant is big!），
  规范书写字母Ii-Ll并掌握/ɪ/, /dʒ/, /k/, /l/自然拼读，理解动物的多样性与奇妙之处，树立关爱与保护动物的生态意识。
