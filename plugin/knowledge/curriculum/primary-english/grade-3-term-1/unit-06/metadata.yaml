unit_overview: >
  本单元为教育部审定2024年版义务教育教科书《英语（三年级起点）三年级上册》第六单元，围绕大问题“Why are numbers important?”展开。
  通过同伴年龄交流、跳绳与捉迷藏数数、超市购物付款、生日派对准备（Start to read）以及奇数偶数（odd/even）分类探究，
  引导学生掌握基数词1至10（one to ten）及奇偶数跨学科概念，
  熟练运用询问年龄句型（How old are you? I'm... years old. Me too.）、询问物品数量句型（How many...? One/Two...）、购物结算支付表达（That's ten yuan, please. Here you are.），
  规范书写英文字母表中最后5个字母Vv-Zz并掌握其自然拼读发音，圆满完成全册26个英文字母书写与自然拼读体系的学习，
  深刻体会数字在时间、年龄、计数、货币支付等日常生活中的关键作用。
