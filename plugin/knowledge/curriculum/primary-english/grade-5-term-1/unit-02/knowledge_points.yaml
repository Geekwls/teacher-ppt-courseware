  point_name: 表达情感的形容词
  learning_objectives:
  - 能听懂、说出常见情感词汇（excited, worried, happy, angry, sad）
  - 能用 He/She is … 描述他人的情绪
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_english_g5_t1_2024
