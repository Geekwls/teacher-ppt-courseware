unit_overview: 本单元围绕大问题「How do people get along?」展开。教材通过「画出不同的表情」「谈论自己的感受」「理解他人并寻求帮助」等情境，引导学生掌握表达情感的形容词（excited, worried, happy, angry, sad 等），学会询问与表达感受，理解他人情绪并知道如何寻求帮助，并掌握字母组合 ee / ea 的发音与例词。
