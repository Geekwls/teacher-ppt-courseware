teaching_references:
- point_id: eng-g5-t1-u01-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「认识新同学」的真实情境，把问句与描述性答句配对操练，再通过介绍同学的句子扩充形容词
    difficulty: 学生易把 What's he like? 与 What does he like? 混淆；易把 hard-working 写成 hard working
    typical_misconceptions:
    - error_pattern: What's he like? 与 What does he like? 混淆
      misconception_type: 句型混淆
    - error_pattern: 形容词拼写错误
      misconception_type: 拼写不牢
  variation_strategy:
  - 用 What's he/she like? 问答
  - 用形容词描述一位同学
- point_id: eng-g5-t1-u01-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「才艺展示」为话题，让学生用 can 说出自己或他人的特长，并在同伴间互相询问
    difficulty: 学生易在 play 乐器时漏掉 the（play piano）；易把 can 后加 to
    typical_misconceptions:
    - error_pattern: play 乐器漏掉 the
      misconception_type: 冠词遗漏
    - error_pattern: can 后误加 to
      misconception_type: 情态动词误用
  variation_strategy:
  - 用 can 说出会做的事
  - 用 Can you …? 问答并作答
- point_id: eng-g5-t1-u01-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 把 ai 与 ay 的例词集中呈现，让学生在朗读中发现「两种拼写、同一发音」
    difficulty: 学生易把 ai 与 ay 的拼写位置记混；易把 /eɪ/ 读成 /æ/
    typical_misconceptions:
    - error_pattern: ai / ay 拼写位置混淆
      misconception_type: 音形对应错误
    - error_pattern: /eɪ/ 读成 /æ/
      misconception_type: 发音错误
  variation_strategy:
  - 朗读含 ai / ay 的例词
  - 按发音给单词归类
