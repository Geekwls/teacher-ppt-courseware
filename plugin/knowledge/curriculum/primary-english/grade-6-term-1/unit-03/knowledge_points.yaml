  subject: english
  grade: 6
  term: term-1
  point_name: 用祈使句给健康建议
  learning_objectives:
  - 能用祈使句给出健康建议（Have a healthy diet. Don't stay up late.）
  - 能区分健康与不健康的生活方式
  applicable_question_types:
  - fill_blank
  - choice
  - writing
  verification_status: verified
  provenance:
    source_id: pep_english_g6_t1_2024
    page_ref:
    - P27
    - P31
    anchor_text: P27：「Healthy lifestyle / Unhealthy lifestyle —— Do exercise. / Eat too much cake.」P31：「Have a healthy diet. Don't stay up late. Exercise often. Think about happy things.」
  teaching_boundary:
    scope_allowed:
    - 祈使句的肯定与否定形式
    - 健康建议的表达
    - 健康与不健康生活方式的对比
    scope_excluded:
    - 健康教育的课程设计
    - 英语祈使句语法
