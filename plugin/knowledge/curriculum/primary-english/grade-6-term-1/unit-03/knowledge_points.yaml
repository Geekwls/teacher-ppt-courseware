  point_name: 谈论身体不适
  learning_objectives:
  - 能用 What's the matter? 询问病情
  - 能用 I have a … / My … hurts. 描述身体不适
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_english_g6_t1_2024
    page_ref:
    - P28
    - P29
    anchor_text: P29：「What's the matter? I have a bad cold. My head hurts and I have a runny nose. Mike has a bad cold.」
  teaching_boundary:
    scope_allowed:
    - 询问病情的问句
    - 描述不适的句型
    - 疾病词汇 a bad cold / a runny nose
    scope_excluded:
    - 医学英语基础
    - 健康教育的语言表达
- point_id: eng-g6-t1-u03-p02
