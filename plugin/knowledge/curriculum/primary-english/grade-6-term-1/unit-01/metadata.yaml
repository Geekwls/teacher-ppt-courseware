unit_overview: 本单元围绕大问题「Why do we travel to different places?」展开。教材通过「分享旅行经历」「介绍著名地标」「阅读旅行评论」等情境，引导学生学会用一般过去时谈论旅行经历（Where did you go? I went to …），用 be famous for / … years old 等描述地标，并区分事实（Fact）与观点（Opinion）。
