unit_overview: 本单元围绕大问题「Why do we get together?」展开。教材通过「列举节日与重大活动」「谈论节日习俗」「描述上周末的活动」等情境，引导学生用一般过去时谈论节日与活动（We cleaned the house / We dressed in red），了解中外节日的文化内涵，并继续练习区分事实与观点。
