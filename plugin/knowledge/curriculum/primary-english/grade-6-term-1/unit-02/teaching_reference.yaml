teaching_references:
- point_id: eng-g6-t1-u02-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「春节习俗」为话题，让学生用一般过去时描述自己和家人做过的事，再把规则与不规则动词分类整理
    difficulty: 学生易把不规则动词过去式写错（run→runned）；易漏掉过去式（We clean the house）
    typical_misconceptions:
    - error_pattern: 不规则动词过去式错误
      misconception_type: 动词形式错误
    - error_pattern: 该用过去式却用原形
      misconception_type: 时态遗漏
  variation_strategy:
  - 用一般过去时描述节日活动
  - 把动词改为正确的过去式
- point_id: eng-g6-t1-u02-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「节日海报」为载体，把节日名称、时间与习俗对应起来，让学生在中外节日的对比中体会文化差异
    difficulty: 学生易把节日名称的英文拼写写错；易把节日时间表达用错介词
    typical_misconceptions:
    - error_pattern: 节日名称拼写错误
      misconception_type: 拼写不牢
    - error_pattern: 时间介词用错
      misconception_type: 介词错误
  variation_strategy:
  - 说出中外主要节日及时间
  - 用英语介绍一个节日的习俗
- point_id: eng-g6-t1-u02-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「活动通知」与「活动感想」两种文体对比，让学生标注事实句与观点句
    difficulty: 学生易把「令人激动的比赛」这类带感情色彩的句子当成事实
    typical_misconceptions:
    - error_pattern: 把带感情色彩的句子当成事实
      misconception_type: 判断标准不清
    - error_pattern: 不能表达自己的观点
      misconception_type: 表达能力不足
  variation_strategy:
  - 判断句子是事实还是观点
  - 用英语表达自己对一次活动的看法
