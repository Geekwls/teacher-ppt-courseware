unit_overview: 本单元围绕大问题「What do family do together?」展开，属 PEP 2024 年审定版四年级上册起始单元。教材通过「帮助家人做家务」「了解家人的职业」「为家人做礼物」等情境，引导学生学会询问与介绍职业（What's your …'s job? He's/She's a …）、用 can 表达自己会做的事（I can …）、用 have/has 描述家人，并掌握字母组合 ch 的发音与例词。
