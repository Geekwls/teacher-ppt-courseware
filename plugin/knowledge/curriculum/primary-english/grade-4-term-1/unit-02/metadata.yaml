page_evidence_note: '页码于 2026-10-10 依据用户提供的《2024版人教版PEP小学英语四年级上册电子课本》逐页实证核定：课本 PDF 共 30 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P25。本单元真实版面为 P14–P25，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P14 Unit 2 起始页「My friends / What makes your friends different?」；P15「Some friends are short. Some friends are tall. My friends are special. I love them all.」；P16「His name is Zhang Peng. Let me see. He''s tall and strong. I know! It''s Zhang Peng. He has nice short hair too.」；P17「Tim is my friend. He''s a good, good boy. He''s tall and thin.」；P18 Let''s spell：字母组合 sh（I have no shell. Can we share? / Shoo! Go away, Fish!）；P19「Who''s your best friend? Liu Jia. She''s tall and … She has long hair. She often …」；P20「We play games together. We play football together. I like my friend. My friend likes me.」「My friend play/plays games with me.」；P21 词汇（kind, long, short, strong, tall；helps me with…, plays football, plays games, reads books）；P22「What''s his/her name? His/Her name is …」+ Project: Make a book about
  your friend；P24–P25「He has small eyes and very big ears. What does he look like? He has short legs, but his body is very long.」「He likes the park. We often play games here.」'
unit_overview: 本单元围绕大问题「What makes your friends different?」展开。教材通过「描述朋友的外貌」「介绍朋友的名字与特点」「说说和朋友一起做的事」等情境，引导学生学会用 He/She is … 与 He/She has … 描述外貌，用 What's his/her name? 询问并介绍朋友，用 We … together / He/She often … 描述共同活动，并掌握字母组合 sh 的发音与例词。
