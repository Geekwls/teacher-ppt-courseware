  lesson_name: 11 坐井观天
  page_range: P54-P55
  core_writing_chars:
  - 观
  - 呀
  - 答
  - 话
  - 抬
  - 能
  - 信
  core_vocab_words:
  - 坐井观天
  - 哪儿
  - 回答
  - 大话
  - 出去
  - 不过
  - 过冬
  - 那么
  official_examples:
  - 青蛙坐在井里。小鸟飞来，落在井沿上。
  - 小鸟回答说：“我从天上来，飞了一百多里，口渴了，下来找点儿水喝。”
  - 青蛙笑了，说：“朋友，我天天坐在井里，一抬头就能看见天。天不过井口那么大，还用飞那么远吗？”
  - 小鸟也笑了，说：“朋友，你是弄错了。天无边无际，大得很哪！”
