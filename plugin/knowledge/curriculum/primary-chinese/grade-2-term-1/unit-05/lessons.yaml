  lesson_name: 12 寒号鸟
  page_range: P56-P59
  core_writing_chars:
  - 阵
  - 做
  - 冻
  - 第
  - 像
  - 冷
  - 冰
  - 亮
  core_vocab_words:
  - 当作
  - 前面
  - 面对面
  - 正好
  - 明天
  - 清早
  - 好像
  - 一样
  - 天亮
  - 出来
  official_examples:
  - 喜鹊一早飞出去，东寻西找，衔回来枯草，忙着做窝，准备过冬。寒号鸟却整天飞出去玩，累了就睡觉。
  - 寒号鸟在崖缝里冻得直打哆嗦，不停地叫着：“哆啰啰，哆啰啰，寒风冻死我，明天就做窝。”
  - 天亮了，太阳出来了，喜鹊来到崖缝前劝寒号鸟。寒号鸟还是不听，得过且过。
- lesson_id: chi-g2-t1-u05-l03
  unit_id: unit-05
