  lesson_number: 13
  lesson_name: 13 我要的是葫芦
  page_range: P60-P62
  core_writing_chars:
  - 种
  - 棵
  - 以
  - 次
  - 想
  - 邻
  - 居
  - 吧
  - 奇
  - 怪
  core_vocab_words:
  - 从前
  - 以后
  - 多么
  - 那个
  - 叶子
  - 虫子
  - 自言自语
  - 邻居
  - 奇怪
  official_examples:
  - 从前，有个人种了一棵葫芦。细长的葫芦藤上长满了绿叶，开出了几朵雪白的小花。
  - 那个人每天都要去看几次。有一天，他看见叶子上爬着一些蚜虫，心里想，有几个虫子怕什么！他盯着小葫芦自言自语地说：“我的小葫芦，快长啊，快长啊，长得赛过大南瓜才好呢！”
  - 邻居对他说：“你快治一治吧！”那个人感到很奇怪：“我要的是葫芦，叶子上的虫还用治？”没过几天，小葫芦慢慢变黄了，一个一个都落了。
