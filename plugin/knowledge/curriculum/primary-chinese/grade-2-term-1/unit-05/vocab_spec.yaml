  strokes_challenge:
  - question_stem: “渴”与“喝”的区别是：口渴要找水，偏旁是（    ）；喝水要用口，偏旁是（    ）。
    answer_text: 氵（三点水）；口（口字旁）
  - question_stem: “答”的部首是____________头，书写时竹字头要盖住下半部分的“合”字。
    answer_text: 竹字
  - question_stem: “怪”是左右结构，偏旁是____________旁，右半部分是“圣”字。
    answer_text: 竖心（忄）
