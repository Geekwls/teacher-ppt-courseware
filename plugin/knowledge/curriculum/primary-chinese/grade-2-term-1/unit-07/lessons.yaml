  - 着火
  - 火星
  - 怎么
  - 可以
  official_examples:
  - 兔妈妈在门外的空地上给小白兔堆了个雪孩子。小白兔有了雪孩子做伴，快乐极了。
  - 不好了，小白兔家着火了！雪孩子看见了，连忙奔向小白兔家，冲进屋里把小白兔救了出来。
  - 雪孩子渐渐化成了水，水变成了水汽，飞到空中，成了一朵美丽的白云。
