  official_examples:
  - 从前有一片雾，他是个又淘气又顽皮的孩子。
  - “我要把大海藏起来。”于是，他把大海藏了起来。无论是海水、船只，还是蓝色的远方，都看不见了。
  - “现在，我该把谁藏起来呢？”“我要把我自己藏起来。”雾把自己藏了起来，不久，太阳出来了，雾消失得无影无踪。
