  official_examples:
  - 小河从高高的大山奔向远方，一路欢歌跳跃，溅起朵朵洁白的水花。
  - 它滋润了岸边的青草，和小鱼小虾快乐地做着游戏。它流过田野，拥抱大地，奔向那蔚蓝广阔的大海。
