  - 极
  - 送
  - 椅
  - 怎
  - 拉
  - 收
  - 接
  core_vocab_words:
  - 果子
  - 木工
  - 身边
  - 仔细
  - 能干
  - 椅子
  - 自信
  - 从来
  - 这么
  official_examples:
  - 小獾已经做成了三个小板凳。板凳做得很粗糙，但是他很认真。
  - 小刺猬走到小獾身边，仔细看了看，说：“你真能干，小板凳做得一个比一个好！”
  - 小獾高兴极了，送给小刺猬一把精致的小椅子：“在我有点儿泄气的时候，是你称赞了我，让我有了自信！”
