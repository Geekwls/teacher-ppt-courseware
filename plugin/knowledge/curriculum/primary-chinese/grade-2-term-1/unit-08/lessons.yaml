  lesson_name: 22 纸船和风筝
  page_range: P98-P100
  core_writing_chars:
  - 纸
  - 抓
  - 线
  - 吵
  - 但
  - 受
  - 句
  - 哭
  core_vocab_words:
  - 上面
  - 快乐
  - 可是
  - 难过
  - 但是
  - 和好
  official_examples:
  - 松鼠住在山顶，小熊住在山脚。纸船和风筝让他们成了好朋友。
  - 可是有一天，他们俩为了一点儿小事吵了一架。山顶上再也看不到飘荡的风筝，小溪里再也看不到漂流的纸船了。
  - 过了几天，松鼠再也受不了了。他扎了一只风筝，上面写着：“如果你愿意和好，就放一只纸船吧！”傍晚，一只美丽的纸船漂流到了小熊门前。
