  official_examples:
  - 晚上，满天的星星像无数珍珠撒在碧玉盘里。一个孩子坐在院子里，仰着头数星星。
  - 你看，那七颗星连起来像一把勺子，叫北斗七星。勺柄指着北面一颗最亮的星，就是北极星。
  - 这个数星星的孩子叫张衡，是汉朝人，后来成了一位著名的天文学家。
