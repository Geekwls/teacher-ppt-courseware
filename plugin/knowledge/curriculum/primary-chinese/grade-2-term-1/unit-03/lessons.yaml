  core_vocab_words:
  - 天上
  - 美丽
  - 爸爸
  - 下来
  - 不用
  - 高兴
  - 哥哥
  - 秋千
  - 彩云
  - 自己
  official_examples:
  - 雨停了，天上出现了一座美丽的桥。
  - 爸爸，您浇花用的那把水壶呢？如果我提着它，走到桥上，把水洒下来，那不就是下雨了吗？
  - 哥哥，您挂在树上的秋千呢？如果我把它挂在彩虹桥上，坐着秋千荡来荡去，那不就成了一朵彩云了吗？
