  - 灯光
  - 中午
  - 眼前
  - 细雨
  - 风光
  - 中外
  - 名胜古迹
  official_examples:
  - 日月潭是我国台湾省最大的一个湖。它在台湾省中部的山区。
  - 湖中央有个美丽的小岛，把湖水分成两半，北边像圆圆的太阳，叫日潭；南边像弯弯的月亮，叫月潭。
  - 日月潭风光秀丽，吸引了许许多多的中外游客。
