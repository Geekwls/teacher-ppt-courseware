  official_examples:
  - 新疆吐鲁番有个地方叫葡萄沟。那里出产水果。五月有杏子，七八月有香梨、蜜桃、沙果，到九十月份，人们最喜爱的葡萄成熟了。
  - 到了秋季，葡萄一大串一大串地挂在绿叶底下，有红的、白的、紫的、淡绿的，五光十色，美丽极了。
  - 要是这时候你到葡萄沟去，热情好客的维吾尔族老乡，准会摘下最甜的葡萄，让你吃个够。
