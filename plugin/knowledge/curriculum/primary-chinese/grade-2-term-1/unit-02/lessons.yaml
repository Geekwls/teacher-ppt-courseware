  official_examples:
  - 你拍一，我拍一，动物世界很新奇。
  - 孔雀锦鸡是伙伴，雄鹰飞翔在蓝天。天空雁群会写字，黄鹂百灵唱不休。
  - 人和动物是朋友，保护动物是大事。
