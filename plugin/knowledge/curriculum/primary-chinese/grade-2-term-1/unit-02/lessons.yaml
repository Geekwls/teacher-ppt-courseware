  lesson_name: 识字1 场景歌
  page_range: P16-P17
  core_writing_chars:
  - 处
  - 块
  - 座
  - 园
  - 群
  - 队
  - 领
  core_vocab_words:
  - 花园
  - 飞鸟
  - 红领巾
  - 欢笑
  official_examples:
  - 一只海鸥，一条帆船。一处港湾，一艘军舰。
  - 一方鱼塘，一块稻田。一行垂柳，一座花园。
  - 一面队旗，一把铜号。一群红领巾，一片欢笑。
