  core_vocab_words:
  - 杨树
  - 树叶
  - 松柏
  - 化石
  - 开花
  official_examples:
  - 杨树高，榕树壮，梧桐树叶像手掌。
  - 枫树秋天叶儿红，松柏四季披绿装。
  - 木棉喜暖在南方，桦树耐寒守北疆。银杏水杉活化石，金桂开花满院香。
