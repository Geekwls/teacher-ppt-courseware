- point_id: chi-g2-t1-u02-p05
  unit_id: unit-02
  lesson_id: chi-g2-t1-u02-l05
  subject: chinese
  grade: 2
  term: term-1
  point_name: 语文园地二：部首查字法
  learning_objectives:
  - 能说出部首查字法的四个步骤，并能用部首查字法查出指定的字
  - 能积累对韵语句
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_chinese_g2_t1_2024
    page_ref:
    - P25
    anchor_text: P25「语文园地二」：遇到不认识的字，可以用部首查字法查字典，如「诚」字。①要查「诚」的读音，先要确定这个字的部首是「讠」，再数数「讠」的笔画，共 2 画。②在「部首目录」里的「2 画」中找到部首「讠」和它所在的页码。③按照页码，在「检字表」中找「讠」部，再数数「诚」字除去部首还有几画……④按照页码，在正文中就可以查到「诚」字了。对韵：美对丑，爱对恨。真诚对虚假，热忱对冷漠。贫对富，冷对暖。
  teaching_boundary:
    scope_allowed:
    - 说出部首查字法的四个步骤
    - 用部首查字法查出生字的读音与页码
    - 积累对韵语句
    scope_excluded:
    - 音序查字法的系统讲解
    - 汉字部首的系统分类
