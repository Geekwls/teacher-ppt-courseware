teaching_references:
- point_id: chi-g2-t1-u06-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「细节见品质」为阅读线索，从「拨了拨灯芯」「写上自己的名字」等细节体会人物品质
    difficulty: 学生易把两篇课文的主人公（毛主席、朱德）与事件对应错
    typical_misconceptions:
    - error_pattern: 把两篇课文的主人公与事件对应错
      misconception_type: 内容混淆
    - error_pattern: 说不出细节体现的品质
      misconception_type: 细节阅读不到位
  variation_strategy:
  - 朗读课文并说出人物品质
  - 讲一讲自己知道的革命先辈的故事
- point_id: chi-g2-t1-u06-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「难忘」与「英勇不屈」为情感支点，在朗读中体会人物形象
    difficulty: 学生易把泼水节的民族（傣族）说错，或说不出刘胡兰的年龄
    typical_misconceptions:
    - error_pattern: 把傣族说成其他民族
      misconception_type: 民族常识错误
    - error_pattern: 说不出刘胡兰的品质
      misconception_type: 主旨理解不到位
  variation_strategy:
  - 朗读课文并说说为什么「难忘」
  - 说说刘胡兰身上值得我们学习的地方
