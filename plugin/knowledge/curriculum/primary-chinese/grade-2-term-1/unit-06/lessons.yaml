  - 火红
  - 人民
  - 因为
  - 为了
  - 人群
  - 四面八方
  - 总理
  - 人们
  - 开心
  official_examples:
  - 火红火红的凤凰花开了，傣族人民一年一度的泼水节到了。
  - 周总理身穿对襟白褂，咖啡色长裤，头上包着一条水红色的头巾，笑容满面地来到人群中。
  - 周总理端着银碗，把水泼向傣族人民，祝福他们吉祥如意。傣族人民把水泼向周总理，祝愿他健康长寿。清清的水，泼呀，洒呀！多么幸福，多么难忘！
