  lesson_name: 14 八角楼上
  page_range: P67-P68
  core_writing_chars:
  - 楼
  - 代
  - 穿
  - 视
  - 利
  - 路
  core_vocab_words:
  - 年代
  - 明亮
  - 星星之火
  - 胜利
  - 白天
  official_examples:
  - 在井冈山艰苦斗争的年代，毛主席住在茅坪村的八角楼。每当夜幕降临的时候，八角楼上的灯就亮了。
  - 毛主席穿着单军衣，披着薄毯子，坐在竹椅上，写下了许多光辉著作，指引着中国革命走向胜利。
