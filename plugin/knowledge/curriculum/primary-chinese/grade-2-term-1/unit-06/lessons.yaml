  - 抬头
  - 消息
  official_examples:
  - 刘胡兰是山西省文水县云周西村人。她年纪轻轻就加入了中国共产党，积极参加抗日斗争。
  - 面对凶残的敌人，刘胡兰大义凛然，坚贞不屈。毛主席为她亲笔题词：“生的伟大，死的光荣”。
