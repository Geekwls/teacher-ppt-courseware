  page_range: P69-P71
  core_writing_chars:
  - 同
  - 志
  - 军
  - 敌
  - 常
  - 非
  - 每
  - 战
  - 士
  - 戴
  core_vocab_words:
  - 同志
  - 红军
  - 敌人
  - 生产
  - 战士
  - 一块儿
  - 常常
  - 来回
  - 非常
  official_examples:
  - 朱德同志常常同战士们一块儿挑粮。他穿着草鞋，戴着斗笠，挑起满满的一担粮食，跟大家一块儿爬山。
  - 战士们想：朱德同志工作那么忙，还要挑粮，累坏了可不行！就把他的扁担藏了起来。
  - 不料，朱德同志又找来一根扁担，在上面刻了“朱德的扁担”五个字。大家越发敬爱朱德同志了。
