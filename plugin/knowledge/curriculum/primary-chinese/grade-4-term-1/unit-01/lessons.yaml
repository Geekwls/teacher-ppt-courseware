  subject: chinese
  grade: 4
  term: term-1
  lesson_number: 1
  lesson_name: 1 观潮
  page_range: P2-P4
  official_examples:
  - 钱塘江大潮，自古以来被称为天下奇观。
  - 课文按照「潮来前—潮来时—潮头过后」的顺序描写钱塘江大潮。潮来时：那条白线很快地向我们移来，逐渐拉长，变粗，横贯江面……犹如千万匹白色战马齐头并进，浩浩荡荡地飞奔而来；那声音如同山崩地裂。
  - 课后题：有感情地朗读课文，背诵第 3～4 自然段；说说课文是按照什么顺序描写钱塘江大潮的；读《浪淘沙（其七）》，从课文中找出与诗的内容相关的句子。
- lesson_id: chi-g4-t1-u01-l02
  unit_id: unit-01
  subject: chinese
  grade: 4
  term: term-1
  lesson_number: 2
  lesson_name: 2 繁星
  page_range: P5-P6
  official_examples:
  - 课文描写了三次看繁星的情景：从前在家乡七八月的夜晚、三年前在南京、如今在海上。「海上的夜是柔和的，是静寂的，是梦幻的。」
  - 课后题：根据课文的描写，说说脑海中浮现出怎样的画面；课文描写了三次看繁星的情景，作者每次的感受有什么不同。
  - 小练笔：你也看过夜晚的星空吧？试着写写你当时的所见所感。
- lesson_id: chi-g4-t1-u01-l03
  unit_id: unit-01
  subject: chinese
  grade: 4
  term: term-1
  lesson_number: 3
  lesson_name: 3* 现代诗二首
  page_range: P7-P8
  official_examples:
  - 《秋晚的江上》（刘大白）：归巢的鸟儿，尽管是倦了，还驮着斜阳回去。双翅一翻，把斜阳掉在江上；头白的芦苇，也妆成一瞬的红颜了。
  - 《花牛歌》（徐志摩）：花牛在草地里坐，压扁了一穗剪秋罗。花牛在草地里眠，白云霸占了半个天……
  - 反复朗读两首诗，说说诗中描绘了哪些景物，这些景物构成了怎样的画面。
- lesson_id: chi-g4-t1-u01-l04
  unit_id: unit-01
  subject: chinese
  grade: 4
  term: term-1
  lesson_number: 4
  lesson_name: 口语交际·习作·语文园地
  page_range: P9-P12
  official_examples:
  - 口语交际《我们与环境》：围绕「身边存在哪些环境问题」「哪些环境问题得到了治理」「我们可以做些什么」交流，要求「围绕话题发表看法，不跑题」「判断别人的发言是否与话题相关」。
  - 习作《推荐一个好地方》：写出推荐的理由，吸引大家去看看；如果有多个理由可以分段说明，还可以插入图片增加吸引力。
  - 语文园地一：交流平台（根据文章中的描写想象画面，还能想象声音、闻到味道）；词句段运用（人声鼎沸、震耳欲聋、锣鼓喧天、响彻云霄、鸦雀无声、低声细语、窃窃私语、悄无声息）；体会每组句子的表达效果；书写提示（字的中心在横格中线上，字距要差不多）；日积月累《赠刘景文》。
