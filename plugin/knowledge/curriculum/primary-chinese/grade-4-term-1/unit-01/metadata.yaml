unit_overview: 本单元以「自然之美」为人文主题，编排了《观潮》《繁星》两篇精读课文和《现代诗二首》（《秋晚的江上》《花牛歌》）一篇略读课文，口语交际《我们与环境》、习作《推荐一个好地方》与语文园地一。本单元语文要素是「边读边想象画面，感受自然之美」；习作要素是「推荐一个好地方，写清楚推荐理由」。核心是引导学生在阅读中调动多种感官（看、听、闻）想象画面，在习作中把推荐理由写清楚、写充分。
