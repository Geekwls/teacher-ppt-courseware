teaching_references:
- point_id: chi-g4-t1-u08-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「为中华之崛起而读书」等故事为切入点，感受人物的爱国情怀与品格
    difficulty: 学生易只记住故事梗概而不能体会人物品格
    typical_misconceptions:
    - error_pattern: 只记梗概不体会品格
      misconception_type: 体会不深入
    - error_pattern: 把握主要内容时遗漏关键情节
      misconception_type: 概括不完整
  variation_strategy:
  - 说出人物的品格特点
  - 把握文章的主要内容
- point_id: chi-g4-t1-u08-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「给某个人写一封信」的真实交流任务，学习书信格式与表达
    difficulty: 学生易漏写祝语或署名日期
    typical_misconceptions:
    - error_pattern: 漏写祝语或署名日期
      misconception_type: 格式不完整
    - error_pattern: 正文内容不清楚
      misconception_type: 表达不明确
  variation_strategy:
  - 按格式写一封信
  - 把想说的话写清楚
