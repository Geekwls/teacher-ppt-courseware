unit_id: "unit-8"
blueprints:
  - blueprint_id: "bp-chi-g3-t1-u08-standard"
    title: "第八单元美好品质标准练习卷命题蓝图"
    target_practice: "单元综合巩固与能力提升练习"
    total_score: 100
    suggested_time_minutes: 60
    difficulty_ratio:
      basic: 0.60
      variation: 0.30
      challenge: 0.10
    question_slots:
      # 一、基础题（共 60 分）
      - slot_id: "slot-01"
        section: "一、字词芳草地：读拼音，写词语（规范书写在田字格中）"
        question_type: "writing"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u08-p01"]
        guidelines: "选自本单元课文重点词语，提供标准拼音，在规范田字格中工整书写（具体词语待课本页面凭证核定）。"

      - slot_id: "slot-02"
        section: "二、语音辨识营：给带点的字选择正确的读音打『√』"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u08-p01"]
        guidelines: "考查本单元课文中的多音字与易读错字，结合具体语境选音。"

      - slot_id: "slot-03"
        section: "三、词语积累屋：把下列词语补充完整"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 1
        item_count: 8
        target_points: ["chi-g3-t1-u08-p01"]
        guidelines: "考查本单元重点词语与语文园地积累内容（以课本页面为准）。"

      - slot_id: "slot-04"
        section: "四、字词比拼台：形近字组词"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u08-p01"]
        guidelines: "本单元形近字对比组词。"

      - slot_id: "slot-05"
        section: "五、课文回音壁：根据课文内容填空"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u08-p03"]
        guidelines: "考查《司马光》《一定要争气》《手术台就是阵地》《一个粗瓷大碗》的主要内容与人物事迹。"

      - slot_id: "slot-06"
        section: "六、带问题默读坊：带着问题理解课文内容"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u08-p02"]
        guidelines: "考查带着问题默读课文、借助注释理解文言文内容的方法。"

      - slot_id: "slot-07"
        section: "七、园地拾贝：语文园地积累运用"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 3
        item_count: 2
        target_points: ["chi-g3-t1-u08-p02"]
        guidelines: "考查语文园地梳理与交流、词句段运用与日积月累内容（以课本页面为准）。"

      # 二、变式题（共 30 分）
      - slot_id: "slot-08"
        section: "八、品质品读台：体会人物的美好品质"
        question_type: "choice"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u08-p03"]
        guidelines: "给出课文语句，要求判断人物品质并说明依据。"

      - slot_id: "slot-09"
        section: "九、交际小舞台：请教的表达"
        question_type: "writing"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u08-p04"]
        guidelines: "创设请教情境，写一两句请教的对话，要求问题说清楚、表达有礼貌。"

      - slot_id: "slot-10"
        section: "十、课外阅读吧：写人记事类语段阅读"
        question_type: "reading"
        difficulty: "variation"
        points_per_item: 7
        item_count: 2
        target_points: ["chi-g3-t1-u08-p02", "chi-g3-t1-u08-p03"]
        guidelines: "短文阅读，考查带着问题提取信息、概括内容以及体会人物品质。"

      # 三、挑战题（共 10 分）
      - slot_id: "slot-11"
        section: "十一、妙笔生花台：那次经历真难忘"
        question_type: "writing"
        difficulty: "challenge"
        points_per_item: 10
        item_count: 1
        target_points: ["chi-g3-t1-u08-p05"]
        guidelines: "写一次难忘的经历（150 字左右），要求按顺序把经过写清楚、表达真实感受、写出难忘之处。"
