    point_name: "课文人物形象与美好品质"
    learning_objectives:
      - "能说出司马光、童第周、白求恩、赵一曼等人物的事迹与品质"
      - "能结合课文中的具体语句，体会人物冷静机智、勤奋爱国、极端负责、不畏艰苦等美好品质"
      - "能联系生活谈自己受到的启发"
    applicable_question_types: ["reading", "fill_blank", "writing"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P96", "P97", "P100", "P103"]
      anchor_text: "依课本目录登记的课文页码范围；四篇课文分别写司马光（冷静机智、爱护同伴）、童第周（勤奋学习、为国争光）、白求恩（对工作极端负责、为革命献身）、赵一曼（不畏艰苦、关心他人），人物形象与品质待补课本页面原文凭证后细化。"
