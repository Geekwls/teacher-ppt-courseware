unit_overview: >
  本单元以「美好品质」为人文主题，编排了《司马光》（文言文）、《一定要争气》《手术台就是阵地》
  三篇精读课文和《一个粗瓷大碗》一篇略读课文，以及口语交际《请教》、习作《那次经历真难忘》和语文园地。
  本单元阅读方面的语文要素是「学习带着问题默读，理解课文内容」，
  引导学生在默读中带着问题思考，理解课文内容，感受司马光的冷静机智、童第周的勤奋好学、
  白求恩的极端负责和赵一曼的不畏艰苦等美好品质。
