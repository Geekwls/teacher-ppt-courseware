unit_overview: >
  本单元以「珍爱自然」为人文主题，编排了《古诗三首》《大自然的声音》《读不完的大书》三篇精读课文，
  以及口语交际《身边的「小事」》、习作《我有一个想法》和语文园地。
  本单元阅读方面的语文要素是「感受课文生动的语言，积累喜欢的语句」，
  引导学生在阅读中感受课文生动的语言，学习摘抄、积累自己喜欢的语句，培养珍爱自然的情感。
