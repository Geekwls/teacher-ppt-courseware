    lesson_name: "第20课 古诗三首"
    page_range: "P84-P85"
    official_examples:
      - "2024 版《古诗三首》篇目为《鹿柴》（唐·王维）、《望天门山》（唐·李白）、《饮湖上初晴后雨》（宋·苏轼）。"
      - "课后题引导学生朗读、背诵古诗，想象诗中描绘的画面，体会诗人的情感。"
      - "（严禁混入《望洞庭》等旧版篇目；原文与生字表以课本页面为准，待补凭证。）"

