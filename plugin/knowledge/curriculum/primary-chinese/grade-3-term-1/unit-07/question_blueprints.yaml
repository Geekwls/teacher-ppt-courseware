unit_id: "unit-7"
blueprints:
  - blueprint_id: "bp-chi-g3-t1-u07-standard"
    title: "第七单元珍爱自然标准练习卷命题蓝图"
    target_practice: "单元综合巩固与能力提升练习"
    total_score: 100
    suggested_time_minutes: 60
    difficulty_ratio:
      basic: 0.60
      variation: 0.30
      challenge: 0.10
    question_slots:
      # 一、基础题（共 60 分）
      - slot_id: "slot-01"
        section: "一、字词芳草地：读拼音，写词语（规范书写在田字格中）"
        question_type: "writing"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u07-p01"]
        guidelines: "选自本单元课文重点词语，提供标准拼音，在规范田字格中工整书写（具体词语待课本页面凭证核定）。"

      - slot_id: "slot-02"
        section: "二、语音辨识营：给带点的字选择正确的读音打『√』"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u07-p01"]
        guidelines: "考查本单元课文中的多音字与易读错字，结合具体语境选音。"

      - slot_id: "slot-03"
        section: "三、词语积累屋：把下列词语补充完整"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 1
        item_count: 8
        target_points: ["chi-g3-t1-u07-p01"]
        guidelines: "考查本单元重点词语与语文园地积累内容（以课本页面为准）。"

      - slot_id: "slot-04"
        section: "四、字词比拼台：形近字组词"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u07-p01"]
        guidelines: "本单元形近字对比组词。"

      - slot_id: "slot-05"
        section: "五、古诗诵读台：古诗填空与默写"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u07-p03"]
        guidelines: "考查《鹿柴》《望天门山》《饮湖上初晴后雨》的诗句填空与默写（严禁涉及《望洞庭》等非本单元古诗）。"

      - slot_id: "slot-06"
        section: "六、语言品读坊：感受课文生动的语言"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u07-p02"]
        guidelines: "考查对《大自然的声音》《读不完的大书》等课文中生动语句的感受与理解。"

      - slot_id: "slot-07"
        section: "七、园地拾贝：语文园地积累运用"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 3
        item_count: 2
        target_points: ["chi-g3-t1-u07-p04"]
        guidelines: "考查语文园地梳理与交流、词句段运用与日积月累内容（以课本页面为准）。"

      # 二、变式题（共 30 分）
      - slot_id: "slot-08"
        section: "八、摘抄实践场：学习摘抄的方法"
        question_type: "choice"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u07-p04"]
        guidelines: "给出语段，要求按要求摘抄喜欢的语句并注明出处，或判断摘抄是否规范。"

      - slot_id: "slot-09"
        section: "九、生动语言仿写台：仿写生动的语句"
        question_type: "writing"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u07-p02"]
        guidelines: "仿照课文中生动的语句写一两句话，要求语言生动、语句通顺。"

      - slot_id: "slot-10"
        section: "十、课外阅读吧：写景写声类语段阅读"
        question_type: "reading"
        difficulty: "variation"
        points_per_item: 7
        item_count: 2
        target_points: ["chi-g3-t1-u07-p02", "chi-g3-t1-u07-p04"]
        guidelines: "短文阅读，考查提取信息、感受生动语言以及按要求摘抄语句。"

      # 三、挑战题（共 10 分）
      - slot_id: "slot-11"
        section: "十一、妙笔生花台：我有一个想法"
        question_type: "writing"
        difficulty: "challenge"
        points_per_item: 10
        item_count: 1
        target_points: ["chi-g3-t1-u07-p05"]
        guidelines: "围绕生活中发现的一个问题写清自己的想法（150 字左右），要求问题写清楚、想法写明白、尝试提出合理建议。"
