unit_overview: >
  本单元以「金秋时节」为人文主题，编排了《古诗三首》（《望洞庭》《山行》《夜书所见》）、
  《铺满金色巴掌的水泥道》、《秋天的雨》三篇精读课文和《听听，秋的声音》一篇略读课文。
  本单元语文要素是「运用多种方法理解难懂的词语」；习作要素是「学习写日记」。
  识字写字教学要求掌握本单元会认、会写生字，熟练辨析多音字「挑、铺、曲、扇」；
  结合具体语境积累描写秋天的词语和成语。
