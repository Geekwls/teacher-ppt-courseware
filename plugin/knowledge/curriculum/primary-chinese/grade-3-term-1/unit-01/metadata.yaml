unit_overview: >
  本单元以「校园生活」为人文主题，编排了《大青树下的小学》《花的学校》两篇精读课文和
  《不懂就要问》一篇略读课文，以及口语交际《我的暑假生活》、习作《猜猜他是谁》和语文园地一。
  本单元语文要素是「阅读时，关注有新鲜感的词语和句子」；习作要素是「体会习作的乐趣」。
  识字写字要求掌握本单元会认、会写生字，辨析多音字「假、晃、挨、背、圈、觉」，
  并结合语境积累描写人物动作、神态的成语。
