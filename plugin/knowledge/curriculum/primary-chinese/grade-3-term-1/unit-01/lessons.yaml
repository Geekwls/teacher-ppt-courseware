lessons:
  - lesson_id: "chi-g3-t1-u01-l01"
    unit_id: "unit-1"
    subject: "chinese"
    grade: 3
    term: "term-1"
    lesson_number: 1
    lesson_name: "第1课 大青树下的小学"
    page_range: "P2-P4"
    official_examples:
      - "早晨，从山坡上，从坪坝里，从一条条开着绒球花和太阳花的小路上，走来了许多小学生……"
      - "同学们向在校园里欢唱的小鸟打招呼，向敬爱的老师问好，向高高飘扬的国旗敬礼。"
      - "这时候，窗外十分安静，树枝不摇了，鸟儿不叫了，蝴蝶停在花朵上，好像都在听同学们读课文。"
      - "这就是我们可爱的小学，一所边疆的小学。"
      - "会认字（带拼音）：坝 bà、绒 róng、傣 dǎi、颇 pō、昂 áng、德 dé、跤 jiāo、疆 jiāng、耍 shuǎ、凤 fèng、墙 qiáng、晃 huàng。"
      - "会写字：坡、招、球、呼、扬、读、热、闹、洁、粗、飘、壮。"

  - lesson_id: "chi-g3-t1-u01-l02"
    unit_id: "unit-1"
    subject: "chinese"
    grade: 3
    term: "term-1"
    lesson_number: 2
    lesson_name: "第2课 花的学校"
    page_range: "P5-P6"
    official_examples:
      - "当雷云在天上轰响，六月的阵雨落下的时候，湿润的东风走过荒野，在竹林中吹着风笛。"
      - "于是，一群一群的花从无人知道的地方突然跑出来，在绿草上跳舞，狂欢。"
      - "树枝在林中互相碰触着，绿叶在狂风里簌簌地响，雷云拍着大手。"
      - "雨一来，他们便放假了。"
      - "会认字（带拼音）：轰 hōng、湿 shī、荒 huāng、笛 dí、罚 fá、假 jià、臂 bì、簌 sù。"
      - "会写字：轰、润、湿、笛、功、狂、罚、碰、互、急、黄。"
      - "资料袋：泰戈尔，印度作家、诗人，曾获 1913 年诺贝尔文学奖，主要作品有《吉檀迦利》《新月集》《园丁集》《飞鸟集》等。"

  - lesson_id: "chi-g3-t1-u01-l03"
    unit_id: "unit-1"
    subject: "chinese"
    grade: 3
    term: "term-1"
    lesson_number: 3
    lesson_name: "第3课 不懂就要问（略读）"
    page_range: "P7-P8"
    official_examples:
      - "孙中山小时候在私塾读书。……至于书里的意思，先生从来不讲。"
      - "孙中山想：这样糊里糊涂地背，有什么用呢？于是，他壮着胆子站起来，问：「先生，您刚才让我背的这段书是什么意思？请您给我讲讲吧！」"
      - "孙中山笑了笑，说：「学问学问，不懂就要问。为了弄清楚道理，就是挨打也值得。」"
      - "会认字（带拼音）：私 sī、塾 shú、诵 sòng、例 lì、糊 hú、戒 jiè、厉 lì、详 xiáng、挨 ái。"
      - "默读课文，想想课文讲了一件什么事，谈谈你对这件事的看法。把你觉得有新鲜感的词句画下来，和同学交流。"

  - lesson_id: "chi-g3-t1-u01-l04"
    unit_id: "unit-1"
    subject: "chinese"
    grade: 3
    term: "term-1"
    lesson_number: 4
    lesson_name: "口语交际（我的暑假生活）与习作（猜猜他是谁）"
    page_range: "P9-P10"
    official_examples:
      - "口语交际《我的暑假生活》：选择别人可能感兴趣的内容讲；借助图片或实物讲。"
      - "习作《猜猜他是谁》：选择一个同学，用几句话或一段话写一写他，文中不能出现他的名字，要让别人读了能猜出写的是谁。"
      - "写的时候，注意一段话的开头要空两格。"

  - lesson_id: "chi-g3-t1-u01-l05"
    unit_id: "unit-1"
    subject: "chinese"
    grade: 3
    term: "term-1"
    lesson_number: 5
    lesson_name: "语文园地一"
    page_range: "P11-P12"
    official_examples:
      - "交流平台：有新鲜感的词句往往能带给我们新奇的体验和感受。"
      - "词句段运用成语：摇头晃脑、披头散发、张牙舞爪、提心吊胆、面红耳赤、手忙脚乱、手疾眼快、口干舌燥。"
      - "日积月累《所见》[清] 袁枚：牧童骑黄牛，歌声振林樾。意欲捕鸣蝉，忽然闭口立。"
      - "给兴趣小组取名字：篮球侠、巧手剪纸组、探索者小队、黑白棋社、鲲鹏航模队。"
