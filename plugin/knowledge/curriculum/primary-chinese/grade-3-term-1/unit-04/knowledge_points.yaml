    point_name: "感受童话丰富的想象，体会其中的真善美（单元核心语文要素）"
    learning_objectives:
      - "能感受童话中丰富而奇特的想象，说出故事里想象奇妙的地方"
      - "能体会童话故事所蕴含的真、善、美，说出自己受到的启发"
      - "能带着想象阅读童话，把无生命的物当作有生命的人来读"
