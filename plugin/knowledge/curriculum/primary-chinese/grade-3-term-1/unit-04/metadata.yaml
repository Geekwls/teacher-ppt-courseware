unit_overview: >
  本单元以「童话世界」为人文主题，人文导语为「阅读童话，构筑充满童心的精神乐园」。
  教材编排了《宝葫芦的秘密（节选）》《在牛肚子里旅行》两篇精读课文和《一块奶酪》一篇略读课文，
  以及习作《我来编童话》、语文园地和快乐读书吧《在那奇妙的王国里》。
  本单元阅读方面的语文要素是「感受童话丰富的想象，体会其中的真善美」，
  引导学生在阅读童话中展开想象，体会童话故事所蕴含的真、善、美。
