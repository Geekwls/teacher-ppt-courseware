unit_id: "unit-5"
blueprints:
  - blueprint_id: "bp-chi-g3-t1-u05-standard"
    title: "第五单元留心观察标准练习卷命题蓝图"
    target_practice: "单元综合巩固与能力提升练习"
    total_score: 100
    suggested_time_minutes: 60
    difficulty_ratio:
      basic: 0.60
      variation: 0.30
      challenge: 0.10
    question_slots:
      # 一、基础题（共 60 分）
      - slot_id: "slot-01"
        section: "一、字词芳草地：读拼音，写词语（规范书写在田字格中）"
        question_type: "writing"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u05-p01"]
        guidelines: "选自本单元课文重点词语，提供标准拼音，在规范田字格中工整书写（具体词语待课本页面凭证核定）。"

      - slot_id: "slot-02"
        section: "二、语音辨识营：给带点的字选择正确的读音打『√』"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u05-p01"]
        guidelines: "考查本单元课文中的多音字与易读错字，结合具体语境选音。"

      - slot_id: "slot-03"
        section: "三、词语积累屋：把下列词语补充完整"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 1
        item_count: 8
        target_points: ["chi-g3-t1-u05-p01"]
        guidelines: "考查本单元重点词语与语文园地积累内容（以课本页面为准）。"

      - slot_id: "slot-04"
        section: "四、字词比拼台：形近字组词"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u05-p01"]
        guidelines: "本单元形近字对比组词。"

      - slot_id: "slot-05"
        section: "五、课文回音壁：根据课文内容填空"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u05-p02"]
        guidelines: "考查《搭船的鸟》《金色的草地》的主要内容与作者的观察所得。"

      - slot_id: "slot-06"
        section: "六、观察放大镜：体会作者留心观察的方法"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u05-p02"]
        guidelines: "考查作者留心观察的语句，判断作者观察的对象与方法。"

      - slot_id: "slot-07"
        section: "七、园地拾贝：语文园地积累运用"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 3
        item_count: 2
        target_points: ["chi-g3-t1-u05-p04"]
        guidelines: "考查语文园地梳理与交流、初试身手与词句段运用内容（以课本页面为准）。"

      # 二、变式题（共 30 分）
      - slot_id: "slot-08"
        section: "八、感官总动员：调动多种感官观察"
        question_type: "choice"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u05-p04"]
        guidelines: "给出观察情境，要求判断运用了哪些感官，或选择恰当的观察方式并说明理由。"

      - slot_id: "slot-09"
        section: "九、变化发现站：注意事物的变化"
        question_type: "writing"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u05-p04"]
        guidelines: "结合《金色的草地》等课文，写一两句话说明事物发生的变化及自己的发现。"

      - slot_id: "slot-10"
        section: "十、课外阅读吧：观察类语段阅读"
        question_type: "reading"
        difficulty: "variation"
        points_per_item: 7
        item_count: 2
        target_points: ["chi-g3-t1-u05-p02", "chi-g3-t1-u05-p04"]
        guidelines: "短文阅读，考查提取信息、体会作者留心观察的方法以及调动感官观察的写法。"

      # 三、挑战题（共 10 分）
      - slot_id: "slot-11"
        section: "十一、妙笔生花台：我们眼中的缤纷世界"
        question_type: "writing"
        difficulty: "challenge"
        points_per_item: 10
        item_count: 1
        target_points: ["chi-g3-t1-u05-p03"]
        guidelines: "仔细观察一种事物或一处景物，把观察所得写下来（150 字左右），要求观察细致、顺序清楚、写出特点。"
