unit_overview: >
  本单元是习作单元，围绕「留心观察」主题编排。教材编排了《搭船的鸟》《金色的草地》两篇精读课文，
  以及习作《我们眼中的缤纷世界》和习作例文《我爱故乡的杨梅》。
  本单元阅读方面的语文要素是「体会作者是怎样留心观察周围事物的」，
  习作方面的语文要素是「仔细观察，把观察所得写下来」。
  单元引导学生在阅读中体会作者留心观察、细致表达的方法，并迁移到自己的观察与习作中。
