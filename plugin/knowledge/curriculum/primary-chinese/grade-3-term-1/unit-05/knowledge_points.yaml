    subject: "chinese"
    grade: 3
    term: "term-1"
    point_name: "本单元生字词的认读与规范书写"
    learning_objectives:
      - "认读并规范书写本单元要求会认、会写的生字，注意易错笔画与间架结构"
      - "能看拼音写词语，正确默写课文中的重点词语"
    applicable_question_types: ["writing", "fill_blank"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P60", "P62"]
      anchor_text: "识字表/写字表页码锚点依课本目录登记；因用户提供的电子课本预览未含第五单元正文页，具体生字清单待补课本页面凭证后核定。"
    teaching_boundary:
      scope_allowed:
        - "本单元会认、会写生字的认读与田字格规范书写"
        - "看拼音写词语、形近字对比组词"
      scope_excluded:
        - "未在本单元课文中出现的字词"
        - "超出三年级上册范围的生僻汉字"

  - point_id: "chi-g3-t1-u05-p02"
    unit_id: "unit-5"
    lesson_id: "chi-g3-t1-u05-l01"
    subject: "chinese"
    grade: 3
    term: "term-1"
    point_name: "体会作者是怎样留心观察周围事物的（单元阅读要素）"
    learning_objectives:
      - "能找出课文中体现作者留心观察的语句，说出作者观察了什么"
      - "能体会作者观察的细致，说出作者是怎样把观察到的事物写清楚的"
      - "能学习作者留心观察的态度，养成在生活中细致观察的习惯"
    applicable_question_types: ["reading", "choice", "fill_blank"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P59", "P60"]
      anchor_text: "教师教学用书第五单元单元说明（教参 P126）：本单元阅读方面的语文要素是「体会作者是怎样留心观察周围事物的」；《搭船的鸟》课后题引导学生体会作者留心观察的方法。"
    teaching_boundary:
      scope_allowed:
        - "找出体现留心观察的语句并说明观察对象"
        - "体会作者细致观察、把事物写清楚的方法"
      scope_excluded:
        - "脱离文本的泛泛而谈"
        - "文学理论层面的描写技法系统分析"

  - point_id: "chi-g3-t1-u05-p03"
    unit_id: "unit-5"
    lesson_id: "chi-g3-t1-u05-l03"
    subject: "chinese"
    grade: 3
    term: "term-1"
    point_name: "仔细观察，把观察所得写下来（单元习作要素）"
    learning_objectives:
      - "能仔细观察一种事物或一处景物，把观察所得按一定顺序写下来"
      - "能把观察到的内容写清楚，写出事物的特点"
      - "能借助习作例文，学习把观察所得写具体的方法"
    applicable_question_types: ["writing", "choice"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P65", "P67"]
      anchor_text: "教师教学用书第五单元单元说明（教参 P126）：本单元习作方面的语文要素是「仔细观察，把观察所得写下来」；习作《我们眼中的缤纷世界》与习作例文《我爱故乡的杨梅》示范观察所得的记录方法。"
    teaching_boundary:
      scope_allowed:
        - "按一定顺序写观察所得，写出事物特点"
        - "借助例文迁移观察与描写的方法"
      scope_excluded:
        - "完整记叙文的谋篇布局与高级写作技法"
        - "脱离实际观察的凭空虚构"

  - point_id: "chi-g3-t1-u05-p04"
    unit_id: "unit-5"
    lesson_id: "chi-g3-t1-u05-l02"
    subject: "chinese"
    grade: 3
    term: "term-1"
    point_name: "观察的方法：调动多种感官、注意事物的变化"
    learning_objectives:
      - "知道观察可以调动多种感官：看、听、摸、闻、尝"
      - "能注意事物的变化，如《金色的草地》中草地颜色的变化"
      - "能运用多种感官观察事物，并把自己的发现记录下来"
    applicable_question_types: ["reading", "choice", "fill_blank", "writing"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P62", "P64"]
      anchor_text: "《金色的草地》写草地颜色的变化，引导学生在观察中注意事物的变化；语文园地「梳理与交流」「初试身手」提示调动多种感官观察。（据教参 P131、P135）"
    teaching_boundary:
      scope_allowed:
        - "说出并运用看、听、摸、闻、尝等多种感官进行观察"
        - "注意事物的变化并记录观察所得"
      scope_excluded:
        - "脱离具体事物的抽象观察方法论述"
        - "超出三年级范围的科学观察实验设计"
