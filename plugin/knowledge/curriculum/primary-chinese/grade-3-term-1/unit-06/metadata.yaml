unit_overview: >
  本单元以「祖国山河」为人文主题，编排了《富饶的西沙群岛》《海滨小城》《美丽的小兴安岭》三篇精读课文
  和《香港，璀璨的明珠》一篇略读课文，以及习作《这儿真美》和语文园地。
  本单元阅读方面的语文要素是「借助关键语句理解一段话的意思」，
  引导学生在阅读中找出关键语句、借助关键语句理解段落内容，感受祖国山河的美丽与富饶。
  语文园地日积月累为《早发白帝城》。
