unit_id: "unit-3"
blueprints:
  - blueprint_id: "bp-chi-g3-t1-u03-standard"
    title: "第三单元预测与猜想标准练习卷命题蓝图"
    target_practice: "单元综合巩固与能力提升练习"
    total_score: 100
    suggested_time_minutes: 60
    difficulty_ratio:
      basic: 0.60
      variation: 0.30
      challenge: 0.10
    question_slots:
      # 一、基础题（共 60 分）
      - slot_id: "slot-01"
        section: "一、字词芳草地：读拼音，写词语（规范书写在田字格中）"
        question_type: "writing"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u03-p01"]
        guidelines: "选自本单元课文重点词语，提供标准拼音，在规范田字格中工整书写（具体词语待课本页面凭证核定）。"

      - slot_id: "slot-02"
        section: "二、语音辨识营：给带点的字选择正确的读音打『√』"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u03-p01"]
        guidelines: "考查本单元课文中的多音字与易读错字，结合具体语境选音。"

      - slot_id: "slot-03"
        section: "三、词语积累屋：把下列词语补充完整"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 1
        item_count: 8
        target_points: ["chi-g3-t1-u03-p01"]
        guidelines: "考查本单元重点词语与语文园地三积累内容（以课本页面为准）。"

      - slot_id: "slot-04"
        section: "四、字词比拼台：形近字组词"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 4
        target_points: ["chi-g3-t1-u03-p01"]
        guidelines: "本单元形近字对比组词。"

      - slot_id: "slot-05"
        section: "五、课文回音壁：根据课文内容填空"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u03-p04"]
        guidelines: "考查《总也倒不了的老屋》《犟龟》《小狗学叫》的主要内容与角色表现。"

      - slot_id: "slot-06"
        section: "六、预测方法屋：判断预测的依据"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 2
        item_count: 5
        target_points: ["chi-g3-t1-u03-p02"]
        guidelines: "考查预测的依据（题目、插图、文章内容线索），判断某项预测是否合理并说明理由。"

      - slot_id: "slot-07"
        section: "七、园地拾贝：语文园地三积累运用"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 3
        item_count: 2
        target_points: ["chi-g3-t1-u03-p04"]
        guidelines: "考查语文园地三梳理与交流、词句段运用与日积月累内容（以课本页面为准）。"

      # 二、变式题（共 30 分）
      - slot_id: "slot-08"
        section: "八、预测实践场：边读边预测"
        question_type: "choice"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u03-p02", "chi-g3-t1-u03-p03"]
        guidelines: "给出故事片段，要求学生作出有依据的预测，并比较自己的预测与原文的异同。"

      - slot_id: "slot-09"
        section: "九、想象芳草地：根据提示续猜情节"
        question_type: "writing"
        difficulty: "variation"
        points_per_item: 4
        item_count: 2
        target_points: ["chi-g3-t1-u03-p03"]
        guidelines: "根据前文线索，续写一两句话预测故事的发展，要求说明预测依据。"

      - slot_id: "slot-10"
        section: "十、课外阅读吧：童话语段阅读"
        question_type: "reading"
        difficulty: "variation"
        points_per_item: 7
        item_count: 2
        target_points: ["chi-g3-t1-u03-p02", "chi-g3-t1-u03-p04"]
        guidelines: "短文阅读，考查提取信息、作出有依据的预测以及概括角色特点。"

      # 三、挑战题（共 10 分）
      - slot_id: "slot-11"
        section: "十一、妙笔生花台：续写故事"
        question_type: "writing"
        difficulty: "challenge"
        points_per_item: 10
        item_count: 1
        target_points: ["chi-g3-t1-u03-p05"]
        guidelines: "根据给定图意或开头续写故事（150 字左右），要求情节合理、前后连贯、有完整结尾。"
