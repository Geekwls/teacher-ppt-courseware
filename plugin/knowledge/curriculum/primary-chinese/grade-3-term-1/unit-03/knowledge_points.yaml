  - point_id: "chi-g3-t1-u03-p02"
    unit_id: "unit-3"
    lesson_id: "chi-g3-t1-u03-l01"
    subject: "chinese"
    grade: 3
    term: "term-1"
    point_name: "预测的基本方法（单元核心语文要素）"
    learning_objectives:
      - "了解预测是阅读时根据已有线索猜想下文的有意识阅读策略"
      - "知道预测要有依据：可以依据题目、插图、文章内容里的一些线索进行预测"
      - "能在阅读中主动预测，并把自己的预测与原文内容进行比较、验证"
    applicable_question_types: ["reading", "choice", "fill_blank"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P28"]
      anchor_text: "教师教学用书第三单元单元说明（教参 P58）：本单元阅读方面的语文要素是「了解预测的基本方法并尝试运用」；《总也倒不了的老屋》的旁批提示学生可以根据题目、插图、文章内容里的一些线索进行预测。"
    teaching_boundary:
      scope_allowed:
        - "识别预测的依据（题目、插图、内容线索）"
        - "判断预测是否合理、说明预测理由"
      scope_excluded:
        - "脱离文本依据的随意猜想"
        - "文学理论层面的接受美学分析"

  - point_id: "chi-g3-t1-u03-p03"
    unit_id: "unit-3"
    lesson_id: "chi-g3-t1-u03-l02"
    subject: "chinese"
    grade: 3
    term: "term-1"
    point_name: "边阅读边预测故事发展并验证"
    learning_objectives:
      - "能边阅读边预测故事的发展，运用预测策略理解课文内容"
      - "能在预测后与原文比对，体会预测正确或不同时的阅读乐趣"
      - "能结合角色形象，对故事结局作出有依据的预测"
    applicable_question_types: ["reading", "writing", "choice"]
    verification_status: "partial"
    provenance:
      source_id: "pep_chinese_g3_t1_2024"
      page_ref: ["P32", "P36"]
      anchor_text: "《犟龟》学习提示「边阅读边预测故事的发展，总结角色形象」；《小狗学叫》学习提示运用预测策略猜想故事结局。（据教参 P58–P59 单元说明）"
    teaching_boundary:
      scope_allowed:
        - "根据前文线索预测后文情节或结局，并说明依据"
        - "比较自己的预测与原文的异同"
      scope_excluded:
        - "要求唯一正确答案的预测题（预测允许多种合理可能）"

