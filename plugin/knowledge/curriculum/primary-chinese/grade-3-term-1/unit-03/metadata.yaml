unit_overview: >
  本单元是阅读策略单元，围绕「预测与猜想」主题编排。人文导语为「猜测与推想，使我们的阅读之旅充满了乐趣」。
  教材编排了《总也倒不了的老屋》《犟龟》《小狗学叫》三篇课文，以及口语交际《名字里的故事》、
  习作《续写故事》和语文园地三。本单元阅读方面的语文要素是「了解预测的基本方法并尝试运用」，
  引导学生把无意识的阅读心理转变为有意识的阅读策略，在预测与验证的过程中体验阅读的趣味。
  注意：2024 版本单元为预测策略单元（旧版该内容位于第四单元），命题不得沿用旧版编排。
