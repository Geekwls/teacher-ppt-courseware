teaching_references:
- point_id: chi-g1-t2-u06-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「夏日池塘」的共通情境把两首诗联系起来，借助画面理解诗句
    difficulty: 学生易把两首诗的作者与内容张冠李戴
    typical_misconceptions:
    - error_pattern: 把《池上》与《小池》的内容记混
      misconception_type: 两首诗混淆
    - error_pattern: 说不出「小荷才露尖尖角」的意思
      misconception_type: 诗句理解不到位
  variation_strategy:
  - 配画朗读并背诵两首诗
  - 说出诗中描写的景物
- point_id: chi-g1-t2-u06-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以角色朗读的方式读《荷叶圆圆》，以「下雨前有什么变化」为线索读《要下雨了》
    difficulty: 学生易把「燕子低飞、鱼游水面、蚂蚁搬家」等下雨前的现象遗漏
    typical_misconceptions:
    - error_pattern: 说不出下雨前的自然现象
      misconception_type: 课文信息提取不全
    - error_pattern: 分角色朗读时角色台词错位
      misconception_type: 角色朗读不到位
  variation_strategy:
  - 分角色朗读《荷叶圆圆》
  - 说说下雨前有哪些变化
