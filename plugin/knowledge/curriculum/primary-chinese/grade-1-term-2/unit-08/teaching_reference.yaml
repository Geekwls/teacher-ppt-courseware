teaching_references:
- point_id: chi-g1-t2-u08-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「谁能治好棉花姑娘的病」为线索，在比较中认识不同动物的本领
    difficulty: 学生易把燕子、啄木鸟、青蛙的本领对应错
    typical_misconceptions:
    - error_pattern: 把「捉空中飞的害虫」与「捉树干里的害虫」对应错
      misconception_type: 本领对应错误
    - error_pattern: 说不出最后是谁治好了棉花姑娘的病
      misconception_type: 情节遗漏
  variation_strategy:
  - 连一连：动物与它的本领
  - 分角色朗读《棉花姑娘》
- point_id: chi-g1-t2-u08-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「传言是怎样变形的」帮助理解《咕咚》，以「尾巴有什么用」帮助理解《小壁虎借尾巴》
    difficulty: 学生易把各种动物尾巴的作用对应错
    typical_misconceptions:
    - error_pattern: 把「小鱼用尾巴拨水」与「老牛用尾巴赶蝇子」对应错
      misconception_type: 尾巴功能对应错误
    - error_pattern: 说不出「咕咚」是什么
      misconception_type: 课文内容理解不到位
  variation_strategy:
  - 连一连：动物与它尾巴的作用
  - 说说遇到传言应该怎么办
