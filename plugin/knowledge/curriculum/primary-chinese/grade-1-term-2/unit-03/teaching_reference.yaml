teaching_references:
- point_id: chi-g1-t2-u03-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「伙伴之间怎样互相帮助」为线索，把朗读与情感体验结合起来
    difficulty: 学生易把「小公鸡捉虫给小鸭子吃」与「小鸭子捉鱼给小公鸡吃」的情节记混
    typical_misconceptions:
    - error_pattern: 把两个互相帮助的情节记混
      misconception_type: 课文内容混淆
    - error_pattern: 说不出「孤单」的意思
      misconception_type: 关键词未理解
  variation_strategy:
  - 分角色朗读并复述情节
  - 用「因为……所以……」说说喜鹊快乐的原因
- point_id: chi-g1-t2-u03-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「一个人玩、两个人玩、许多人玩都快乐」的结构帮助学生体会积极乐观的生活态度
    difficulty: 学生易把三种玩法与相应的游戏对应错
    typical_misconceptions:
    - error_pattern: 把「一个人玩」的游戏说成「许多人玩」的
      misconception_type: 内容对应错误
    - error_pattern: 朗读时读不出快乐的情绪
      misconception_type: 情感朗读不到位
  variation_strategy:
  - 朗读课文并说出三种玩法
  - 说说自己最喜欢和谁一起玩什么
