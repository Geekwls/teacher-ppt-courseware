- point_id: chi-g1-t2-u01-p01
  unit_id: unit-01
  lesson_id: chi-g1-t2-u01-l01
  subject: chinese
  grade: 1
  term: term-2
  point_name: 识字：春夏秋冬（四季词语与动词）
  learning_objectives:
  - 能认读「春、风、吹、夏、雨、落、秋、霜、降、冬、雪、飘」
  - 能说出四季的典型景物并用「春风、夏雨、秋霜、冬雪」等词语说话
  applicable_question_types:
  - fill_blank
  - reading
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t2_2024
    page_ref:
    - P2
    - P3
    anchor_text: P2「春夏秋冬」：春风、夏雨、秋霜、冬雪（吹、落、降、飘）；P3「青草、红花、游鱼、飞鸟」「池草青，山花红，鱼出水，鸟入林」。
  teaching_boundary:
    scope_allowed:
    - 认读四季词语与「吹、落、降、飘」等动词
    - 用词语说出四季景物
    scope_excluded:
    - 四季成因的科学解释
    - 写话
- point_id: chi-g1-t2-u01-p02
  unit_id: unit-01
  lesson_id: chi-g1-t2-u01-l02
  subject: chinese
  grade: 1
  term: term-2
  point_name: 识字：姓氏歌（问答式识字与拆字识字）
  learning_objectives:
  - 能朗读、背诵《姓氏歌》，能用「你姓什么？我姓×。什么×？……」做问答游戏
  - 能通过「木子李、弓长张、古月胡、口天吴」等发现「合字成姓」的规律
  applicable_question_types:
  - reading
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t2_2024
    page_ref:
    - P4
    - P5
    anchor_text: P4「姓氏歌」：你姓什么？我姓李。什么李？木子李。他姓什么？他姓张。什么张？弓长张。古月胡，口天吴，双人徐，言午许。中国姓氏有很多，赵、钱、孙、李，周、吴、郑、王，诸葛、东方，上官、欧阳……；P5「照样子做问答游戏」与「介绍自己姓什么，可以用不同的方法」。
  teaching_boundary:
    scope_allowed:
    - 朗读、背诵《姓氏歌》
    - 用问答句式介绍自己的姓
    - 说出常见姓氏
    scope_excluded:
    - 中国姓氏的系统源流讲解
    - 复姓的完整列表
- point_id: chi-g1-t2-u01-p03
  unit_id: unit-01
  lesson_id: chi-g1-t2-u01-l03
  subject: chinese
  grade: 1
  term: term-2
  point_name: 识字：小青蛙（形声字「睛、情、晴、清、请」）
  learning_objectives:
  - 能朗读《小青蛙》并说出青蛙是益虫
  - 能发现「睛、情、晴、清、请」偏旁不同、读音相近的规律并正确选用
  applicable_question_types:
  - reading
  - choice
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t2_2024
    page_ref:
    - P6
    - P7
    anchor_text: P6「小青蛙」：河水清清天气晴，小小青蛙大眼睛。保护禾苗吃害虫，做了不少好事情。请你爱护小青蛙，好让禾苗不生病。；P7「睛 情 晴 清 请」——读一读下面的字，说说你发现了什么，再填一填（天/心/问/水/眼）。
  teaching_boundary:
    scope_allowed:
    - 朗读课文并说出青蛙的益处
    - 辨析「睛、情、晴、清、请」五个形声字
    scope_excluded:
    - 形声字形旁与声旁的完整理论
    - 写话
- point_id: chi-g1-t2-u01-p04
  unit_id: unit-01
  lesson_id: chi-g1-t2-u01-l04
  subject: chinese
  grade: 1
  term: term-2
  point_name: 识字：猜字谜（会意字与合体字）
  learning_objectives:
  - 能猜出两则字谜的谜底（秋、请/情/晴/清），并能说出猜的理由
  - 能自己编一个简单的字谜
  applicable_question_types:
  - reading
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t2_2024
    page_ref:
    - P8
    - P9
    anchor_text: P8「猜字谜」（一）左边绿，右边红，左右相遇起凉风。绿的喜欢及时雨，红的最怕水来攻。；P9（二）「言」来互相尊重，「心」至令人感动，「日」出万里无云，「水」到纯净透明。「我们也来猜字谜吧！『一加一』，猜一个字。」
  teaching_boundary:
    scope_allowed:
    - 依据字谜的提示猜字并说明理由
    - 编一个简单的字谜
    scope_excluded:
    - 字谜的文学创作技巧
    - 会意字的系统字理
- point_id: chi-g1-t2-u01-p05
  unit_id: unit-01
  lesson_id: chi-g1-t2-u01-l05
  subject: chinese
  grade: 1
  term: term-2
  point_name: 语文园地一：字词句运用、书写提示与《春晓》
  learning_objectives:
  - 能读准《汉语拼音字母表》并背诵《春晓》
  - 知道笔顺规则「先外后内再封口」并能正确书写「田、四、白」
  applicable_question_types:
  - fill_blank
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t2_2024
    page_ref:
    - P10
    - P11
    - P12
    anchor_text: P10「语文园地一」识字加油站与字词句运用（读一读，说说你发现了什么，再写一写）；P11《祖国多么广大》（大兴安岭，雪花还在飞舞。长江两岸，柳枝已经发芽。海南岛上，到处盛开着鲜花。）与《汉语拼音字母表》；P12 日积月累《春晓》[唐] 孟浩然；书写提示「笔顺规则：先外后内再封口」（田、四、白）。
  teaching_boundary:
    scope_allowed:
    - 背诵《春晓》并说出诗中的景物
    - 说出「先外后内再封口」的笔顺规则并书写全包围结构的字
    scope_excluded:
    - 《春晓》的作者生平与文学赏析
    - 笔顺规则的完整体系
