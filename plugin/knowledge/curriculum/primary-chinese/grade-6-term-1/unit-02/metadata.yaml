page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教统编版小学语文六年级上册电子课》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P55。本单元真实版面为 P13–P30，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P13 单元扉页「重温革命岁月，把历史的声音留在心里」「体会革命前辈为理想奋斗的精神」「了解文章是怎样点面结合写场面的」「尝试运用点面结合的写法记一次活动」；P14–P15 第 4 课《七律·长征》（毛泽东）（「五岭逶迤腾细浪，乌蒙磅礴走泥丸。金沙水拍云崖暖，大渡桥横铁索寒。」）；P16–P18 第 5 课《狼牙山五壮士》（「班长马宝玉激动地说：同志们，我们的任务胜利完成了！」「第一个纵身跳下深谷」）；P19–P23 第 6 课《开国大典》（「三十万人的目光一齐投向主席台」「毛主席在城楼上主席台前边，向前探着身子，不断地向群众挥手」）；P24–P26 第 7 课《我的战友邱少云》（「烈火在我的战友邱少云身上烧了半个多钟头才渐渐熄灭。这个伟大的战士，像千斤巨石……」）；P27 口语交际《演讲》；P28 习作《多彩的活动》；P29–P30 语文园地二（书写提示、日积月累「志士仁人，无求生以害仁，有杀身以成仁。——《论语》」）。
unit_overview: 本单元以「革命岁月」为人文主题，编排《七律·长征》《狼牙山五壮士》《开国大典》《我的战友邱少云》四篇课文，口语交际《演讲》、习作《多彩的活动》与语文园地二。本单元语文要素是「了解文章是怎样点面结合写场面的」；习作要素是「尝试运用点面结合的写法记一次活动」。核心是让学生体会革命前辈的精神，学习「点面结合」的场面描写方法。
