- point_id: chi-g6-t1-u02-p01
  unit_id: unit-02
  lesson_id: chi-g6-t1-u02-l01
  subject: chinese
  grade: 6
  term: term-1
  point_name: 点面结合写场面
  learning_objectives:
  - 能识别文章中的「点」（个体）与「面」（整体）的描写
  - 能体会点面结合写场面的好处
  applicable_question_types:
  - reading
  - choice
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g6_t1_2024
    page_ref:
    - P16
    - P19
    anchor_text: P16–P18：《狼牙山五壮士》中既写五壮士整体（面），又写班长马宝玉等个体（点）。P19–P23：《开国大典》中既写三十万人（面），又写毛主席（点）。P13 单元扉页：「了解文章是怎样点面结合写场面的。」
  teaching_boundary:
    scope_allowed:
    - 识别点与面的描写
    - 体会点面结合的好处
    - 用点面结合的方法写场面
    scope_excluded:
    - 叙事学中的全景与特写
    - 电影镜头语言
