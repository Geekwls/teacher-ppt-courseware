  term: term-1
  lesson_number: 4
  lesson_name: 7 我的战友邱少云
  page_range: P24-P26
  official_examples:
  - 「烈火在我的战友邱少云身上烧了半个多钟头才渐渐熄灭。这个伟大的战士，像千斤巨石……」
- lesson_id: chi-g6-t1-u02-l05
  unit_id: unit-02
  subject: chinese
  grade: 6
  term: term-1
  lesson_number: 5
  lesson_name: 口语交际·习作·语文园地
  page_range: P27-P30
  official_examples:
  - 口语交际《演讲》：拟定题目、观点要鲜明、选择合适的材料说明观点。
  - 习作《多彩的活动》：选一次活动写下来，尝试运用点面结合的写法。
  - 语文园地二：书写提示；日积月累「志士仁人，无求生以害仁，有杀身以成仁。——《论语》」等。
