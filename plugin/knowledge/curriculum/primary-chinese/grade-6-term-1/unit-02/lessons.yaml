  lesson_name: 4 七律·长征
  page_range: P14-P15
  official_examples:
  - 作者毛泽东。「五岭逶迤腾细浪，乌蒙磅礴走泥丸。金沙水拍云崖暖，大渡桥横铁索寒。」
  - 课后题：朗读课文，试着读出磅礴的气势；背诵课文；说说诗句的意思和表达的情感。
- lesson_id: chi-g6-t1-u02-l02
  unit_id: unit-02
  subject: chinese
  grade: 6
  term: term-1
  lesson_number: 2
  lesson_name: 5 狼牙山五壮士
  page_range: P16-P18
  official_examples:
  - 「为了拖住敌人，七连六班的五个战士……」「班长马宝玉激动地说：同志们，我们的任务胜利完成了！」「第一个纵身跳下深谷」。
  - 课后题：体会课文是怎样点面结合写场面的。
