  grade: 6
  term: term-1
  lesson_number: 3
  lesson_name: 6 开国大典
  page_range: P19-P23
  official_examples:
  - 「1949 年 10 月 1 日，中华人民共和国中央人民政府成立，在首都北京举行典礼。」「三十万人的目光一齐投向主席台。」「毛主席在城楼上主席台前边，向前探着身子，不断地向群众挥手，不断地高呼：人民万岁！同志们万岁！」
