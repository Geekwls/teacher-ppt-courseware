  pedagogical_focus:
    key_point: 以《只有一个地球》为例，让学生找出关键句并概括主要观点
    difficulty: 学生易把「关键句」与「好句子」混淆
    typical_misconceptions:
    - error_pattern: 关键句与好句子混淆
      misconception_type: 概念不清
    - error_pattern: 把握观点时遗漏要点
      misconception_type: 概括不完整
  variation_strategy:
  - 抓住关键句概括主要观点
  - 说出文章表达的环保主张
- point_id: chi-g6-t1-u06-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「保护环境」为主题写倡议书
    difficulty: 学生易只喊口号而没有具体建议
    typical_misconceptions:
    - error_pattern: 只喊口号无具体建议
      misconception_type: 内容空泛
    - error_pattern: 倡议书格式不规范
      misconception_type: 格式错误
  variation_strategy:
  - 按格式写一份倡议书
  - 提出具体可行的建议
