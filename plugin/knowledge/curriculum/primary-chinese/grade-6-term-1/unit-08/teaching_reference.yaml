teaching_references:
- point_id: chi-g6-t1-u08-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「借助相关资料」为方法，让学生理解鲁迅作品的时代背景
    difficulty: 学生易脱离资料孤立地理解课文
    typical_misconceptions:
    - error_pattern: 脱离资料孤立理解
      misconception_type: 背景意识薄弱
    - error_pattern: 资料堆砌无助于理解
      misconception_type: 资料运用不当
  variation_strategy:
  - 借助资料说出课文的主要内容
  - 结合资料理解含义深刻的句子
- point_id: chi-g6-t1-u08-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以《我的伯父鲁迅先生》为例，学习通过事情写人
    difficulty: 学生易罗列事例而无情感线索
    typical_misconceptions:
    - error_pattern: 罗列事例无情感线索
      misconception_type: 结构松散
    - error_pattern: 事例不能表现人物特点
      misconception_type: 选材不当
  variation_strategy:
  - 通过事情写一个人并表达情感
  - 说出所选事例表现了人物什么特点
