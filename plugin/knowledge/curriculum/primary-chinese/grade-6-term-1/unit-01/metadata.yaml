page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教统编版小学语文六年级上册电子课》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P55。本单元真实版面为 P1–P12，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P1 单元扉页「触摸山川湖海的心跳，倾听花鸟虫鱼的歌声」「亲近自然，热爱生活」「积极思考，从所读的内容想开去」「习作时发挥想象，注意把重点部分写得详细一些」；P2–P4 第 1 课《草原》（老舍）（「这次，我看到了草原。那里的天比别处的更可爱，空气是那么清鲜，天空是那么明朗，使我总想高歌一曲」「一碧千里，而并不茫茫」）；P5–P7 第 2 课《丁香结》（宗璞）（「丁香结，这三个字给人许多想象」）+ 阅读链接《花之歌》；P8–P9 第 3 课《古诗词三首》（《宿建德江》[唐]孟浩然、《六月二十七日望湖楼醉书》[宋]苏轼、《西江月·夜行黄沙道中》[宋]辛弃疾）；P10 习作《变形记》；P11–P12 语文园地一（朗读自然诗文、阅读时想开去；路牌拼音拼写；日积月累《江畔独步寻花》）。
unit_overview: 本单元以「触摸自然」为人文主题，编排《草原》《丁香结》两篇精读课文与《古诗词三首》一组古诗，习作《变形记》与语文园地一。本单元语文要素是「阅读时能从所读的内容想开去」；习作要素是「发挥想象，注意把重点部分写得详细一些」。核心是引导学生在阅读写景诗文时展开联想与想象，在习作中把想象的重点部分写详细。
