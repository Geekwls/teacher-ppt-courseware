  pedagogical_focus:
    key_point: 以「插上科学的翅膀飞」为创作任务，写一篇科幻故事
    difficulty: 学生易把科幻写成奇幻
    typical_misconceptions:
    - error_pattern: 把科幻写成奇幻
      misconception_type: 科学依据缺失
