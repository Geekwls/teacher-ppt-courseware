  pedagogical_focus:
    key_point: 以《两小儿辩日》为例，让学生梳理两小儿的观点与理由
    difficulty: 学生易只记住故事而不会分析观点与理由的关系
    typical_misconceptions:
    - error_pattern: 只记故事不分析观点
      misconception_type: 论证意识薄弱
    - error_pattern: 理由与观点不匹配
      misconception_type: 逻辑不严
  variation_strategy:
