  subject: chinese
  grade: 6
  term: term-1
  point_name: 写生活体验并表达自己的看法
  learning_objectives:
  - 能写出一件事对生活的影响并说明原因
  - 能把原因写具体，表达自己的看法
  applicable_question_types:
  - writing
  - reading
  verification_status: verified
  provenance:
    source_id: pep_chinese_g6_t1_2024
    page_ref:
    - P46
    - P48
    anchor_text: P46 习作《让生活更美好》：「写之前想一想它是怎么影响你的生活的，为什么让你觉得生活更美好。写的时候注意把原因写具体。」P48：「说明理由时可以分条陈述。」
  teaching_boundary:
    scope_allowed:
    - 写出事件对生活的影响
    - 把原因写具体
    - 分条陈述理由
    scope_excluded:
    - 体验式写作教学
    - 议论文的分条论证
