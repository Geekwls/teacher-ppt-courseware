- point_id: chi-g6-t1-u03-p02
  unit_id: unit-03
  lesson_id: chi-g6-t1-u03-l02
  subject: chinese
  grade: 6
  term: term-1
  point_name: 筛选与整合信息
  learning_objectives:
  - 能从文本中筛选出与问题相关的信息
  - 能对筛选出的信息进行整合并作出判断
  applicable_question_types:
  - reading
  - fill_blank
  - writing
  verification_status: verified
  provenance:
    source_id: pep_chinese_g6_t1_2024
    page_ref:
    - P36
    - P39
    - P43
    anchor_text: P39–P43：「为了了解其他星球是否存在生命，你在阅读时是怎么做的？」「有的信息可能是不准确的，需要再查查相关资料加以判断。」「与问题相关的内容我会仔细读，必要时……」
  teaching_boundary:
    scope_allowed:
    - 筛选相关信息
    - 整合信息并判断
    - 对不确定信息加以核查
    scope_excluded:
