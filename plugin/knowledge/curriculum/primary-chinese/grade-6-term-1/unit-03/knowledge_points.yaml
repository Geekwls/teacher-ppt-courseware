  point_name: 根据阅读目的选择阅读内容与方法
  learning_objectives:
  - 能根据不同的阅读目的选择恰当的阅读内容
  - 能根据阅读目的选用浏览、跳读、细读等阅读方法
  applicable_question_types:
  - reading
  - choice
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g6_t1_2024
    page_ref:
    - P32
    - P40
    - P47
    anchor_text: P31 单元扉页：「根据阅读目的，选用恰当的阅读方法。」P47 语文园地三：「生活中，常常需要根据目的进行阅读。」P40–P45：《故宫博物院》根据不同任务选择合适的材料。
  teaching_boundary:
    scope_allowed:
    - 根据目的选择阅读内容
