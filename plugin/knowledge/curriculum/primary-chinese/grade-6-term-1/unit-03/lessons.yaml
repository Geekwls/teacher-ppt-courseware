  lesson_name: 8 竹节人
  page_range: P32-P35
  official_examples:
  - 作者范锡林。「我们小时候的玩具，都是自己做的，也只能自己做……有一段时间，我们全迷上了斗竹节人。」
  - 课后题：根据不同的阅读目的，选择恰当的内容进行阅读。
- lesson_id: chi-g6-t1-u03-l02
  unit_id: unit-03
  subject: chinese
  grade: 6
  term: term-1
  lesson_number: 2
  lesson_name: 9 宇宙生命之谜
  page_range: P36-P39
  official_examples:
  - 「一是适合生物生存的温度，一般应在 −50～150℃ 之间；二是必要的水分……三是适当成分的大气……」
  - 课后题：「为了了解其他星球是否存在生命，你在阅读时是怎么做的？」「有的信息可能是不准确的，需要再查查相关资料加以判断。」
- lesson_id: chi-g6-t1-u03-l03
  unit_id: unit-03
  subject: chinese
  grade: 6
  term: term-1
  lesson_number: 3
  lesson_name: 10 故宫博物院
  page_range: P40-P45
  official_examples:
  - 「在北京城的中心，有一座城中之城，这就是紫禁城，如今人们习惯叫它故宫。」「故宫建筑群规模宏大，建筑精美，布局统一，集中体现了我国古代建筑艺术的独特风格。」
  - 课文由材料一至材料四组成（含故宫博物院开放区域图），课后题：根据不同任务选择合适的材料阅读。
- lesson_id: chi-g6-t1-u03-l04
  unit_id: unit-03
  subject: chinese
  grade: 6
  term: term-1
  lesson_number: 4
  lesson_name: 习作·语文园地
  page_range: P46-P48
  official_examples:
  - 习作《让生活更美好》：「从上面的「运动」「旅行」等话题中选一个写……写之前想一想它是怎么影响你的生活的，为什么让你觉得生活更美好。写的时候注意把原因写具体。」
  - 语文园地三：「生活中，常常需要根据目的进行阅读。」「说明理由时可以分条陈述……体会这样表达的好处。」
