page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教统编版小学语文六年级上册电子课》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P55。本单元真实版面为 P31–P48，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P31 单元扉页「读书好比串门儿——隐身的串门儿。——杨绛」「根据阅读目的，选用恰当的阅读方法」「写生活体验，试着表达自己的看法」；P32–P35 第 8 课《竹节人》（范锡林）（「我们小时候的玩具，都是自己做的……有一段时间，我们全迷上了斗竹节人」）；P36–P39 第 9 课《宇宙生命之谜》（「一是适合生物生存的温度，一般应在 −50～150℃ 之间；二是必要的水分……三是适当成分的大气」）；P40–P45 第 10 课《故宫博物院》（材料一至材料四，含故宫博物院开放区域图）；P46 习作《让生活更美好》；P47–P48 语文园地三（「生活中，常常需要根据目的进行阅读」；说明理由时可以分条陈述）。
unit_overview: 本单元是阅读策略单元，以「有目的地阅读」为语文要素。编排《竹节人》《宇宙生命之谜》《故宫博物院》三篇课文，习作《让生活更美好》与语文园地三。教材通过三篇课文分别渗透「根据阅读目的选择阅读内容与方法」「浏览、跳读、细读结合」「筛选与整合信息」等策略；习作要素是「写生活体验，试着表达自己的看法」。
