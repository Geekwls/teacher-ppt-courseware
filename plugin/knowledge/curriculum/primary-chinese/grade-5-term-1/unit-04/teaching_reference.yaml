teaching_references:
- point_id: chi-g5-t1-u04-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「结合资料」为方法，让学生理解课文背后的历史背景与情感
    difficulty: 学生易只背诗句而不能体会情感
    typical_misconceptions:
    - error_pattern: 只背诗句不体会情感
      misconception_type: 体会不深入
    - error_pattern: 结合资料时资料与课文脱节
      misconception_type: 资料运用不当
  variation_strategy:
  - 结合资料说出课文表达的思想感情
  - 说出诗句的意思与情感
- point_id: chi-g5-t1-u04-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「二十年后的家乡」为想象任务，先列提纲再写作
    difficulty: 学生易不列提纲直接写，条理不清
    typical_misconceptions:
    - error_pattern: 不列提纲直接写
      misconception_type: 结构混乱
    - error_pattern: 想象脱离家乡实际
      misconception_type: 想象不合理
  variation_strategy:
  - 列出习作提纲
  - 按提纲写「二十年后的家乡」
