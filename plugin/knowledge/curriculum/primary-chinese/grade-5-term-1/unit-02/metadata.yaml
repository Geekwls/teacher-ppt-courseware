page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教统编版小学语文五年级上册电子课》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P55。本单元真实版面为 P13–P32，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P13 单元扉页「学习提高阅读速度的方法」「结合具体事例写出人物的特点」「广然后深，博然后专」；P14–P16 第 4 课《冀中的地道战》（周而复）课后题「用较快的速度默读课文，记下所用的时间。读的时候集中注意力，遇到不懂的词语不要停下来，不要回读」；P17–P21 第 5 课《将相和》（完璧归赵、渑池会面、负荆请罪）「根据下面的提示，用自己的话说说课文的主要内容」「蔺相如、廉颇给你留下了怎样的印象？结合具体事例说一说」；P22–P24 第 6 课《什么比猎豹的速度更快》（罗伯特·E. 威尔斯）「借助关键语句，用较快的速度默读课文」；P25–P29 第 7 课《「诺曼底号」遇难记》（雨果）；P30 习作《「漫画」老师》；P31 语文园地二（整理「提高阅读速度方法清单」）。
unit_overview: 本单元是阅读策略单元，以「学习提高阅读速度的方法」为语文要素。编排《冀中的地道战》《将相和》《什么比猎豹的速度更快》《「诺曼底号」遇难记》四篇课文，习作《「漫画」老师》与语文园地二。教材通过四篇课文分别渗透「集中注意力、不回读」「连词成句地读」「借助关键词句读」「带着问题读」等方法；习作要素是「结合具体事例写出人物的特点」。
