  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 1
  lesson_name: 4 冀中的地道战
  page_range: P14-P16
  official_examples:
  - 作者周而复。「为了粉碎敌人的「扫荡」，冀中人民在中国共产党的领导下，创造了新的斗争方式，这就是地道战。」
  - 「地道的式样有一百多种……地道有四尺多高，个儿高的人弯着腰可以通过；地道的顶离地面三四尺，不妨碍上面种庄稼。」
  - 课后题：用较快的速度默读课文，记下所用的时间。读的时候集中注意力，遇到不懂的词语不要停下来，不要回读。
- lesson_id: chi-g5-t1-u02-l02
  unit_id: unit-02
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 2
  lesson_name: 5 将相和
  page_range: P17-P21
  official_examples:
  - 课文由「完璧归赵」「渑池会面」「负荆请罪」三个故事组成。
  - 课后题：根据提示用自己的话说说课文的主要内容；蔺相如、廉颇给你留下了怎样的印象？结合具体事例说一说。
  - 资料袋：司马迁与《史记》（全书一百三十篇，被鲁迅先生称为「史家之绝唱，无韵之《离骚》」）。
- lesson_id: chi-g5-t1-u02-l03
  unit_id: unit-02
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 3
  lesson_name: 6 什么比猎豹的速度更快
  page_range: P22-P24
  official_examples:
  - 作者是美国的罗伯特·E. 威尔斯。课文按速度由慢到快依次介绍：人（44 千米/时）→ 鸵鸟（约 72 千米/时）→ 猎豹（110 千米/时）→ 游隼俯冲（超过 320 千米/时）→ 喷气式飞机 → 火箭（4 万千米/时）→ 流星体（25 万千米/时）→ 光（约 30 万千米/秒）。
  - 课后题：按运动速度的快慢给事物排序；「我发现每个自然段基本上讲的都是一种事物要比另一种事物的速度快。了解了课文表达上的特点，我读得更快了。」
- lesson_id: chi-g5-t1-u02-l04
  unit_id: unit-02
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 4
  lesson_name: 7 「诺曼底号」遇难记
  page_range: P25-P29
  official_examples:
  - 作者是法国的雨果。哈尔威船长在危急时刻「一个手势也没有做，一句话也没有说，犹如铁铸一般，纹丝不动，随着轮船一起沉入了深渊」。
  - 课后题：说说对课文最后一段话的理解（「他一生都要求自己忠于职守，履行做人之道。面对死亡，他又践行了一次英雄的壮举。」）。
- lesson_id: chi-g5-t1-u02-l05
  unit_id: unit-02
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 5
  lesson_name: 习作·语文园地
  page_range: P30-P32
  official_examples:
  - 习作《「漫画」老师》：先想想老师在外貌、性格、喜好等方面有什么突出的特点，再选择一两件能突出其特点的事情来写。
  - 语文园地二：梳理与交流（整理一份「提高阅读速度方法清单」）。
