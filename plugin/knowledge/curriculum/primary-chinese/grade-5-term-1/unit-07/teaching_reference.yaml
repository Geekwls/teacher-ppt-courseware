teaching_references:
- point_id: chi-g5-t1-u07-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以古诗中的动静结合为切入点，体会静态描写与动态描写的表达效果
    difficulty: 学生易把静态与动态对立起来
    typical_misconceptions:
    - error_pattern: 把静态与动态对立
      misconception_type: 概念理解偏差
    - error_pattern: 描写景物时只有一种状态
      misconception_type: 描写单一
  variation_strategy:
  - 区分静态描写与动态描写
  - 体会动静结合的表达效果
- point_id: chi-g5-t1-u07-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「我最喜爱的季节」为题，练习写出景物的变化
    difficulty: 学生易只写景物的静态样貌而不写变化
    typical_misconceptions:
    - error_pattern: 只写静态样貌不写变化
      misconception_type: 变化描写缺失
    - error_pattern: 景物特点不突出
      misconception_type: 描写笼统
  variation_strategy:
  - 按顺序描写景物的变化
  - 写「我最喜爱的季节」
