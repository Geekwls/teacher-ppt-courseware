page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教统编版小学语文五年级上册电子课》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P55。本单元真实版面为 P1–P12，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P1 单元扉页「一花一鸟总关情」「初步体会文章借助具体事物表达的思想感情」「写一种心爱的事物，表达自己的感情」；P2–P3 第 1 课《桂花雨》（琦君）（「摇花对我来说是件大事…我喊着：啊！真像下雨，好香的雨呀！」「这里的桂花再香，也比不上家乡院子里的桂花」）；P5–P6 第 2 课《落花生》（许地山）（「所以你们要像花生，它虽然不好看，可是很有用」「人要做有用的人，不要做只讲体面，而对别人没有好处的人」）；P7–P8 第 3 课《珍珠鸟》（冯骥才）（「信赖，往往创造出美好的境界」）；P9 口语交际《制定班级公约》；P10 习作《我的心爱之物》；P11–P12 语文园地一（梳理与交流「可以通过与具体事物相关的事情，体会文章表达的思想感情」；词句段运用；日积月累：卧虎藏龙、龙马精神、龙飞凤舞、凤毛麟角、如虎添翼、如鱼得水等）。
unit_overview: 本单元以「一花一鸟总关情」为人文主题，编排《桂花雨》《落花生》两篇精读课文与《珍珠鸟》一篇略读课文，口语交际《制定班级公约》、习作《我的心爱之物》与语文园地一。本单元语文要素是「初步体会文章借助具体事物表达的思想感情」；习作要素是「写一种心爱的事物，表达自己的感情」。核心是引导学生通过「与具体事物相关的事情」和「描述事物特点的关键语句」，体会作者借物抒情的写法。
