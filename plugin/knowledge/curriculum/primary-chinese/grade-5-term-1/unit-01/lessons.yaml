  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 1
  lesson_name: 1 桂花雨
  page_range: P2-P3
  official_examples:
  - 作者琦君。课文写了故乡桂花盛开时的「摇花乐」：「这下，我可乐了，帮大人抱着桂花树，使劲地摇。摇哇摇，桂花纷纷落下来，我们满头满身都是桂花。我喊着：啊！真像下雨，好香的雨呀！」
  - 母亲说：「这里的桂花再香，也比不上家乡院子里的桂花。」课后题：说说桂花给「我」带来了哪些美好的回忆；体会句子中蕴含的情感。
- lesson_id: chi-g5-t1-u01-l02
  unit_id: unit-01
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 2
  lesson_name: 2 落花生
  page_range: P5-P6
  official_examples:
  - 作者许地山。父亲说：「它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝上，使人一见就生爱慕之心……所以你们要像花生，它虽然不好看，可是很有用。」
  - 「我说：那么，人要做有用的人，不要做只讲体面，而对别人没有好处的人。」
  - 小练笔：花生会让我们想到那些默默无闻作贡献的人。看到竹子、梅花、蜜蜂、路灯，你会想到哪些人？
- lesson_id: chi-g5-t1-u01-l03
  unit_id: unit-01
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 3
  lesson_name: 3* 珍珠鸟
  page_range: P7-P8
  official_examples:
  - 作者冯骥才。课文写「我」逐渐得到珍珠鸟信赖的过程，结尾「我笔尖一动，流泻下一时的感受：信赖，往往创造出美好的境界」。
  - 课后题：想想「我」是怎样逐渐得到珍珠鸟的信赖的；找出写出珍珠鸟可爱的语句，体会「我」和珍珠鸟之间的情意。
- lesson_id: chi-g5-t1-u01-l04
  unit_id: unit-01
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 4
  lesson_name: 口语交际·习作·语文园地
  page_range: P9-P12
  official_examples:
  - 口语交际《制定班级公约》：提出班级建设的目标、分组讨论形成小组意见、全班表决形成公约；「发言时要控制时间」「讨论后作小结，既总结大家的共同意见，也说明不同意见」。
  - 习作《我的心爱之物》：写写它是什么样子的、你是怎么得到它的、为什么它会成为你的心爱之物，写出自己的喜爱之情。
  - 语文园地一：梳理与交流（借助具体事物表达的思想感情）；词句段运用（比较描写事物方法的相似之处）；日积月累（卧虎藏龙、龙马精神、龙飞凤舞、凤毛麟角、如虎添翼、如鱼得水、鹤立鸡群、一马当先等）。
