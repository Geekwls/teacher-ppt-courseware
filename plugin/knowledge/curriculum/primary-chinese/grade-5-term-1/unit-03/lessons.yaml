  lesson_number: 3
  lesson_name: 10* 牛郎织女（二）
  page_range: P42-P44
  official_examples:
  - 「用之前学到的阅读方法，尽可能快地默读课文，了解牛郎织女故事的结局。」
  - 「联系上一篇课文，说说如果给《牛郎织女》绘制连环画，你打算画哪些内容，每幅图画配什么文字。」
