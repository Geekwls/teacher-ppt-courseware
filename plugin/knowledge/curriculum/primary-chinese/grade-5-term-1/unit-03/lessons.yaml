  lesson_name: 8 猎人海力布
  page_range: P34-P36
  official_examples:
  - 民间故事，由仁·甘珠尔扎布整理。海力布救了龙王的女儿小白蛇，得到能听懂动物语言的宝石，但「如果对别人说了，您就会变成一块石头」。为救乡亲，他说出秘密，变成了石头。
  - 课后题：默读课文，说说海力布是一个怎样的人。
- lesson_id: chi-g5-t1-u03-l02
  unit_id: unit-03
  subject: chinese
  grade: 5
  term: term-1
  lesson_number: 2
  lesson_name: 9 牛郎织女（一）
  page_range: P37-P41
  official_examples:
  - 民间故事，由叶圣陶整理。课后题：默读课文，说说牛郎和老牛是怎么相处的，他和织女是怎么认识的。
  - 「课文中有些情节写得很简略，发挥想象把下面的情节说得更具体」：牛郎常常把看见的、听见的事告诉老牛；仙女们商量瞒着王母娘娘去人间看看。
