page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教统编版小学语文五年级上册电子课》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 4（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P55。本单元真实版面为 P33–P50，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P33 单元扉页「民间故事，口耳相传的经典，老百姓智慧的结晶」「阅读民间故事，感受其中蕴含的朴素愿望和真挚情感」「了解故事内容，并创造性复述」「按照自己的想法新编故事」；P34–P36 第 8 课《猎人海力布》（海力布为救乡亲说出宝石的秘密而变成石头）；P37–P41 第 9 课《牛郎织女（一）》（叶圣陶整理）「默读课文，说说牛郎和老牛是怎么相处的，他和织女是怎么认识的」；P42–P44 第 10 课《牛郎织女（二）》「用之前学到的阅读方法，尽可能快地默读课文，了解牛郎织女故事的结局」；P45 口语交际《讲民间故事》；P46 习作《故事新编》；P47–P48 语文园地三；P49–P50 快乐读书吧《从前有座山》。
unit_overview: 本单元以「民间故事」为人文主题，编排《猎人海力布》《牛郎织女（一）》两篇精读课文与《牛郎织女（二）》一篇略读课文，口语交际《讲民间故事》、习作《故事新编》、语文园地三与快乐读书吧《从前有座山》。本单元语文要素是「了解故事内容，并创造性复述」；习作要素是「按照自己的想法新编故事」。核心是让学生感受民间故事「口耳相传」的特点，学习创造性复述与故事新编。
