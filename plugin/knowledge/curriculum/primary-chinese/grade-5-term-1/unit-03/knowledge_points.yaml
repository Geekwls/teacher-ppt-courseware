- point_id: chi-g5-t1-u03-p01
  unit_id: unit-03
  lesson_id: chi-g5-t1-u03-l01
  subject: chinese
  grade: 5
  term: term-1
  point_name: 把握民间故事的主要情节
  learning_objectives:
  - 能梳理并说出民间故事的主要情节
  - 能说出民间故事中蕴含的朴素愿望和真挚情感
  applicable_question_types:
  - reading
  - fill_blank
  - writing
  verification_status: verified
  provenance:
    source_id: pep_chinese_g5_t1_2024
    page_ref:
    - P34
    - P37
    - P42
    anchor_text: P34–P36：《猎人海力布》中「海力布救了小白蛇 → 得到宝石 → 为救乡亲说出秘密 → 变成石头」的情节链。P37–P41：《牛郎织女（一）》。P42–P44：《牛郎织女（二）》的结局。
  teaching_boundary:
    scope_allowed:
    - 梳理故事情节
    - 说出故事蕴含的情感
    - 复述故事的主要内容
    scope_excluded:
    - 民间文学研究
    - 故事形态学（普罗普）
- point_id: chi-g5-t1-u03-p02
  unit_id: unit-03
  lesson_id: chi-g5-t1-u03-l02
  subject: chinese
  grade: 5
  term: term-1
  point_name: 创造性复述故事
  learning_objectives:
  - 能把课文中简略的情节说得更具体
  - 能通过丰富细节、变换口吻等方式创造性复述
  applicable_question_types:
  - writing
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_chinese_g5_t1_2024
    page_ref:
    - P41
    - P45
    anchor_text: P41：「课文中有些情节写得很简略，发挥想象把下面的情节说得更具体。牛郎常常把看见的、听见的事告诉老牛。仙女们商量瞒着王母娘娘去人间看看。」P45 口语交际《讲民间故事》。
  teaching_boundary:
    scope_allowed:
    - 丰富情节细节
    - 变换叙述口吻
    - 创造性复述故事
    scope_excluded:
    - 口述文学与书面文学的区别
    - 叙事视角理论
- point_id: chi-g5-t1-u03-p03
  unit_id: unit-03
  lesson_id: chi-g5-t1-u03-l03
  subject: chinese
  grade: 5
  term: term-1
  point_name: 故事新编
  learning_objectives:
  - 能按照自己的想法新编一个故事
  - 新编的故事要有合理的想象与完整的结构
  applicable_question_types:
  - writing
  - reading
  verification_status: verified
  provenance:
    source_id: pep_chinese_g5_t1_2024
    page_ref:
    - P46
    anchor_text: P46 习作《故事新编》：按照自己的想法新编故事。
  teaching_boundary:
    scope_allowed:
    - 确定新编的思路
    - 保持故事的完整性
    - 展开合理的想象
