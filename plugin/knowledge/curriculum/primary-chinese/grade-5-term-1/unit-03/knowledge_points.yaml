  point_name: 绘制连环画并配文字
  learning_objectives:
  - 能为故事选择关键情节并绘制连环画
  - 能为每幅图配上简洁准确的文字
  applicable_question_types:
  - writing
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_chinese_g5_t1_2024
