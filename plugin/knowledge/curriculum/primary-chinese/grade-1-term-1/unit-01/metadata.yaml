page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版统编版小学语文一年级上册电子课本》逐页实证核定：本册可读印刷页区间为 P2–P21。本单元真实版面为 P8–P19（第二单元起始页 P20），全部落在可读区间内，故记为 verified。已据原文逐页取证：P8「天地人」（天 地 人 你 我 他）、P9「金木水火土」（一二三四五，金木水火土。天地分上下，日月照今古。）、P10「一二三四五 上 下」与认识田字格（横中线、竖中线）、P11「口耳目手足」（目 口 耳 手 足）、P12「口 耳 目 手 足 站 坐」「站如松，坐如钟。行如风，卧如弓。」、P13「日月山川」（日 月 水 火 山 川 田 禾）、P14 猜一猜连一连（羊 竹 网 兔 木 鸟）与「日 月 山 川 水 火 田 禾」、P15「语文园地一」识字加油站（六 七 八 九 十；一片两片三四片……）、P16 书写提示（笔顺规则：先横后竖、先撇后捺）与日积月累《咏鹅》、P17 口语交际「我说你做」、P18 和大人一起读《剪窗花》、P19 快乐读书吧「读书真快乐」。
unit_overview: 第一单元是统编版一年级上册的第一个识字单元，共安排 4 篇识字课文与语文园地一，识字内容围绕「天地人、金木水火土、口耳目手足、日月山川」四组象形与生活常用字展开，识字量以「天、地、人、你、我、他、一、二、三、四、五、上、下、口、耳、目、手、足、站、坐、日、月、水、火、山、川、田、禾」等为基础。语文园地一安排识字加油站、字词句运用、书写提示（先横后竖、先撇后捺）、日积月累《咏鹅》与口语交际「我说你做」。**本单元在汉语拼音教学之前**，故一切练习均以汉字与图画为依托，不得以拼音作为识字支架。
