  lesson_number: 1
  lesson_name: 1 天地人
  page_range: P8
  official_examples:
  - 天　地　人　你　我　他
  - 朗读课文，认识「天、地、人、你、我、他」。
- lesson_id: chi-g1-t1-u01-l02
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 2
  lesson_name: 2 金木水火土
  page_range: P9-P10
  official_examples:
  - 一二三四五，金木水火土。天地分上下，日月照今古。
  - 认识田字格：写字时要注意笔画在田字格中的位置（横中线、竖中线）。
- lesson_id: chi-g1-t1-u01-l03
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 3
  lesson_name: 3 口耳目手足
  page_range: P11-P12
  official_examples:
  - 目　口　耳　手　足
  - 口　耳　目　手　足　站　坐
  - 站如松，坐如钟。行如风，卧如弓。
  - 口、耳、目、手、足能做哪些事？
- lesson_id: chi-g1-t1-u01-l04
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 4
  lesson_name: 4 日月山川
  page_range: P13-P14
  official_examples:
  - 日　月　水　火　山　川　田　禾
  - 猜一猜，连一连。（羊　竹　网　兔　木　鸟）
- lesson_id: chi-g1-t1-u01-l05
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 5
  lesson_name: 语文园地一
  page_range: P15-P16
  official_examples:
  - 识字加油站：六　七　八　九　十；一片两片三四片，五片六片七八片……
  - 书写提示：笔顺规则——先横后竖、先撇后捺；写字时注意坐端正，握好笔。
  - 日积月累：《咏鹅》[唐] 骆宾王——鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。
- lesson_id: chi-g1-t1-u01-l06
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 6
  lesson_name: 口语交际：我说你做
  page_range: P17
  official_examples:
  - 我们一起来做游戏吧！一个人发指令，其他人做动作。
  - ◎ 说话时声音要洪亮，吐字要清楚。◎ 别人说话时要认真听。
- lesson_id: chi-g1-t1-u01-l07
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 7
  lesson_name: 和大人一起读：剪窗花
  page_range: P18
  official_examples:
  - 小剪刀，手中拿，我学奶奶剪窗花。剪雪花，剪梅花，剪对喜鹊叫喳喳……
- lesson_id: chi-g1-t1-u01-l08
  unit_id: unit-01
  subject: chinese
  grade: 1
  term: term-1
  lesson_number: 8
  lesson_name: 快乐读书吧：读书真快乐
  page_range: P19
  official_examples:
  - 学了拼音，我就可以认更多的字，读更多的书了！
  - 我经常和爸爸妈妈一起读有趣的故事书。
