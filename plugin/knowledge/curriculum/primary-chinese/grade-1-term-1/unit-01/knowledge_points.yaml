  subject: chinese
  grade: 1
  term: term-1
  point_name: 语文园地一：识字加油站、书写提示与《咏鹅》
  learning_objectives:
  - 能认读「六、七、八、九、十」并读准《咏鹅》
  - 知道笔顺规则「先横后竖」「先撇后捺」
  applicable_question_types:
  - fill_blank
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t1_2024
    page_ref:
    - P15
    - P16
    anchor_text: P15「语文园地一」识字加油站：「六　七　八　九　十」与谜语诗「一片两片三四片，五片六片七八片。九片十片无数片，飞入芦花都不见。」；P16 书写提示：「笔顺规则：先横后竖」「笔顺规则：先撇后捺」，「写字时注意坐端正，握好笔。」；日积月累《咏鹅》[唐] 骆宾王。
