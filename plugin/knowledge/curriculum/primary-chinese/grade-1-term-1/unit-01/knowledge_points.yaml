- point_id: chi-g1-t1-u01-p02
  unit_id: unit-01
  lesson_id: chi-g1-t1-u01-l02
  subject: chinese
  grade: 1
  term: term-1
  point_name: 识字：金木水火土（一至五与五行）
  learning_objectives:
  - 能朗读、背诵「一二三四五，金木水火土。天地分上下，日月照今古。」
  - 认识「一、二、三、四、五、上、下」并知道田字格的作用
  applicable_question_types:
  - reading
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t1_2024
    page_ref:
    - P9
    - P10
    anchor_text: P9「金木水火土」：一二三四五，金木水火土。天地分上下，日月照今古。（注：民间歌谣）；P10「一二三四五　上　下」与「认识田字格」，标注「横中线」「竖中线」，提示「写字时，要注意笔画在田字格中的位置」。
  teaching_boundary:
    scope_allowed:
    - 朗读、背诵课文
    - 认读「一、二、三、四、五、上、下」
    - 认识田字格（横中线、竖中线）
    scope_excluded:
    - 「金木水火土」五行学说的系统讲解
    - 汉字笔画的完整书写训练
- point_id: chi-g1-t1-u01-p03
