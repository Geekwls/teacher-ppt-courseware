  term: term-1
  point_name: 识字：口耳目手足（身体器官与站坐礼仪）
  learning_objectives:
  - 能认识「口、耳、目、手、足、站、坐」八个字
  - 能朗读「站如松，坐如钟。行如风，卧如弓。」并知道正确的站坐姿势
  applicable_question_types:
  - reading
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g1_t1_2024
    page_ref:
    - P11
    - P12
    anchor_text: P11「口耳目手足」：目　口　耳　手　足；P12「口　耳　目　手　足　站　坐」「站如松，坐如钟。行如风，卧如弓。」「口、耳、目、手、足能做哪些事？」
  teaching_boundary:
    scope_allowed:
    - 认读「口、耳、目、手、足、站、坐」
    - 朗读俗语并说出正确的站坐姿势
    scope_excluded:
    - 人体器官的科学名称与功能讲解
