  subject: chinese
  grade: 1
  term: term-1
  lesson_name: 我是小学生
  page_range: P6
  official_examples:
  - 儿歌《上学歌》：太阳当空照，花儿对我笑。小鸟说：早，早，早，你为什么背上小书包？
  - 我去上学校，天天不迟到。爱学习，爱劳动，长大要为人民立功劳。
