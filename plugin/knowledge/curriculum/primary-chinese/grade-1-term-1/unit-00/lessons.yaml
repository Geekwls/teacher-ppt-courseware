- lesson_id: chi-g1-t1-u00-l02
  unit_id: unit-00
  subject: chinese
  grade: 1
  term: term-1
  lesson_name: 我爱我们的祖国
  page_range: P4-P5
  official_examples:
  - 我爱五星红旗。我爱北京天安门。
  - 我爱长江，我爱黄河。我爱中华人民共和国。
- lesson_id: chi-g1-t1-u00-l03
