  term: term-2
  point_name: 语文园地一：场所名称、书写提示与《赋得古原草送别》
  learning_objectives:
  - 能认读场所名称词语，能背诵《赋得古原草送别（节选）》
  - 能说出半包围结构字的书写要点（撇画、捺画要舒展）
  applicable_question_types:
  - fill_blank
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_chinese_g2_t2_2024
    page_ref:
    - P11
    - P12
    anchor_text: P11「语文园地一」识字加油站：亭、咨询处、宝塔、餐厅、厕所（游览公园时，我会看导览图）；字词句运用：补充合适的词语，再说一说你在春天里看到了什么，感受到了什么；P12 书写提示（左上包围的字撇画要舒展、左下包围的字捺画要舒展）与日积月累《赋得古原草送别（节选）》[唐] 白居易（离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。）。
  teaching_boundary:
    scope_allowed:
    - 认读场所名称词语
    - 背诵《赋得古原草送别（节选）》并说出小草的特点
    - 说出半包围结构字的书写要点
    scope_excluded:
    - 公共场所管理的系统知识
    - 书法技法的系统讲解
