page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版统编版小学语文二年级下册电子课本》逐页实证核定：课本 PDF 共 60 页，页脚印刷页码实测偏移 = 5（PDF#6 = 印刷 P1）；本册可读印刷页区间为 P1–P54。本单元真实版面为 P1–P11（第二单元起始页 P15），全部落在可读区间内，故记为 verified。已据原文逐页取证：P1「古诗二首」《咏柳》[唐] 贺知章（碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。）、P2《村居》[清] 高鼎（草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。）、P4「2 找春天」（春天来了！春天来了！我们几个孩子脱掉棉袄，冲出家门，奔向田野，去寻找春天。小草从地下探出头来，那是春天的眉毛吧？早开的野花一朵两朵，那是春天的眼睛吧？树木吐出点点嫩芽，那是春天的音符吧？解冻的小溪叮叮咚咚，那是春天的琴声吧？）、P5「朗读课文，感受春天的美景。说说『我们』找到的春天是什么样的。」、P6「3 开满鲜花的小路」（邮递员黄狗在门口喊：『鼹鼠先生，您的包裹单！』……）、P7「松鼠太太对鼹鼠先生说：『我知道了，去年长颈鹿大叔寄给您的是花籽。这是多么美好的礼物啊！』」、P8「分角色朗读课文」与「为什么说长颈鹿大叔寄来的花籽是『美好的礼物』？生活中还有什么也是美好的礼物？」、P9「4 邓小平爷爷植树」（1987年4月5日，是个令人难忘的日子。这一天，碧空如洗，万里无云。在北京天坛公园植树的人群里，83岁高龄的邓小平爷爷格外引人注目。）、P10「一棵绿油油的小柏树栽好了，就像战士一样笔直地站在那里。」与「默读第3自然段。结合课文内容和插图，说说邓爷爷植树的情景。」、P11「语文园地一」识字加油站（亭、咨询处、宝塔、餐厅、厕所）与字词句运用、P12 日积月累《赋得古原草送别（节选）》[唐] 白居易与书写提示（左上包围、左下包围的字）、P13 口语交际「用怎样的语气说话」、P14 我爱阅读《笋芽儿》。
unit_overview: 第一单元是统编版二年级下册的第一个阅读单元，安排 4 篇课文与语文园地一，以「春天」为主题，依次是《古诗二首》（咏柳、村居）《找春天》《开满鲜花的小路》《邓小平爷爷植树》。阅读要素为「朗读课文，注意语气和重音；能就感兴趣的内容提出问题」；识字写字方面要求会认「莺、拂、堤、柳、醉、鸢、脱、袄、寻、羞、遮、掩、探、眉、吐、芽、符、解、触、邮、递、裹、颈、寄、粒、破、漏、懊、丧、绚、狐、狸、籽、礼、坛、龄、格、致、勃、挖、额、汗、仍、肯、茁、移、挥、扶」等字，会写「诗、村、童、碧、妆、绿、丝、剪、冲、寻、姑、娘、吐、柳、荡、桃、杏、鲜、原、通、巧、叔、惊、礼、邓、植、格、引、注、满、休、息」等字。语文园地一安排识字加油站（场所名称）、字词句运用、书写提示（半包围结构）、日积月累《赋得古原草送别（节选）》与口语交际「用怎样的语气说话」。
