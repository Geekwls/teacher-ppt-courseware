- lesson_id: chi-g2-t2-u01-l01
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 1
  lesson_name: 1 古诗二首（咏柳、村居）
  page_range: P1-P3
  official_examples:
  - 《咏柳》[唐] 贺知章：碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。
  - 《村居》[清] 高鼎：草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。
- lesson_id: chi-g2-t2-u01-l02
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 2
  lesson_name: 2 找春天
  page_range: P4-P5
  official_examples:
  - 春天来了！春天来了！我们几个孩子脱掉棉袄，冲出家门，奔向田野，去寻找春天。
  - 小草从地下探出头来，那是春天的眉毛吧？
  - 早开的野花一朵两朵，那是春天的眼睛吧？
  - 树木吐出点点嫩芽，那是春天的音符吧？
  - 解冻的小溪叮叮咚咚，那是春天的琴声吧？
  - 朗读课文，感受春天的美景。说说「我们」找到的春天是什么样的。
  - 选做：你找到的春天是什么样的？仿照第4~7自然段或第8自然段说一说。
- lesson_id: chi-g2-t2-u01-l03
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 3
  lesson_name: 3 开满鲜花的小路
  page_range: P6-P8
  official_examples:
  - 邮递员黄狗在门口喊：「鼹鼠先生，您的包裹单！」
  - 通往松鼠太太家的路，成了一条开满鲜花的小路。
  - 松鼠太太对鼹鼠先生说：「我知道了，去年长颈鹿大叔寄给您的是花籽。这是多么美好的礼物啊！」
  - 为什么说长颈鹿大叔寄来的花籽是「美好的礼物」？生活中还有什么也是美好的礼物？
- lesson_id: chi-g2-t2-u01-l04
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 4
  lesson_name: 4 邓小平爷爷植树
  page_range: P9-P10
  official_examples:
  - 1987年4月5日，是个令人难忘的日子。这一天，碧空如洗，万里无云。在北京天坛公园植树的人群里，83岁高龄的邓小平爷爷格外引人注目。
  - 一棵绿油油的小柏树栽好了，就像战士一样笔直地站在那里。
  - 默读第3自然段。结合课文内容和插图，说说邓爷爷植树的情景。
- lesson_id: chi-g2-t2-u01-l05
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 5
  lesson_name: 语文园地一
  page_range: P11-P12
  official_examples:
  - 识字加油站：亭、咨询处、宝塔、餐厅、厕所（游览公园时，我会看导览图）。
  - 字词句运用：补充合适的词语，再说一说你在春天里看到了什么，感受到了什么。
  - 书写提示：左上包围的字，书写时包围部分的撇画要写得舒展；左下包围的字，书写时包围部分的捺画要写得舒展。
  - 日积月累：《赋得古原草送别（节选）》[唐] 白居易——离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。
- lesson_id: chi-g2-t2-u01-l06
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 6
  lesson_name: 口语交际：用怎样的语气说话
  page_range: P13
  official_examples:
  - 说话的时候，使用恰当的语气，能让听的人感到舒服。
  - 阿姨，请您让一下。／阿姨，请您让一下好吗？
  - ◎ 说话的语气不要太生硬。◎ 尽量使用温和的语气。
- lesson_id: chi-g2-t2-u01-l07
  unit_id: unit-01
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 7
  lesson_name: 我爱阅读：笋芽儿
  page_range: P14
  official_examples:
  - 沙沙沙，沙沙沙。春雨姑娘在绿色的叶丛中弹奏着乐曲，低声呼唤着沉睡的笋芽儿……
