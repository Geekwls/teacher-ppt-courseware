- point_id: chi-g2-t2-u03-p03
  unit_id: unit-03
  lesson_id: chi-g2-t2-u03-l03
  subject: chinese
  grade: 2
  term: term-2
  point_name: 《「贝」的故事》：偏旁与字义（贝字旁与钱财）
  learning_objectives:
  - 能讲一讲「贝」的故事，能说出「贝」作偏旁的字大多与钱财有关
  - 能认读「赚、赔、购、贫、货」并说出它们的共同偏旁
  applicable_question_types:
  - reading
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g2_t2_2024
    page_ref:
    - P33
    - P34
    anchor_text: P33「3『贝』的故事」：「一些生活在水里的动物，用贝壳保护自己的身体。甲骨文中的「贝」字，就像一种海贝的样子。」「古时候，人们觉得贝壳很漂亮，很珍贵，喜欢把它们当作饰品戴在身上。而且贝壳可以随身携带，不容易损坏，于是古人还把贝壳当作钱币。所以，用「贝」作偏旁的字大多与钱财有关，如「赚、赔、购、贫、货」。」；P34「朗读课文。讲一讲『贝』的故事。」与「读一读，记一记」（珍贵　贵重／损坏　破损／硬币　纸币／财富　财产／赔本　赔礼／购买　采购）。
  teaching_boundary:
    scope_allowed:
    - 讲一讲「贝」的故事
    - 说出「贝」字旁与钱财的关系
    - 认读「赚、赔、购、贫、货」等字
    scope_excluded:
    - 汉字形体演变的系统讲解
    - 货币史的系统讲解
