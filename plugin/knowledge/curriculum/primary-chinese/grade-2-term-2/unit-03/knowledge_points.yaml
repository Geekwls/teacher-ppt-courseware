    anchor_text: P29「1 神州谣」（我神州，称中华，山川美，可入画。黄河奔，长江涌，长城长，珠峰耸。台湾岛，隔海峡，与大陆，是一家。各民族，情谊浓，齐奋发，共繁荣。）；P30「读一读，记一记」（华夏儿女　炎黄子孙／神州大地　巍巍中华／民族团结　世界大同／奋发图强　繁荣昌盛）。
  teaching_boundary:
