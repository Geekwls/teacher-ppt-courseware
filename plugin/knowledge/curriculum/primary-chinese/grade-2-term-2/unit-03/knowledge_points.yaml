    anchor_text: P31「2 传统节日」（春节到，人欢笑，贴窗花，放鞭炮。元宵节，看花灯，大街小巷人如潮。清明节，雨纷纷，先人墓前去祭扫。过端午，赛龙舟，粽香艾香满堂飘。七月七，来乞巧，牛郎织女会鹊桥。过中秋，吃月饼，十五圆月当空照。）；P32「重阳节，要敬老，踏秋赏菊去登高。转眼又是新春到，全家团圆真热闹。」与「按照时间顺序排列下面的节日（端午节　清明节　元宵节　春节　重阳节　中秋节）」。
