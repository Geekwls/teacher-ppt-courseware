page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版统编版小学语文二年级下册电子课本》逐页实证核定：本册可读印刷页区间为 P1–P54。本单元真实版面为 P29–P37（第四单元起始页 P42），全部落在可读区间内，故记为 verified。已据原文逐页取证：P29「1 神州谣」（我神州，称中华，山川美，可入画。黄河奔，长江涌，长城长，珠峰耸。台湾岛，隔海峡，与大陆，是一家。各民族，情谊浓，齐奋发，共繁荣。）、P30「读一读，记一记（华夏儿女　炎黄子孙／神州大地　巍巍中华／民族团结　世界大同／奋发图强　繁荣昌盛）」、P31「2 传统节日」（春节到，人欢笑，贴窗花，放鞭炮。元宵节，看花灯，大街小巷人如潮。清明节，雨纷纷，先人墓前去祭扫。过端午，赛龙舟，粽香艾香满堂飘。七月七，来乞巧，牛郎织女会鹊桥。过中秋，吃月饼，十五圆月当空照。）、P32「重阳节，要敬老，踏秋赏菊去登高。转眼又是新春到，全家团圆真热闹。」与「按照时间顺序排列下面的节日（端午节　清明节　元宵节　春节　重阳节　中秋节）」、P33「3『贝』的故事」（一些生活在水里的动物，用贝壳保护自己的身体。甲骨文中的「贝」字，就像一种海贝的样子。……所以，用「贝」作偏旁的字大多与钱财有关，如「赚、赔、购、贫、货」。）、P34「朗读课文。讲一讲『贝』的故事。」与「读一读，记一记（珍贵　贵重／损坏　破损／硬币　纸币／财富　财产／赔本　赔礼／购买　采购）」、P35「4 中国美食」（小鸡炖蘑菇、葱爆羊肉、烤鸭、水煮鱼、蒸饺、炸酱面、小米粥、蛋炒饭、红烧茄子、凉拌菠菜、香煎豆腐）、P36「读一读，说说制作哪些食物时需要用到这些方法（炒　烤　烧　爆　炖　炸　煎　蒸　煮）」与「用部首查字法查下面的字（灶　焰　烫　煲　熏）」、P37「语文园地三」识字加油站（甜津津　酸溜溜　辣乎乎　香喷喷　油腻腻　软绵绵　脆生生　硬邦邦）、P38 日积月累（子鼠　丑牛　寅虎　卯兔　辰龙　巳蛇　午马　未羊　申猴　酉鸡　戌狗　亥猪）与「选一选，连一连（霄／宵／削、赔／陪／培）」、P39 口语交际「长大以后做什么」、P40–P41 我爱阅读《一株紫丁香》。
unit_overview: 第三单元是统编版二年级下册的识字单元，安排 4 篇识字课文与语文园地三，分别是《神州谣》《传统节日》《「贝」的故事》《中国美食》。识字内容围绕「祖国山河与民族团结」「传统节日」「偏旁与字义」「美食与烹饪方法」四组内容展开，要求会认「州、谣、华、涌、耸、隔、峡、与、陆、各、谊、浓、齐、奋、繁、传、统、贴、宵、巷、潮、祭、扫、艾、堂、乞、郎、饼、赏、菊、甲、骨、漂、贵、饰、品、携、易、损、钱、币、财、赚、赔、购、菠、煎、腐、茄、烤、葱、炖、蘑、菇、蒸、饺、炸、酱、粥、蛋、拌」等字，会写「州、华、岛、峡、族、谊、齐、奋、繁、荣、贴、街、扫、团、圆、热、闹、贝、壳、甲、骨、钱、币、财、与、关、食、蛋、饭、茄、烤、鸭、煮、鸡」等字。语文园地三安排识字加油站（ABB 式味觉词语）、字词句运用（偏旁表意）、日积月累（十二生肖）与形近字辨析（霄／宵／削、赔／陪／培）。
