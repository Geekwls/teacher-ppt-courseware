  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 1
  lesson_name: 1 神州谣
  page_range: P29-P30
  official_examples:
  - 我神州，称中华，山川美，可入画。
  - 黄河奔，长江涌，长城长，珠峰耸。
  - 台湾岛，隔海峡，与大陆，是一家。
  - 各民族，情谊浓，齐奋发，共繁荣。
  - 读一读，记一记：华夏儿女　炎黄子孙／神州大地　巍巍中华／民族团结　世界大同／奋发图强　繁荣昌盛。
- lesson_id: chi-g2-t2-u03-l02
  unit_id: unit-03
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 2
  lesson_name: 2 传统节日
  page_range: P31-P32
  official_examples:
  - 春节到，人欢笑，贴窗花，放鞭炮。
  - 元宵节，看花灯，大街小巷人如潮。
  - 清明节，雨纷纷，先人墓前去祭扫。
  - 过端午，赛龙舟，粽香艾香满堂飘。
  - 七月七，来乞巧，牛郎织女会鹊桥。
  - 过中秋，吃月饼，十五圆月当空照。
  - 重阳节，要敬老，踏秋赏菊去登高。转眼又是新春到，全家团圆真热闹。
  - 按照时间顺序排列下面的节日：端午节　清明节　元宵节　春节　重阳节　中秋节。
- lesson_id: chi-g2-t2-u03-l03
  unit_id: unit-03
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 3
  lesson_name: 3「贝」的故事
  page_range: P33-P34
  official_examples:
  - 一些生活在水里的动物，用贝壳保护自己的身体。甲骨文中的「贝」字，就像一种海贝的样子。
  - 古时候，人们觉得贝壳很漂亮，很珍贵，喜欢把它们当作饰品戴在身上。而且贝壳可以随身携带，不容易损坏，于是古人还把贝壳当作钱币。所以，用「贝」作偏旁的字大多与钱财有关，如「赚、赔、购、贫、货」。
  - 读一读，记一记：珍贵　贵重／损坏　破损／硬币　纸币／财富　财产／赔本　赔礼／购买　采购。
- lesson_id: chi-g2-t2-u03-l04
  unit_id: unit-03
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 4
  lesson_name: 4 中国美食
  page_range: P35-P36
  official_examples:
  - 小鸡炖蘑菇、葱爆羊肉、烤鸭、水煮鱼、蒸饺、炸酱面、小米粥、蛋炒饭、红烧茄子、凉拌菠菜、香煎豆腐。
  - 读一读，说说制作哪些食物时需要用到这些方法：炒　烤　烧　爆　炖　炸　煎　蒸　煮。
  - 用部首查字法查下面的字：灶　焰　烫　煲　熏。
- lesson_id: chi-g2-t2-u03-l05
  unit_id: unit-03
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 5
  lesson_name: 语文园地三
  page_range: P37-P38
  official_examples:
  - 识字加油站：甜津津　酸溜溜　辣乎乎　香喷喷　油腻腻　软绵绵　脆生生　硬邦邦。
  - 字词句运用：读一读，和同学交流你的发现（想／感／怒／惊／怕／慌；炒／烤／烧／煎／蒸／煮；刺／刮／剑／分／剪／切）。
  - 日积月累：子鼠　丑牛　寅虎　卯兔　辰龙　巳蛇　午马　未羊　申猴　酉鸡　戌狗　亥猪。
  - 选一选，连一连：霄／宵／削、赔／陪／培。
- lesson_id: chi-g2-t2-u03-l06
  unit_id: unit-03
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 6
  lesson_name: 口语交际：长大以后做什么
  page_range: P39
  official_examples:
  - 你长大以后想做什么？为什么？跟小组同学说一说你的愿望，然后问一问他们的愿望是什么。
  - ◎ 清楚地表达想法，简单说明理由。◎ 对感兴趣的内容多问一问。
- lesson_id: chi-g2-t2-u03-l07
  unit_id: unit-03
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 7
  lesson_name: 我爱阅读：一株紫丁香
  page_range: P40-P41
  official_examples:
  - 踮起脚尖儿，走进安静的小院，我们把一株紫丁香，栽在老师窗前。……
