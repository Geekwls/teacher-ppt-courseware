- lesson_id: chi-g2-t2-u02-l01
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 1
  lesson_name: 5 雷锋叔叔，你在哪里
  page_range: P15-P17
  official_examples:
  - 沿着长长的小溪，寻找雷锋的足迹。雷锋叔叔，你在哪里，你在哪里？
  - 顺着弯弯的小路，寻找雷锋的足迹。……瞧，那花瓣上晶莹的露珠，就是他洒下的汗滴。
  - 乘着温暖的春风，我们四处寻觅。啊，终于找到了——哪里需要献出爱心，雷锋叔叔就出现在哪里。
  - 猜猜下面词语的意思，并说说你是怎么猜出来的：足迹、泥泞、晶莹、寻觅。
- lesson_id: chi-g2-t2-u02-l02
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 2
  lesson_name: 6 千人糕
  page_range: P18-P20
  official_examples:
  - 一天，爸爸对孩子说：「今天我们来吃千人糕吧。」
  - 爸爸拿起面前的糕，说：「你看，一块平平常常的糕，要经过很多很多人的劳动，才能摆在我们面前。」
  - 孩子听了爸爸的话，仔细想了想，说：「爸爸，这糕的确应该叫『千人糕』啊！」
  - 读一读，记一记：蛋糕　雪糕　糕点／品尝　尝鲜　尝试／米粉　面粉　粉丝／确定　确实　正确。
- lesson_id: chi-g2-t2-u02-l03
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 3
  lesson_name: 7 我不是最弱小的
  page_range: P21-P23
  official_examples:
  - 夏天的一个周末，四岁的萨沙和哥哥托利亚跟父母一起到森林中去玩。
  - 妈妈回答说：「我们应该保护比自己弱小的。」
  - 萨沙掀起雨衣，轻轻地遮在野蔷薇花上，问道：「妈妈，现在我还是最弱小的吗？」
  - 妈妈笑着说：「不，不，你能保护更弱小的，你是勇敢的孩子啦！」
- lesson_id: chi-g2-t2-u02-l04
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 4
  lesson_name: 语文园地二
  page_range: P24-P25
  official_examples:
  - 识字加油站：教师、工程师、魔术师、建筑师、理发师、演员、营业员、服务员、裁判员、饲养员。
  - 字词句运用：下面这些字查什么部首？查一查，记一记（鹿／麝、金／鉴、高／敲、音／章、黑／默、衣／裂、辛／辣、鱼／鲁）。
  - 日积月累：予人玫瑰，手有余香。／平时肯帮人，急时有人帮。／与其锦上添花，不如雪中送炭。
- lesson_id: chi-g2-t2-u02-l05
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 5
  lesson_name: 写话：我的好朋友
  page_range: P26
  official_examples:
  - 写一写你的一个好朋友。向大家介绍一下：他是谁？长什么样子？你们经常一起做什么？
- lesson_id: chi-g2-t2-u02-l06
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 6
  lesson_name: 我爱阅读：雷锋日记二则
  page_range: P26-P27
  official_examples:
  - 1960年8月20日：望花区成立了一个人民公社，我把平时节约下来的一百元钱支援了他们……
  - 1961年10月15日：今天是星期日，我没有外出，给班里的同志洗了五床褥单……
- lesson_id: chi-g2-t2-u02-l07
  unit_id: unit-02
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 7
  lesson_name: 快乐读书吧：读读儿童故事
  page_range: P28
  official_examples:
  - 故事里的儿童，有的顽皮、可爱，有的懂事、善良……
  - 读书的时候，我们可以先看看书的目录。目录告诉我们书里主要写了什么，要读的内容从哪一页开始。
