    anchor_text: P24「语文园地二」识字加油站：教师、工程师、魔术师、建筑师、理发师、演员、营业员、服务员、裁判员、饲养员；字词句运用：下面这些字查什么部首（鹿／麝、金／鉴、高／敲、音／章、黑／默、衣／裂、辛／辣、鱼／鲁）；P25 日积月累：予人玫瑰，手有余香。／平时肯帮人，急时有人帮。／与其锦上添花，不如雪中送炭。
