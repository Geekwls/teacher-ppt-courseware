page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版统编版小学语文二年级下册电子课本》逐页实证核定：本册可读印刷页区间为 P1–P54。本单元真实版面为 P15–P28（第三单元起始页 P29），全部落在可读区间内，故记为 verified。已据原文逐页取证：P15「5 雷锋叔叔，你在哪里」（沿着长长的小溪，寻找雷锋的足迹。……）、P16「顺着弯弯的小路，寻找雷锋的足迹。」「乘着温暖的春风，我们四处寻觅。啊，终于找到了——哪里需要献出爱心，雷锋叔叔就出现在哪里。」、P17「猜猜下面词语的意思，并说说你是怎么猜出来的（足迹　泥泞　晶莹　寻觅）」、P18「6 千人糕」（一天，爸爸对孩子说：『今天我们来吃千人糕吧。』……）、P19「爸爸拿起面前的糕，说：『你看，一块平平常常的糕，要经过很多很多人的劳动，才能摆在我们面前。』」、P20「默读课文。结合课文内容和插图，说说一块平常的米糕为什么被称作『千人糕』。」与「读一读，记一记（蛋糕　雪糕　糕点／品尝　尝鲜　尝试／米粉　面粉　粉丝／确定　确实　正确）」、P21「7 我不是最弱小的」（夏天的一个周末，四岁的萨沙和哥哥托利亚跟父母一起到森林中去玩。……妈妈回答说：『我们应该保护比自己弱小的。』）、P22「萨沙朝野蔷薇花丛走去。……妈妈说：『不，不，你能保护更弱小的，你是勇敢的孩子啦！』」、P23「分角色朗读课文」与「读下面的句子，结合妈妈的回答，体会萨沙心里的想法」、P24「语文园地二」识字加油站（教师、工程师、魔术师、建筑师、理发师、演员、营业员、服务员、裁判员、饲养员）与字词句运用（查部首）、P25 日积月累（予人玫瑰，手有余香。／平时肯帮人，急时有人帮。／与其锦上添花，不如雪中送炭。）、P26 写话「我的好朋友」与我爱阅读《雷锋日记二则》、P27《雷锋日记二则》（1960年8月20日、1961年10月15日）、P28 快乐读书吧「读读儿童故事」。
unit_overview: 第二单元是统编版二年级下册的第二个阅读单元，安排 3 篇课文与语文园地二，以「关爱与奉献」为主题，依次是《雷锋叔叔，你在哪里》《千人糕》《我不是最弱小的》。阅读要素为「读句子，想画面；能就课文内容提出问题，并说出自己的看法」；识字写字方面要求会认「锋、昨、冒、蒙、瞧、泞、窝、顺、荆、棘、瓣、莹、觅、需、献、糕、尝、嘛、磨、粉、糖、料、甘、蔗、汁、熬、销、售、的、确、应、弱、末、亚、簇、拥、随、芬、芳、突、紧、递、摸、显、娇、掀」等字，会写「锋、昨、冒、留、弯、背、洒、温、暖、桌、尝、劳、买、甘、具、汁、甜、菜、应、弱、末、母、递、周、吸、勇、敢」等字。语文园地二安排识字加油站（职业名称）、字词句运用（查部首）、日积月累（三句关于助人的格言）与写话「我的好朋友」。
