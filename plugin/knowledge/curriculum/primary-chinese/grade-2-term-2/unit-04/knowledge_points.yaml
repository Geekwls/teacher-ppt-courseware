    anchor_text: P51「语文园地四」识字加油站：拨浪鼓、不倒翁、七巧板、橡皮泥、玩具枪、遥控坦克、航模；字词句运用：我看见喜鹊阿姨站在窝边，一会儿教喜鹊弟弟唱歌，一会儿教他们做游戏，一会儿教他们学自己发明的拼音字母……；P52 日积月累：失信不立。——《左传》／诚信者，天下之结也。——《管子》／小信成则大信立。——《韩非子》。
  teaching_boundary:
