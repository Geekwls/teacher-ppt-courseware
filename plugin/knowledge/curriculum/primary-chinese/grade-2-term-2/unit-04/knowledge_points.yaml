- point_id: chi-g2-t2-u04-p01
  unit_id: unit-04
  lesson_id: chi-g2-t2-u04-l01
  subject: chinese
  grade: 2
  term: term-2
  point_name: 《彩色的梦》：想象与仿写
  learning_objectives:
  - 能朗读课文，边读边想象彩色铅笔描绘的画面
  - 能仿照第2小节或第3小节，用几句话写自己想画的内容
  applicable_question_types:
  - reading
  - writing
  verification_status: verified
  provenance:
    source_id: pep_chinese_g2_t2_2024
    page_ref:
    - P42
    - P43
    - P44
    anchor_text: P42「8 彩色的梦」：「我有一大把彩色的梦，有的长，有的圆，有的硬。他们躺在铅笔盒里聊天，一打开，就在白纸上跳蹦。」「脚尖滑过的地方，大块的草坪，绿了；大朵的野花，红了；大片的天空，蓝了，蓝—得—透—明！」；P43「在葱郁的森林里，雪松们拉着手，请小鸟留下歌声。」「我的彩色梦境，有水果香，有季节风，还有紫葡萄的叮咛，在溪水里流动……」；P44「你想用彩色铅笔画些什么？试着仿照第2小节或第3小节，把想画的内容用几句话写下来。」
  teaching_boundary:
    scope_allowed:
    - 朗读课文并想象画面
    - 仿照课文写几句话
    - 体会拟人写法（铅笔在纸上跳蹦、紫葡萄的叮咛）
    scope_excluded:
    - 现代诗的格律分析
    - 绘画技法讲解
- point_id: chi-g2-t2-u04-p02
  unit_id: unit-04
  lesson_id: chi-g2-t2-u04-l02
  subject: chinese
  grade: 2
  term: term-2
  point_name: 《一匹出色的马》：亲情与妹妹的变化
  learning_objectives:
  - 能有感情地朗读课文，感受美好的亲情
  - 能说出妹妹由「求妈妈抱」到「骄傲地说」的变化及其原因
  applicable_question_types:
  - reading
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_chinese_g2_t2_2024
    page_ref:
    - P45
    - P46
    - P47
    anchor_text: P45「9 一匹出色的马」（起始页）；P46「从路旁一株柳树下，拾起一根又长又细的枝条，把它递给了妹妹，说：『这是一匹出色的马，你走不动了，就骑着它回家吧。』」「妹妹高兴地跨上『马』，蹦蹦跳跳地奔向前去，不时回头看看我们。等我们回到家时，她站在门口，骄傲地说：『看！我比你们先到家。』」；P47「试着有感情地朗读课文，感受美好的亲情。」与「读句子，体会妹妹的变化，再说说她为什么会有这样的变化。」
  teaching_boundary:
    scope_allowed:
    - 有感情地朗读课文
    - 说出妹妹前后的变化及原因
    - 体会「一匹出色的马」其实是柳枝
    scope_excluded:
    - 家庭教育的系统论述
    - 写话
- point_id: chi-g2-t2-u04-p03
  unit_id: unit-04
  lesson_id: chi-g2-t2-u04-l03
  subject: chinese
  grade: 2
  term: term-2
  point_name: 《枫树上的喜鹊》：反复结构与「一会儿……一会儿……」句式
  learning_objectives:
  - 能默读课文，能说出「我」喜欢的是什么
  - 能用「一会儿……一会儿……一会儿……」说句子
  applicable_question_types:
  - reading
  - fill_blank
  - writing
  verification_status: verified
  provenance:
    source_id: pep_chinese_g2_t2_2024
    page_ref:
    - P48
    - P49
    - P50
    anchor_text: P48「10 枫树上的喜鹊」：「我们村的渡口旁有一棵枫树，我很喜欢它。它好像一把很大又很高的绿色太阳伞，一直打开着。」；P49「『鹊！鹊！鹊！』喜鹊阿姨教道。我知道，这便是 a、o、e。」「我懂得，喜鹊弟弟很快给出了答案：『妈妈，那是太阳！太阳升上来了！』」；P50「默读课文。文中反复说『我喜欢』，说说『我』喜欢的是什么。」与P51「字词句运用：我看见喜鹊阿姨站在窝边，一会儿教喜鹊弟弟唱歌，一会儿教他们做游戏，一会儿教他们学自己发明的拼音字母……」
  teaching_boundary:
    scope_allowed:
    - 默读课文并说出「我喜欢」的对象
    - 用「一会儿……一会儿……一会儿……」说句子
    - 体会「喜鹊说话」的想象
    scope_excluded:
    - 鸟类学知识的系统讲解
    - 写话
