lessons:
- lesson_id: chi-g2-t2-u04-l01
  unit_id: unit-04
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 1
  lesson_name: 8 彩色的梦
  page_range: P42-P44
  official_examples:
  - 我有一大把彩色的梦，有的长，有的圆，有的硬。
  - 他们躺在铅笔盒里聊天，一打开，就在白纸上跳蹦。
  - 脚尖滑过的地方，大块的草坪，绿了；大朵的野花，红了；大片的天空，蓝了，蓝—得—透—明！
  - 在葱郁的森林里，雪松们拉着手，请小鸟留下歌声。
  - 我的彩色梦境，有水果香，有季节风，还有紫葡萄的叮咛，在溪水里流动……
  - 你想用彩色铅笔画些什么？试着仿照第2小节或第3小节，把想画的内容用几句话写下来。
- lesson_id: chi-g2-t2-u04-l02
  unit_id: unit-04
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 2
  lesson_name: 9 一匹出色的马
  page_range: P45-P47
  official_examples:
  - 从路旁一株柳树下，拾起一根又长又细的枝条，把它递给了妹妹，说：「这是一匹出色的马，你走不动了，就骑着它回家吧。」
  - 妹妹高兴地跨上「马」，蹦蹦跳跳地奔向前去，不时回头看看我们。等我们回到家时，她站在门口，骄傲地说：「看！我比你们先到家。」
  - 读句子，体会妹妹的变化，再说说她为什么会有这样的变化。
- lesson_id: chi-g2-t2-u04-l03
  unit_id: unit-04
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 3
  lesson_name: 10 枫树上的喜鹊
  page_range: P48-P50
  official_examples:
  - 我们村的渡口旁有一棵枫树，我很喜欢它。它好像一把很大又很高的绿色太阳伞，一直打开着。
  - 「鹊！鹊！鹊！」喜鹊阿姨教道。我知道，这便是 a、o、e。
  - 我懂得，喜鹊弟弟很快给出了答案：「妈妈，那是太阳！太阳升上来了！」
  - 默读课文。文中反复说「我喜欢」，说说「我」喜欢的是什么。
- lesson_id: chi-g2-t2-u04-l04
  unit_id: unit-04
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 4
  lesson_name: 语文园地四
  page_range: P51-P52
  official_examples:
  - 识字加油站：拨浪鼓、不倒翁、七巧板、橡皮泥、玩具枪、遥控坦克、航模。
  - 字词句运用：我看见喜鹊阿姨站在窝边，一会儿教喜鹊弟弟唱歌，一会儿教他们做游戏，一会儿教他们学自己发明的拼音字母……
  - 日积月累：失信不立。——《左传》／诚信者，天下之结也。——《管子》／小信成则大信立。——《韩非子》。
- lesson_id: chi-g2-t2-u04-l05
  unit_id: unit-04
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 5
  lesson_name: 写话：看图写故事
  page_range: P53
  official_examples:
  - 看图，想一想：小青虫、蚂蚁和蝴蝶利用鸡蛋壳做了哪些事情？有哪些有趣的经历？把它们一天的经历写下来吧！
  - 写的时候，可以用上下面的词语：早上　过了一会儿　到了下午　天黑了。
- lesson_id: chi-g2-t2-u04-l06
  unit_id: unit-04
  subject: chinese
  grade: 2
  term: term-2
  lesson_number: 6
  lesson_name: 我爱阅读：手影戏
  page_range: P53-P54
  official_examples:
  - 晚上，妈妈到商店去买东西，宁宁在街灯下等妈妈。他站着没劲，独自玩起了手影戏。
