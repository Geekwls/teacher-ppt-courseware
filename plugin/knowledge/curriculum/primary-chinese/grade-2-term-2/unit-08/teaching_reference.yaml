- point_id: chi-g2-t2-u08-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「为什么射日—怎样射日—射日后的变化」的顺序梳理故事，体会神话的想象与夸张
    difficulty: 学生易把故事的起因、经过、结果弄混
    typical_misconceptions:
    - error_pattern: 把故事的起因与结果弄混
      misconception_type: 情节顺序错误
    - error_pattern: 说不出神话中夸张的地方
      misconception_type: 文体特点未识别
  variation_strategy:
  - 按顺序复述《羿射九日》
  - 找出文中夸张的句子并说一说
- point_id: chi-g2-t2-u08-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「他们为人们做了什么」为线索，体会先民的智慧与奉献精神
    difficulty: 学生易把黄帝与大禹的事迹对应错
    typical_misconceptions:
    - error_pattern: 把黄帝与大禹的事迹对应错
      misconception_type: 内容混淆
    - error_pattern: 说不出大禹治水的方法
      misconception_type: 内容提取不全
  variation_strategy:
  - 连一连：人物与事迹
  - 说说大禹身上值得我们学习的地方
