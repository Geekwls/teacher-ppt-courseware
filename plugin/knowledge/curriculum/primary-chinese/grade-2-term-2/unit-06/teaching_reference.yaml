teaching_references:
- point_id: chi-g2-t2-u06-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「由诗想画」的方式理解诗句，体会色彩描写的表达效果
    difficulty: 学生易把两首古诗的作者与内容张冠李戴
    typical_misconceptions:
    - error_pattern: 把两首诗的内容记混
      misconception_type: 两首诗混淆
    - error_pattern: 说不出「无穷碧」「别样红」的意思
      misconception_type: 诗句理解不到位
  variation_strategy:
  - 配画朗读并背诵两首古诗
  - 说出诗中描写了哪些颜色
- point_id: chi-g2-t2-u06-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「雷雨前—雷雨中—雷雨后」的时间顺序梳理《雷雨》，以「天然指南针」的归纳帮助《要是你在野外迷了路》
    difficulty: 学生易把「太阳、北极星、大树、积雪」辨别方向的方法对应错
    typical_misconceptions:
    - error_pattern: 把大树与积雪的辨别方法对应错
      misconception_type: 方法对应错误
    - error_pattern: 说不出雷雨后的景物变化
      misconception_type: 内容提取不全
  variation_strategy:
  - 按顺序说说雷雨前后的变化
  - 连一连：天然指南针与辨别方向的方法
