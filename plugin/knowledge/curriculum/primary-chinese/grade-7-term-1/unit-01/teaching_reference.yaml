references:
- point_id: chi-g7-t1-u01-p01
  ref_book: 人教统编版《教师教学用书》语文七年级上册第一单元
  ref_page: P2-P10
  pedagogical_focus:
    key_point: 理清课文「盼春-绘春-赞春」的整体构思；精读赏析五幅春景图的观察角度与多感官描写；体会比喻、拟人修辞与动词运用的精妙
    difficulty: 领会融情于景的散文意境，理解末尾三段以「娃娃、小姑娘、青年」为喻赞美春天的深层生命内涵
    typical_misconceptions:
    - error_pattern: 机械认为描写春风只有触觉角度，忽略了「泥土的气息、草味儿」是嗅觉、「牧童的短笛、鸟儿的呼朋引伴」是听觉
      misconception_type: 多感官描写角度认知单一
    - error_pattern: 将「小草偷偷地从土里钻出来」的「偷偷地」与「钻」理解为贬义或普通动作，未体会到其将小草人格化且写出生机活力的精妙
      misconception_type: 关键词语品味浮于表面
  variation_strategy:
  - 词句品析：品味「小草偷偷地从土里钻出来，嫩嫩的，绿绿的」中叠词和动词的表达效果
  - 结构探究：为什么作者要先写春草、春花，再写春风、春雨，最后落脚到「迎春图」？
