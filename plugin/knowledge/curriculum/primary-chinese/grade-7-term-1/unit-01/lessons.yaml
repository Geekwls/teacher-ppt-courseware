  lesson_name: 2 济南的冬天
  page_range: P7-P11
  official_examples:
  - 作者老舍。「一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒，这是不是个理想的境界？」
