  grade: 7
  term: term-1
  lesson_number: 4
  lesson_name: 4 古代诗歌四首
  page_range: P16-P18
  official_examples:
  - 《观沧海》（曹操）「东临碣石，以观沧海。水何澹澹，山岛竦峙。」
  - 《次北固山下》（王湾）「海日生残夜，江春入旧年。」
  - 《天净沙·秋思》（马致远）「枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。」
