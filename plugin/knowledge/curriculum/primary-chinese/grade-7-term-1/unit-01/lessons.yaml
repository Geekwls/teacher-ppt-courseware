  subject: chinese
  grade: 7
  term: term-1
  lesson_number: 1
  lesson_name: 1 春
  page_range: P2-P6
  official_examples:
  - 作者朱自清，现代著名散文家。课文开头「盼望着，盼望着，东风来了，春天的脚步近了。」
  - 绘春部分描绘五幅动人画卷：「小草偷偷地从土里钻出来，嫩嫩的，绿绿的。」「桃树、杏树、梨树，你不让我，我不让你，都开满了花赶趟儿。」「“吹面不寒杨柳风”，不错的，像母亲的手抚摸着你。」「看，像牛毛，像花针，像细丝，密密地斜织着。」「城里乡下，家家户户，老老小小，也赶趟儿似的，一个个都出来了。」
  - 赞春部分末尾三段：「春天像刚落地的娃娃……春天像小姑娘……春天像健壮的青年……」
  - 课后思考探究：朗读课文并体会作者对春天的赞美与热爱之情；揣摩下列语句中加点词语的表现力；体会比喻和拟人修辞手法的作用。
