  unit_id: unit-01
  subject: chinese
  grade: 7
  term: term-1
  lesson_number: 3
  lesson_name: 3 雨的四季
  page_range: P12-P15
  official_examples:
  - 作者刘湛秋。「我喜欢雨，无论什么季节的雨，我都喜欢。她给我的形象和记忆，永远是美的。」
- lesson_id: chi-g7-t1-u01-l04
  unit_id: unit-01
