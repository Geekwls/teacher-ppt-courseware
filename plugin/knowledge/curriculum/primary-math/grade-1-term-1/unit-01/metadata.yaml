unit_overview: 本单元是学生系统学习数的起始单元。教材编排为：1～5 的认识（数数、认数、写数）、比大小（认识「＞」「＜」「＝」）、第几（序数含义）、分与合（数的组成）、5 以内的加法与减法、0 的认识和加、减法，最后是整理和复习。核心是把「数」与「数量」对应起来，并在分与合的基础上理解加减法的意义。
