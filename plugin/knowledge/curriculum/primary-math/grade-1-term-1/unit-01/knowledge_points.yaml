  subject: math
  grade: 1
  term: term-1
  point_name: 5 以内数的分与合（数的组成）
  learning_objectives:
  - 知道 2～5 各数可以分成哪两个数，并能说出几和几组成某个数
  - 在分与合的活动中体会「有序」地找出所有分法
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: partial
  provenance:
    source_id: pep_math_g1_t1_2024
    page_ref:
    - P20
    - P21
    anchor_text: P20「分与合」：「5个分成两堆，可以怎样分？」「5可以分成几和几？几和几组成5？」「4可以分成几和几？」；P21「3和几组成5？」「1和几组成2？」
  teaching_boundary:
    scope_allowed:
    - 说出 2～5 各数的全部分与合
    - 用分与合解释数的组成
    scope_excluded:
