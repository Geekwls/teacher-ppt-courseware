- point_id: math-g1-t1-u01-p01
  unit_id: unit-01
  lesson_id: math-g1-t1-u01-l01
  subject: math
  grade: 1
  term: term-1
  point_name: 1～5 的认识与规范书写（基数含义）
  learning_objectives:
  - 能数出 5 以内物体的个数，并用 1～5 表示
  - 能在田字格中按笔顺规范书写 1～5
  - 理解 1～5 各数的基数含义与数的顺序
  applicable_question_types:
  - fill_blank
  - choice
  - writing
  verification_status: partial
  provenance:
    source_id: pep_math_g1_t1_2024
    page_ref:
    - P14
    - P15
    - P16
    anchor_text: P15「1还能表示生活中哪些事物的数量？2、3、4、5呢？」「拨一拨，数一数。」「描一描，写一写。」；P16「数一数，写一写。」「用自己喜欢的方式表示1、2、3、4、5。」
  teaching_boundary:
    scope_allowed:
    - 5 以内数的认读、书写与顺序
    - 用数表示物体个数并说出数量
    scope_excluded:
    - 6 以上数的认识
    - 加减法计算
    - 数的组成（分与合）
- point_id: math-g1-t1-u01-p02
  unit_id: unit-01
  lesson_id: math-g1-t1-u01-l01
  subject: math
  grade: 1
  term: term-1
  point_name: 比较 5 以内数的大小与「＞」「＜」「＝」的认识
  learning_objectives:
  - 能用一一对应的方法比较 5 以内数的大小
  - 认识大于号、小于号、等号，会读写「3＞2」这样的式子
  - 能用「大于」「小于」「等于」描述比较结果
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: partial
  provenance:
    source_id: pep_math_g1_t1_2024
    page_ref:
    - P17
    - P18
    anchor_text: P17「比大小」：「3 大于2」「3 小于4」「3 = 3」，标注等号、大于号、小于号，读作「3 等于3」。P18 在○里填「＞」「＜」。
  teaching_boundary:
    scope_allowed:
    - 比较 5 以内两个数的大小
    - 认读与书写 ＞、＜、＝
    scope_excluded:
    - 用减法求相差数
    - 20 以内数的大小比较
- point_id: math-g1-t1-u01-p03
  unit_id: unit-01
  lesson_id: math-g1-t1-u01-l01
  subject: math
  grade: 1
  term: term-1
  point_name: 「第几」：序数含义与位置确定
  learning_objectives:
  - 理解「第几」表示物体排列的位置，区分「几个」与「第几个」
  - 能从指定方向数出某一物体的位置
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: partial
  provenance:
    source_id: pep_math_g1_t1_2024
    page_ref:
    - P19
    anchor_text: P19「第几」：「（1）从左边数，圈出4只小鸟，给第4只涂色。（2）从右边数的第2只小鸟飞走了，还剩几只小鸟。」
  teaching_boundary:
    scope_allowed:
    - 按指定方向确定「第几」
    - 区分「几个」与「第几个」
    scope_excluded:
    - 两位数序数
    - 用减法求相差数
- point_id: math-g1-t1-u01-p04
  unit_id: unit-01
