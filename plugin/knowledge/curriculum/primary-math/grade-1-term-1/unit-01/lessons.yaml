  lesson_name: 第一单元 5以内数的认识和加、减法（单元整体）
  page_range: P12-P33
  official_examples:
  - 1～5 的认识：数出物体个数并用 1～5 表示，描一描、写一写（P14–P16）。
  - 比大小：3＞2、3＜4、3＝3，认识大于号、小于号、等号（P17–P18）。
  - 第几：从左边数圈出 4 只小鸟、给第 4 只涂色（P19）。
  - 分与合：5 可以分成几和几，几和几组成 5（P20–P21）。
  - 5 以内的加、减法与 0 的认识、整理和复习（P22–P33，课时页界待核验）。
