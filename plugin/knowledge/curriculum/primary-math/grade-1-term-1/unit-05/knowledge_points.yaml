  point_name: 长方体、正方体、圆柱、球的辨认与特征
  learning_objectives:
  - 能辨认长方体、正方体、圆柱、球，并说出名称
  - 通过观察、触摸、滚动等活动感知各图形的特征
  applicable_question_types:
  - choice
  - fill_blank
  verification_status: partial
  provenance:
    source_id: pep_math_g1_t1_2024
