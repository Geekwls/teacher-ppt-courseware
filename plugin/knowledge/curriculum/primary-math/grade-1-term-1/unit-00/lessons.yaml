  grade: 1
  term: term-1
  lesson_name: 在教室里认一认
  page_range: P6-P7
  official_examples:
  - 一年级有6个班，我们是一（3）班；我们的教室在这里。
  - 教室的前面有国旗、黑板，后面有……左边是窗户，右边……
  - 我的前面是……左边是……
