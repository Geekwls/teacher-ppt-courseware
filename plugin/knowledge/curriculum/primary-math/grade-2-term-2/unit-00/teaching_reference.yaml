teaching_references:
- point_id: math-g2-t2-u00-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 在观察钟面的活动中建立时间单位的直观表象
    difficulty: 学生易把秒针与分针混淆，或说不出钟面共有 60 个小格
    typical_misconceptions:
    - error_pattern: 把秒针说成分针
      misconception_type: 指针辨别不清
    - error_pattern: 钟面小格总数填错（如填 12）
      misconception_type: 钟面结构未掌握
  variation_strategy:
  - 指认钟面上的时针、分针、秒针并说出特点
  - 数一数钟面共有多少个大格、多少个小格
- point_id: math-g2-t2-u00-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 通过拨动指针的观察活动理解时针、分针、秒针转动的对应关系
    difficulty: 学生易把 1 时 = 60 分记成 1 时 = 100 分
    typical_misconceptions:
    - error_pattern: 把 1 时 = 60 分记成 100 分
      misconception_type: 十进与六十进混淆
    - error_pattern: 拨钟时指针转动方向错误
      misconception_type: 钟表运动规律未掌握
  variation_strategy:
  - 拨动分针一圈，观察时针的变化
  - 说一说为什么 30 分叫半小时
- point_id: math-g2-t2-u00-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「先看时针、再看分针」的顺序建立认读方法
    difficulty: 学生易把 4 时 45 分误读为 5 时 45 分（时针接近 5 时）
    typical_misconceptions:
    - error_pattern: 时针接近下一整点时读错小时数
      misconception_type: 时针位置判断失误
    - error_pattern: 把分针指 6 读成 6 分
      misconception_type: 小格与分钟对应错误
  variation_strategy:
  - 认读若干钟面时间并说出方法
  - 拨出指定时间并互相检查
- point_id: math-g2-t2-u00-p04
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 在体验活动中形成时间量感，避免仅停留在单位换算
    difficulty: 学生估计时间普遍偏快或偏慢，缺乏参照标准
    typical_misconceptions:
    - error_pattern: 闭眼数 30 秒时严重偏快
      misconception_type: 时间量感不足
    - error_pattern: 不能说出估计时间的方法
      misconception_type: 方法意识缺失
  variation_strategy:
  - 闭眼数 30 秒并记录与实际的差距
  - 交流估计时间的方法并调整再试一次
- point_id: math-g2-t2-u00-p05
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「时间小书」为任务驱动，整合认读时间与表达
    difficulty: 学生易把时间顺序写乱，或只写事件不写时间
    typical_misconceptions:
    - error_pattern: 事件顺序与时间不符
      misconception_type: 时间顺序意识不足
    - error_pattern: 只记事件不记时刻
      misconception_type: 信息不完整
  variation_strategy:
  - 制作自己的时间小书并与同伴交流
  - 根据同伴的时间小书提出问题
- point_id: math-g2-t2-u00-p06
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以评价表促进反思，落实「珍惜时间」的育人目标
    difficulty: 学生易把评价当作形式，缺乏具体依据
    typical_misconceptions:
    - error_pattern: 评价只说「很好」而无依据
      misconception_type: 反思流于形式
    - error_pattern: 说不出与时间有关的成语
      misconception_type: 积累不足
  variation_strategy:
  - 说出 2 个与时间有关的成语并解释含义
  - 对照评价表说说自己做得最好的一项
