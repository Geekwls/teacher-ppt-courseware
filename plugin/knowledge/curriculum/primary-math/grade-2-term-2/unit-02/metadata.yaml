page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学二年级下册电子课本》逐页实证核定：本册可读印刷页区间为 P1–P54。本单元真实版面为 P24–P39（第三单元起始页 P40），全部落在可读区间内，故记为 verified。已据原文逐页取证：P24 单元扉页（一盒酸奶6杯买3盒、笔袋8元买4个；「都是求几个几的和的问题，都用乘法解决」「都是知道几个几的和，求相同加数或相同加数的个数，都用除法解决」）、P25「倍」的认识（鸡的只数是鹅的3倍）、P26「求甲数是乙数的几倍，就是求甲数里面有几个乙数」（12÷4=3）、P27–P28 练一练、P29「求一个数的几倍是多少，就是求几个几是多少，用乘法解决」（8×4=32）、P30「已知一个数的几倍是多少，求这个数」（袋鼠体长：12÷6=2米）、P31–P32 练一练、P33 求两种灯笼的总数（7个金鱼灯笼，兔子灯笼是它的3倍）、P34 已知两个数量提出数学问题、P35「根据已知条件和问题，提出问题或补充合适的条件，再解答」、P36–P37 练一练、P38「整理和复习」（加减关系/相差关系/倍的关系）、P39「成长小档案」与练一练。
unit_overview: 本单元集中认识数量间的乘除关系。教材先以「求几个几的和」「已知几个几的和求相同加数或个数」归纳乘除法解决实际问题的基本模型；再引入「倍」的概念，依次学习「求一个数是另一个数的几倍」（用除法）、「求一个数的几倍是多少」（用乘法）、「已知一个数的几倍是多少，求这个数」（用除法）；最后训练「根据条件提出问题」与「根据问题补充条件」。本册目录登记本单元版面 P24–P39。
