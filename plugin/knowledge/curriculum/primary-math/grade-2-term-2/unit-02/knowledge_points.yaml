- point_id: math-g2-t2-u02-p04
  unit_id: unit-02
  lesson_id: math-g2-t2-u02-l04
  subject: math
  grade: 2
  term: term-2
  point_name: 求一个数的几倍是多少（用乘法）
  learning_objectives:
  - 理解「求一个数的几倍是多少」就是求几个这个数是多少
  - 会用乘法求一个数的几倍是多少，并能画图说明
  applicable_question_types:
  - fill_blank
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t2_2024
    page_ref:
    - P29
    anchor_text: P29：「李爷爷养了8头牛，养的羊的数量是牛的4倍。李爷爷养了多少只羊？」「8×4=32（只）」「求一个数的几倍是多少，就是求几个几是多少，用乘法解决。」
  teaching_boundary:
    scope_allowed:
    - 用乘法求一个数的几倍是多少
    - 画图表示倍数关系
    scope_excluded:
    - 连乘问题
    - 「多几倍」的表述
- point_id: math-g2-t2-u02-p05
  unit_id: unit-02
  lesson_id: math-g2-t2-u02-l05
  subject: math
  grade: 2
  term: term-2
  point_name: 已知一个数的几倍是多少，求这个数（用除法）
  learning_objectives:
  - 理解「已知一个数的几倍是多少，求这个数」就是求「几份是总数，1 份是多少」
  - 会用除法求这个数，并能画线段图说明
  applicable_question_types:
  - fill_blank
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t2_2024
    page_ref:
    - P30
    - P31
    - P32
    anchor_text: P30：「一只袋鼠一次跳了12米，正好相当于它体长的6倍。这只袋鼠体长多少米？」「12÷6=2（米）」「6份是12米，求1份，用除法计算。」「这是线段图。」
  teaching_boundary:
    scope_allowed:
    - 用除法求「已知几倍是多少，求1份」的问题
    - 用线段图表示数量关系
    scope_excluded:
    - 连除问题
    - 两步问题
