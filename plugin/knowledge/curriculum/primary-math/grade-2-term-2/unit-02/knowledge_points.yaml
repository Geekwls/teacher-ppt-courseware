    anchor_text: P24：「一个笔袋8元，32元能买几个笔袋？」「32÷8=4（个）」「都是知道几个几的和，求相同加数或相同加数的个数，都用除法解决。」
  teaching_boundary:
    scope_allowed:
    - 用除法解决两类「已知总数求每份数或份数」的问题
