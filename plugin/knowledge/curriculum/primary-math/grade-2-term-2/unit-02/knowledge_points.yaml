  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t2_2024
    page_ref:
    - P24
    anchor_text: P24：「一盒酸奶有6杯，买3盒，一共买了多少杯酸奶？」「6×3=18（杯）」「都是求几个几的和的问题，都用乘法解决。」
  teaching_boundary:
