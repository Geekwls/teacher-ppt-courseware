  point_name: 倍的认识与求一个数是另一个数的几倍
  learning_objectives:
  - 理解「一个数是另一个数的几倍」的含义（就是求一个数里面有几个另一个数）
  - 会用除法求一个数是另一个数的几倍
  applicable_question_types:
  - choice
  - fill_blank
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t2_2024
    page_ref:
    - P25
    - P26
    - P27
    - P28
    anchor_text: P25：「鸡比鹅多4只……也可以说鸡的只数是鹅的3倍。」P26：「求甲数是乙数的几倍，就是求甲数里面有几个乙数。」「求12盆是4盆的几倍，就是求12里面有几个4，用除法计算。」「12÷4=3」
  teaching_boundary:
    scope_allowed:
    - 倍的含义与表述
    - 用除法求一个数是另一个数的几倍
    scope_excluded:
