  point_name: 除法模型：已知几个几的和，求相同加数或个数用除法
  learning_objectives:
  - 能识别「已知几个几的和，求相同加数或相同加数的个数」的数量关系并用除法解决
  - 能辨析等分除与包含除两类除法问题
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t2_2024
    page_ref:
