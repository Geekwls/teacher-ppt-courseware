  内部锚点：P1 从不同方向观察同一物体、P2 根据一个面推断立体图形、
  P3 长方体纸盒的展开图、P4 练习一、P5 沿不同边剪开得到不同展开图。
unit_overview: >
  本单元是学生首次系统学习「从不同方向观察物体」，属于「图形与几何」领域。
  内容包括：从前面、上面、左面等不同方向观察同一立体图形或实物，体会看到的形状可能不同；
  根据看到的一个面推断立体图形的可能形状；把长方体纸盒沿不同的边剪开并平铺，
  认识立体图形的展开图，判断平面图形能否折成正方体。
  本单元重在发展学生的空间观念、几何直观与推理意识。
