unit_id: "unit-6"
blueprints:
  - blueprint_id: "bp-math-g3-t1-u06-standard"
    title: "第六单元 分数的初步认识 标准练习卷蓝图"
    target_practice: "单元综合巩固与能力提升练习"
    total_score: 100
    suggested_time_minutes: 40
    difficulty_ratio:
      basic: 0.60
      variation: 0.30
      challenge: 0.10
    question_slots:
      # 一、基础填空（分数的意义）
      - slot_id: "slot-01"
        section: "一、填一填"
        question_type: "fill_blank"
        difficulty: "basic"
        points_per_item: 4
        item_count: 5
        target_points: ["math-g3-t1-u06-p01", "math-g3-t1-u06-p02", "math-g3-t1-u06-p03"]
        guidelines: >
          5 空考查分数的意义与读写：用分数表示涂色部分、指出 3/4 的分子与分母、
          把一根1分米长的线段平均分成10份后每份是几分之几分米、
          「把一个圆平均分成8份，其中的3份是它的（　）」。

      # 二、涂一涂，圈一圈（基础操作）
      - slot_id: "slot-02"
        section: "二、涂一涂，圈一圈"
        question_type: "reading"
        difficulty: "basic"
        points_per_item: 4
        item_count: 5
        target_points: ["math-g3-t1-u06-p01", "math-g3-t1-u06-p03", "math-g3-t1-u06-p07"]
        guidelines: >
          5 小题操作：按给定分数给图形涂色（如 2/5、3/4）；在一盒（若干）苹果图中圈出 1/2，
          并回答「为什么圈出的个数不同却都能表示 1/2」。考查「平均分」前提与整体意识。

      # 三、比一比（基础）
      - slot_id: "slot-03"
        section: "三、在○里填上「>」「<」或「=」"
        question_type: "choice"
        difficulty: "basic"
        points_per_item: 4
        item_count: 5
        target_points: ["math-g3-t1-u06-p04"]
        guidelines: >
          5 小题比较分数大小：2/5○4/5、1/4○1/6、7/7○5/7、3/20○7/20、
          1/2○1/3。其中分子是1的题目考查「分母越大分数越小」，
          干扰点在于受整数思维影响误判。

      # 四、算一算（变式）
      - slot_id: "slot-04"
        section: "四、计算下面各题"
        question_type: "calculation"
        difficulty: "variation"
        points_per_item: 5
        item_count: 3
        target_points: ["math-g3-t1-u06-p05", "math-g3-t1-u06-p06"]
        guidelines: >
          3 道分数计算（每题含2个小题）：①同分母分数加法（1/8+2/8、5/8+3/8）；
          ②同分母分数减法（5/7−2/7、9/9−6/9）；③1减几分之几（1−3/4、1−2/9）。
          每题须在元数据中给出 check_expression（如 "1 - 3/4 == 1/4" 以分数形式表达）。

      # 五、解决问题（变式）
      - slot_id: "slot-05"
        section: "五、解决问题"
        question_type: "word_problem"
        difficulty: "variation"
        points_per_item: 5
        item_count: 3
        target_points: ["math-g3-t1-u06-p06", "math-g3-t1-u06-p08"]
        guidelines: >
          3 道实际问题：①一块巧克力妹妹吃 1/8、姐姐吃 3/8，一共吃了几分之几、妹妹比姐姐少吃几分之几；
          ②工人师傅铺地砖上午铺 1/5、下午铺 2/5，一天共铺几分之几、还剩几分之几；
          ③航模小组12人，1/3 是女生，男、女生各有多少人。答案须含分步列式、单位与文字作答。

      # 六、思维挑战（10%）
      - slot_id: "slot-06"
        section: "六、想一想"
        question_type: "reading"
        difficulty: "challenge"
        points_per_item: 10
        item_count: 1
        target_points: ["math-g3-t1-u06-p09"]
        guidelines: >
          1 道探究题（10分）：拿一张长方形纸对折、再对折……观察并填表
          （对折1次、2次、3次、4次后平均分成的份数与每份是这张纸的几分之一），
          写出发现的规律，并回答「如果对折6次，每份是这张纸的几分之一」。
          要求写出探究过程与规律表述。
