unit_overview: >
  本单元是学生首次认识分数，属于「数与运算」领域。内容包括：结合平均分物体的过程认识
  几分之一和几分之几，知道分数各部分的名称（分子、分数线、分母），会读、写简单的分数；
  结合图形比较同分母分数的大小和分子是1的两个分数的大小；会计算同分母分数的加、减法
  （含1减几分之几）；能把一些物体看作一个整体，用分数表示其中的一部分，并会求一个数的
  几分之几是多少。本单元重在帮助学生初步建立分数的概念，发展数感与运算能力，
  体会分数与整数的联系与区别。
