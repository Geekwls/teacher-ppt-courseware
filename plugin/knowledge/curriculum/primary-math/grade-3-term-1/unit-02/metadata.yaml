  单元起始页 P6（24−13+18 综合算式），单元结束页 P19（练习四、成长小档案）。
  内部锚点：P6 同级运算从左往右、P7 两级运算先乘除后加减、P8 含括号的运算、
  P12 用综合算式解决两步问题、P13-P14 不同思路解决问题、P18 整理和复习。
unit_overview: >
  本单元在学生已掌握加、减、乘、除一步计算的基础上，学习含有两步或两步以上运算的
  混合运算。内容包括：只有加、减法或只有乘、除法的算式从左往右依次计算；
  既有乘、除法又有加、减法的算式先算乘除、后算加减；含有括号的算式先算括号里面的。
  同时学习用综合算式解决需要两步计算的实际问题，体会「先求什么、再求什么」的分析过程，
  发展运算能力与应用意识。
