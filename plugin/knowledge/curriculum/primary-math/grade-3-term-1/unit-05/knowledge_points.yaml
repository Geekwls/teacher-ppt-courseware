unit_id: "unit-5"
source_id: "pep_math_g3_t1_2024"
points:
  - point_id: "math-g3-t1-u05-p01"
    lesson_id: "lesson-01"
    point_name: "线段、射线、直线的特征与表示"
    learning_objectives:
      - "认识线段、射线和直线，知道线段有两个端点、射线只有一个端点、直线没有端点"
      - "知道线段可以度量，射线和直线都可以无限延伸、不可度量"
      - "会用大写字母表示线段、射线、直线（如线段AB、射线AB、直线AB或直线l）"
    prerequisites:
      - "初步认识线段，会用直尺量线段的长度"
    subsequent_points:
      - "math-g3-t1-u05-p02"
    applicable_question_types: ["choice", "fill_blank", "reading"]
    teaching_boundary:
      scope_allowed:
        - "三种线的端点个数、可否度量、可否延伸的比较与判断"
        - "用字母表示线段、射线、直线；在图中辨认三种线"
      scope_excluded:
        - "线段、射线、直线的几何符号语言书写（如 AB 上方加横线记号的表示法，初中内容）"
        - "射线的方向性严格定义与角平分线等（高年级及以上）"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [61]
      example_ref: ["ex_1"]
    verification_status: "verified"

  - point_id: "math-g3-t1-u05-p02"
    lesson_id: "lesson-01"
    point_name: "两点间线段最短与两点间的距离"
    learning_objectives:
      - "通过比较几条连线，知道两点间所有连线中线段最短"
      - "理解两点间的距离就是连接两点的线段的长度"
      - "能运用「线段最短」解释生活中的路线选择问题"
    prerequisites:
      - "math-g3-t1-u05-p01"
    subsequent_points:
      - "math-g3-t1-u05-p03"
    applicable_question_types: ["choice", "word_problem", "reading"]
    teaching_boundary:
      scope_allowed:
        - "判断多条路线中哪条最近；说明两点间线段最短"
        - "用「两点间的距离」描述连接两点的线段长度"
      scope_excluded:
        - "三角形三边关系（四年级及以后）"
        - "最短路径的复杂变式（初中）"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [62]
      example_ref: ["ex_2"]
    verification_status: "verified"

  - point_id: "math-g3-t1-u05-p03"
    lesson_id: "lesson-02"
    point_name: "用圆规比较线段的长短"
    learning_objectives:
      - "会用尺子量出线段长度再比较，体会度量的方法"
      - "会用圆规把一条线段移到另一处，通过重叠比较线段的长短"
      - "能借助圆规在直线上截取与已知线段相等的线段"
    prerequisites:
      - "math-g3-t1-u05-p02"
      - "会用直尺测量线段的长度"
    subsequent_points:
      - "math-g3-t1-u05-p04"
    applicable_question_types: ["reading", "choice", "fill_blank"]
    teaching_boundary:
      scope_allowed:
        - "用圆规比较两条（或几组）线段的长短并作判断"
        - "用圆规在直线上作一条与已知线段等长的线段"
      scope_excluded:
        - "用尺规作三角形、作垂直平分线（初中内容）"
        - "涉及无理数长度的尺规作图"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [63, 64, 65]
      example_ref: ["ex_3", "ex_4"]
    verification_status: "verified"

  - point_id: "math-g3-t1-u05-p04"
    lesson_id: "lesson-03"
    point_name: "角的认识（顶点、边与表示）"
    learning_objectives:
      - "知道从一个点引出两条射线所组成的图形是角"
      - "知道角有一个顶点和两条边，会用符号「∠」表示角"
      - "能借助尺子从一点出发画两条射线画出一个角，并体会张口越大角越大"
    prerequisites:
      - "math-g3-t1-u05-p01"
    subsequent_points:
      - "math-g3-t1-u05-p05"
    applicable_question_types: ["fill_blank", "choice", "reading"]
    teaching_boundary:
      scope_allowed:
        - "辨认角、指出角的顶点和边；用符号表示角"
        - "画角；比较两个角张口的大小"
      scope_excluded:
        - "角的度量（度、量角器，四年级上册）"
        - "角的分类命名之外的运算（如角度计算）"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [66]
      example_ref: ["ex_5"]
    verification_status: "verified"

  - point_id: "math-g3-t1-u05-p05"
    lesson_id: "lesson-03"
    point_name: "直角的认识与判断"
    learning_objectives:
      - "知道三角尺上有一个角是直角，能说出直角"
      - "会用三角尺上的直角去比一比，判断一个角是不是直角"
      - "会用纸折出直角，会用三角尺画直角"
    prerequisites:
      - "math-g3-t1-u05-p04"
    subsequent_points:
      - "math-g3-t1-u05-p06"
    applicable_question_types: ["choice", "reading", "fill_blank"]
    teaching_boundary:
      scope_allowed:
        - "用三角尺比一比判断直角；折直角、画直角"
        - "在常见物体表面找出直角"
      scope_excluded:
        - "直角的符号标注与角度 90° 的定量描述（四年级起）"
        - "垂直的严格定义（四年级）"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [67]
      example_ref: ["ex_6"]
    verification_status: "verified"

  - point_id: "math-g3-t1-u05-p06"
    lesson_id: "lesson-04"
    point_name: "锐角、直角和钝角的分类"
    learning_objectives:
      - "知道比直角小的角是锐角，比直角大的角是钝角"
      - "能以直角为标准，判断一个角是锐角、直角还是钝角"
      - "能在常见图形（红领巾、中队旗、七巧板等）中找出并分类各种角"
    prerequisites:
      - "math-g3-t1-u05-p05"
    subsequent_points:
      - "math-g3-t1-u05-p07"
    applicable_question_types: ["choice", "fill_blank", "reading"]
    teaching_boundary:
      scope_allowed:
        - "用三角尺上的直角比一比后对锐角、直角、钝角进行分类"
        - "在图形中数角、找角、剪角等操作性问题"
      scope_excluded:
        - "平角、周角（四年级上册）"
        - "角的度数计算与三角尺拼角的度数表示（四年级）"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [68, 70]
      example_ref: ["ex_7", "ex_8"]
    verification_status: "verified"

  - point_id: "math-g3-t1-u05-p07"
    lesson_id: "lesson-05"
    point_name: "「线和角」的结构化整理"
    learning_objectives:
      - "能用知识结构图整理线段、射线、直线的特征以及锐角、直角、钝角的关系"
      - "能综合运用本单元知识数一数图形中的线段和角的个数"
      - "在整理中体会几何图形之间的联系，发展结构化思维"
    prerequisites:
      - "math-g3-t1-u05-p03"
      - "math-g3-t1-u05-p06"
    subsequent_points: []
    applicable_question_types: ["fill_blank", "choice", "reading"]
    teaching_boundary:
      scope_allowed:
        - "补全「线和角」知识结构图；数图形中的线段数与角数"
        - "判断直线交点、两条直线相交组成的角的个数"
      scope_excluded:
        - "组合图形中角数的通项公式推导（超出本册要求）"
        - "相交线的对顶角等性质（初中）"
    provenance:
      source_id: "pep_math_g3_t1_2024"
      page_ref: [71, 72]
      example_ref: ["ex_9"]
    verification_status: "verified"
