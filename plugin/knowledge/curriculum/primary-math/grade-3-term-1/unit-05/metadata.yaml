unit_overview: >
  本单元属于「图形与几何」领域。内容包括：认识线段、射线、直线，知道线段有两个端点、
  可以度量，射线只有一个端点、向一端无限延伸，直线没有端点、向两端无限延伸，体会三者
  的联系与区别；知道两点间所有连线中线段最短，理解两点间的距离；会用圆规比较线段的
  长短；认识角，知道角由一个顶点和两条边组成，会用符号「∠」表示角；认识直角，会用
  三角尺上的直角判断和画直角；认识锐角（比直角小）和钝角（比直角大），能对常见的角
  进行分类。本单元重在发展学生的几何直观、空间观念与推理意识。
