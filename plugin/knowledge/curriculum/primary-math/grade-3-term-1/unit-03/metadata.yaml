unit_overview: >
  本单元属于「图形与几何」领域中的测量内容。学生在已认识厘米、米的基础上，学习毫米、分米、千米
  三个长度单位，知道「毫米是比厘米更小的单位、分米是比厘米更大的单位、千米是计量较长路程的单位」，
  理解相邻常用长度单位间的十进关系（毫米—厘米—分米—米，进率均为 10）与米和千米之间的千进关系
  （1 千米 = 1000 米），掌握长度单位间的简单换算，能选择合适的长度单位，并结合一个标准估计一段距离。
  本单元重在发展学生的量感、空间观念与应用意识。
