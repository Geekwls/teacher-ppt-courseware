unit_overview: >
  本单元是在学生熟练掌握表内乘法（乘法口诀）以及百以内加减法的基础上进行学习的。
  内容包括整十、整百、整千数乘一位数的口算，两位数乘一位数（不进位）口算，
  两、三位数乘一位数的笔算（不进位、一次进位、连续进位），0 的乘法规律，
  因数中间或末尾有 0 的乘法，以及用估算解决实际问题。这是后续学习多位数乘多位数
  和小数乘法的重要基础。
