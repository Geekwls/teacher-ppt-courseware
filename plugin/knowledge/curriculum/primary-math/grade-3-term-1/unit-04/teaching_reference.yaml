unit_id: "unit-4"
source_id: "pep_math_g3_t1_tr_2024"
ref_page_note: >
  教参页码于 2026-10-09 依据用户提供的《2025年秋人教版教师教学用书数学三年级上册》
  （409 页扫描件，OCR 解析）重新核定。第四单元《多位数乘一位数》在教参中的位置为
  P117–P163：总体设计 P117–P124、教材分析 P125–P142、教学设计案例 P143–P156
  （课题1「口算乘法」P143、课题2「不进位、进位的笔算乘法」P147）、
  拓展资源 P157–P159、评价建议及样例 P160–P163。
  此前登记的 P90–P128 系旧版（2013 审定版）教参版面，**已废弃**。
teaching_references:
  - point_id: "math-g3-t1-u04-p01"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P143-P146"
    pedagogical_focus:
      key_point: "理解整十、整百数乘一位数的算理，掌握用表内乘法口诀推导口算结果的方法"
      difficulty: "乘积末尾添0的个数判定，特别是因数自身相乘末尾产生0的情况（如 50×6=300，5×6=30产生一个0，原因数有一个0，合起来两个0）"
      typical_misconceptions:
        - error_pattern: "50×6 算成 30（把 5×6=30 算完后，漏添原因数末尾的 1 个 0）"
          misconception_type: "漏添末尾0"
        - error_pattern: "400×2 算成 80（整百数乘一位数少写一个0）"
          misconception_type: "数位级别混淆"
    variation_strategy:
      - "对比组设计：5×6=30, 50×6=300, 500×6=3000，体会规律"
      - "易错陷阱：50×8 的积末尾有（ ）个0（答案是2个0，学生易错选1个0）"

  - point_id: "math-g3-t1-u04-p02"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P143-P146"
    pedagogical_focus:
      key_point: "经历两位数乘一位数（不进位）口算过程，掌握拆分相乘再相加的算理"
      difficulty: "口算脱式心算时，十位相乘结果与个位相乘结果在头脑中暂存并正确累加"
      typical_misconceptions:
        - error_pattern: "12×3 算成 32（只算十位 10×3=30，忘记乘个位 2×3，直接加个位数字 2 得 32）"
          misconception_type: "漏乘个位"
        - error_pattern: "12×3 算成 16（把乘法与加法算理混淆，10+2×3 或全加）"
          misconception_type: "运算法则混淆"
    variation_strategy:
      - "分步填空题：把 14×2 拆解为 10×( )=( )，4×( )=( )，( )+( )=( )"
      - "找错题：呈现 23×3=63，让学生指出错在没有乘个位 3"

  - point_id: "math-g3-t1-u04-p03"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P147-P156"
    pedagogical_focus:
      key_point: "掌握两、三位数乘一位数笔算竖式的规范书写格式和计算顺序"
      difficulty: "理解竖式中第二步乘十位上的数所得的积表示几个十，必须写在十位上"
      typical_misconceptions:
        - error_pattern: "213×3 竖式计算时，用3乘十位上的1得3，错误写在百位或个位上"
          misconception_type: "竖式数位对齐错乱"
    variation_strategy:
      - "三位数不进位笔算横式转竖式填空"

  - point_id: "math-g3-t1-u04-p04"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P147-P156"
    pedagogical_focus:
      key_point: "明确从个位乘起，满几十就向前一位进几；十位相乘后必须加上进位数字"
      difficulty: "乘加运算结合，容易漏加个位进上来的数"
      typical_misconceptions:
        - error_pattern: "16×3 算成 38（个位 6×3=18 进 1，十位 1×3=3 后忘记加进位的 1，直接写 3）"
          misconception_type: "漏加进位数"
        - error_pattern: "16×3 算成 42（把进上来的 1 先与十位的 1 相加得 2，再去乘 3 得 6，先加后乘错误）"
          misconception_type: "先加后乘（运算顺序倒置）"
    variation_strategy:
      - "选择题干扰项构造：以漏加进位数（38）或先加后乘为错误选项"
      - "改错题：针对 27×3 竖式直接标出进位点"

  - point_id: "math-g3-t1-u04-p05"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P147-P156"
    pedagogical_focus:
      key_point: "连续进位的笔算法则，哪一位满几十向前一位进几，前一位相乘后加上进位数可能再次进位"
      difficulty: "连续两次进位时，数位累加容易出现计算疲倦或进位数记错"
      typical_misconceptions:
        - error_pattern: "24×9 算成 186（个位 4×9=36 进 3，十位 2×9=18 忘记加 3）"
          misconception_type: "高强度连续进位漏加"
        - error_pattern: "137×6 算成 722（十位 3×6=18 加上个位进的 4 得 22 进 2，百位 1×6=6 忘记加 2 算成 6+1 或漏加）"
          misconception_type: "多位数跨数位连续进位混淆"
    variation_strategy:
      - "填空题：已知 4□8 × 3 的积是四位数，求□的最小值"
      - "数字谜题：填补乘法竖式中缺失的数字"

  - point_id: "math-g3-t1-u04-p06"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P147-P156"
    pedagogical_focus:
      key_point: "深刻领会“0和任何数相乘都得0”的本质，通过加法情境验证"
      difficulty: "极易与“0加任何数得原数”发生混淆"
      typical_misconceptions:
        - error_pattern: "0×7 算成 7（把乘法与 0+7=7 混淆）"
          misconception_type: "0的乘加混淆"
        - error_pattern: "0×0 算成 1 或无意义"
          misconception_type: "特殊零乘零概念模糊"
    variation_strategy:
      - "判断题：0和任何数相乘都得0（√）；0和任何数相加都得0（×）"
      - "对比计算：0+8 与 0×8"

  - point_id: "math-g3-t1-u04-p07"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P147-P156"
    pedagogical_focus:
      key_point: "因数中间有0的乘法笔算方法：十位上的0也必须参与相乘，加上个位进上来的数"
      difficulty: "克服“中间有0乘积中间一定有0”或“中间有0直接跳过不乘”的常见误区"
      typical_misconceptions:
        - error_pattern: "504×3 算成 1502（个位 4×3=12 写2进1，十位 0×3=0 忘记加进位数1，直接写0，百位 5×3=15）"
          misconception_type: "中间有0漏加进位数"
        - error_pattern: "504×3 算成 152（十位 0 不乘，直接把进位 1 漏掉或直接缩短数位）"
          misconception_type: "十位数位遗漏"
        - error_pattern: "直觉认为 608×4 的积中间一定有 0（反例：608×4=2432，积中间无0）"
          misconception_type: "定势思维错觉"
    variation_strategy:
      - "选择题：504×3 的积是（ ），干扰项给 1502, 152, 1512"
      - "判断题：一个因数中间有0，积的中间也一定有0（×，经典辨析）"

  - point_id: "math-g3-t1-u04-p08"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P147-P156"
    pedagogical_focus:
      key_point: "掌握因数末尾有0的乘法竖式简写算法：一位数对齐0前面的数，最后补0"
      difficulty: "乘数与0前面的数相乘自身产生0时，积末尾0的个数计算错误"
      typical_misconceptions:
        - error_pattern: "250×4 算成 100（25×4=100 自身有2个0，学生以为已经有了0，忘记把原因数末尾的1个0添上去，只写了100）"
          misconception_type: "自身产生的0与末尾原有0混为一谈"
        - error_pattern: "450×2 算成 90（把乘完的 900 误少写一个0）"
          misconception_type: "简便竖式补零遗漏"
    variation_strategy:
      - "高频考题：250×4 的积末尾有（ ）个0（填3个0，学生极易填2个0）"
      - "简便竖式对位判断题"

  - point_id: "math-g3-t1-u04-p09"
    ref_book: "人教版《教师教学用书》数学三年级上册第四单元"
    ref_page: "P125-P142"
    pedagogical_focus:
      key_point: "掌握估算方法，能根据具体现实情境选择“往大估”或“往小估”来解决实际问题"
      difficulty: "机械套用四舍五入，忽视实际生活情境需求（如买票钱必须够、装车载重不能超）"
      typical_misconceptions:
        - error_pattern: "门票每张29元，买8张带240元够不够？机械估算 29≈30, 30×8=240，直接判定刚好够或不够，未考虑 29<30 实际花费一定小于240元，所以带240元一定够"
          misconception_type: "只算不析，缺乏不等式推理能力"
    variation_strategy:
      - "实际情境应用题：买电影票带钱够不够（往大估判定）"
      - "载重装车问题（往小估判定安全）"
