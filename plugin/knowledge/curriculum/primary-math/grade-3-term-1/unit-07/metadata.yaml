  内部锚点：P92 数与运算（多位数乘一位数/混合运算/分数）、P93 数量关系、
  P94 常见的量与图形的认识与测量、P95 应用提升（飞机航线）、P96 分数墙、
  P97-P99 练习十九、P100 思考题、P101-P102 数学广角·搭配问题、P103 自我评价。
unit_overview: >
  本单元是全册的整理与复习单元，以「知识结构图」为主线，把本学期所学内容
  按「数与运算」「数量关系」「常见的量」「图形的认识与测量」四个板块进行结构化梳理，
  并通过应用提升与练习十九进行综合应用，最后安排「数学广角：搭配问题」这一
  综合与实践内容，引导学生在探究中体会有序思考、分步计数的方法。
  本单元重在帮助学生建立知识之间的联系，发展整理与反思能力、运算能力、
  推理意识与应用意识。
