unit_id: "unit-7"
source_id: "pep_math_g3_t1_2024"
lessons:
  - lesson_id: "lesson-01"
    lesson_number: 1
    lesson_name: "数与运算的整理"
    page_range: "P92"
    official_examples:
      - example_id: "ex_1"
        title: "整理「数与运算」知识结构图"
        page: 92
        formula_or_context: "口算 12×3；笔算 326×8；混合运算 24−13+15、15÷5×7、4+6×3、(25+15)÷8；分数的认识与简单计算 1/2、1/4、1/4+3/4=1、1−3/4=1/4"
        core_concept: "本学期在表内乘除法基础上学习了多位数乘一位数的口算与笔算，以及混合运算和分数的初步认识；用知识结构图把「数与运算」联系起来。"

  - lesson_id: "lesson-02"
    lesson_number: 2
    lesson_name: "数量关系的整理"
    page_range: "P93"
    official_examples:
      - example_id: "ex_2"
        title: "用四则运算解决问题的方法整理"
        page: 93
        formula_or_context: "小明做8朵，小红比小明少做3朵，小军做的是小红的2倍，求小军做的朵数"
        core_concept: "解决问题时，既可以分步列式，也可以列综合算式；要找出数量间的关系，思考先求什么、再求什么；画线段图可以帮助分析数量关系；用「等量的等量相等」可以解决很多问题。"

  - lesson_id: "lesson-03"
    lesson_number: 3
    lesson_name: "常见的量与图形的认识与测量"
    page_range: "P94"
    official_examples:
      - example_id: "ex_3"
        title: "整理「常见的量」与「图形的认识与测量」知识结构图"
        page: 94
        formula_or_context: "质量单位：克(g)、千克(kg)、吨(t)，相邻进率1000；长度单位：毫米—厘米—分米—米（进率10）、米—千米（进率1000）；锐角<直角<钝角"
        core_concept: "从不同角度观察物体看到的形状常常不同；图形的认识包括线（线段、射线、直线）与角；长方体的表面可以展开成一个平面。"

  - lesson_id: "lesson-04"
    lesson_number: 4
    lesson_name: "应用提升与综合练习"
    page_range: "P95-P100"
    official_examples:
      - example_id: "ex_4"
        title: "应用提升·飞机航线问题"
        page: 95
        formula_or_context: "北京—成都1542千米、北京—广州1908千米、北京—三亚2543千米；1908+690−2543=55（千米）；164×5≈800<1000"
        core_concept: "综合运用长度单位、里程计算、乘法估算与倍数关系解决实际问题；根据需要选择估算还是精确计算。"
      - example_id: "ex_5"
        title: "思考题·租船与行程"
        page: 100
        formula_or_context: "28人租船，大船限坐6人、小船限坐4人，每条船都坐满；王叔叔与李叔叔相向而行18千米"
        core_concept: "综合运用乘除法、分数与行程数量关系解决开放性与挑战性问题，体会方案的多样性。"

  - lesson_id: "lesson-05"
    lesson_number: 5
    lesson_name: "数学广角：搭配问题"
    page_range: "P101-P102"
    official_examples:
      - example_id: "ex_6"
        title: "服装搭配与出行方式的选择"
        page: 101
        formula_or_context: "2件上装、3件下装，每次各选1件，共有 2×3=6 种搭配；从家到A市有2班飞机、3班高铁，共有 2+3=5 种选择"
        core_concept: "搭配服装要分两步（上装有2种、下装有3种），用乘法计算；而选择出行方式只需一步，用加法计算。体会「有序思考、不重复不遗漏」的策略。"
      - example_id: "ex_7"
        title: "挑战自我·组数与比赛场次"
        page: 102
        formula_or_context: "用2、5、7能组成多少个没有重复数字的两位数；三年级4个班每2个班踢一场，一共踢多少场"
        core_concept: "用固定十位或固定一个班的方法有序列举，体会搭配问题与生活实际的联系。"

  - lesson_id: "lesson-06"
    lesson_number: 6
    lesson_name: "自我评价"
    page_range: "P103"
    official_examples:
      - example_id: "ex_8"
        title: "学期自我评价"
        page: 103
        formula_or_context: "学习表现自评（喜欢数学、专心听讲、积极思考、认真作业、发现问题、应用知识、敢于挑战、合理安排时间、了解不足）"
        core_concept: "通过自我评价反思本学期的学习过程，明确还需努力的方面，形成良好的学习习惯。"
