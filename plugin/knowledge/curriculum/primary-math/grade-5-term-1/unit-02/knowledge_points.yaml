- point_id: math-g5-t1-u02-p01
  unit_id: unit-02
  lesson_id: math-g5-t1-u02-l01
  subject: math
  grade: 5
  term: term-1
  point_name: 小数乘整数的计算方法
  learning_objectives:
  - 能按「转化为整数乘法 → 点上小数点」的方法计算小数乘整数
  - 能说出积的小数位数与乘数小数位数的关系
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g5_t1_2024
    page_ref:
    - P7
    - P8
    anchor_text: P7：9.5×3=28.5（9.5 元=9 元 5 角，9 元×3=27 元，5 角×3=15 角，27 元+15 角=28.5 元；也可以把 9.5 元看作 95 角）。P8：0.72×60=43.2（0.72×100=72，72×60=4320，÷100）。「上面两个例题中积和第一个乘数的小数位数相同。」
  teaching_boundary:
    scope_allowed:
    - 把小数乘整数转化为整数乘法
    - 确定积的小数点位置
    - 处理积末尾的 0
    scope_excluded:
    - 十进制与二进制小数的表示
    - 浮点数运算的精度问题
- point_id: math-g5-t1-u02-p02
  unit_id: unit-02
  lesson_id: math-g5-t1-u02-l02
  subject: math
  grade: 5
  term: term-1
  point_name: 小数乘小数的计算方法
  learning_objectives:
  - 能按「先按整数乘法算积，再按乘数小数位数点小数点」计算小数乘小数
  - 能在积的小数位数不够时用 0 补足位数
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g5_t1_2024
    page_ref:
    - P9
    - P10
    anchor_text: P9：4.2×0.8=3.36（4.2×10=42，0.8×10=8，42×8=336，336÷100=3.36）。「先按照整数乘法算出积，再点小数点；点小数点时，看乘数中一共有几位小数，就从积的右边起数出几位，点上小数点。」P10：0.56×0.04=0.0224（「乘得的积的小数位数不够，要在前面用 0 补足位数，再点小数点」）。
  teaching_boundary:
    scope_allowed:
    - 确定乘数中小数的总位数
    - 用 0 补足积的小数位数
    - 计算小数乘小数并说明算理
    scope_excluded:
    - 高精度数值计算的误差传播
    - 定点数与浮点数的表示范围
- point_id: math-g5-t1-u02-p03
  unit_id: unit-02
  lesson_id: math-g5-t1-u02-l02
  subject: math
  grade: 5
  term: term-1
  point_name: 积的近似数（四舍五入）
  learning_objectives:
  - 能根据需要按「四舍五入」法求积的近似数
  - 能说出保留一位、两位小数时应看哪一位
  applicable_question_types:
  - fill_blank
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g5_t1_2024
    page_ref:
    - P11
    anchor_text: P11：「人的嗅觉细胞约有 0.049 亿个，狗的嗅觉细胞个数是人的 45 倍。狗约有多少亿个嗅觉细胞？（得数保留一位小数。）」「根据需要，可以按「四舍五入」法保留一定的小数位数，求出积的近似数。」
  teaching_boundary:
    scope_allowed:
    - 按指定位数求积的近似数
    - 说明四舍五入的规则
    - 在实际问题中判断应保留几位小数
    scope_excluded:
    - 数值分析中的有效数字
    - 测量不确定度
- point_id: math-g5-t1-u02-p04
  unit_id: unit-02
  lesson_id: math-g5-t1-u02-l03
  subject: math
  grade: 5
  term: term-1
  point_name: 积与乘数的大小关系
  learning_objectives:
  - 能判断一个数（0 除外）乘大于 1 或小于 1 的数时积与原数的大小关系
  - 能不计算直接比较积与原数的大小
  applicable_question_types:
  - choice
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_math_g5_t1_2024
    page_ref:
    - P12
    anchor_text: P12：3.9×0.8=3.12<3.9，3.9×1.2=4.68>3.9。「一个数（0 除外）乘大于 1 的数，积比原来的数大。一个数（0 除外）乘小于 1 的数，积比原来的数小。」
  teaching_boundary:
    scope_allowed:
    - 判断积与原数的大小关系
    - 说明判断依据
    - 在○里填「>」「<」或「=」
    scope_excluded:
    - 函数单调性与乘数因子的关系
    - 不等式性质的一般讨论
- point_id: math-g5-t1-u02-p05
  unit_id: unit-02
  lesson_id: math-g5-t1-u02-l04
  subject: math
  grade: 5
  term: term-1
  point_name: 整数乘法运算律推广到小数
  learning_objectives:
  - 能说出整数乘法交换律、结合律、分配律对小数乘法同样适用
  - 能运用运算律进行简便计算
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g5_t1_2024
    page_ref:
    - P17
    - P18
    anchor_text: P17：0.7×1.2=1.2×0.7；(0.8×0.5)×0.4=0.8×(0.5×0.4)；(2.4+3.6)×0.5=2.4×0.5+3.6×0.5。「整数乘法的交换律、结合律和分配律，对于小数乘法也适用。应用乘法的运算律，可以使一些计算简便。」0.25×4.78×4=0.25×4×4.78=4.78；0.65×202=0.65×(200+2)=130+1.3=131.3。
  teaching_boundary:
    scope_allowed:
    - 用运算律进行简便计算
    - 识别可简便的算式结构
    - 说明运算律在小数中同样适用
    scope_excluded:
    - 代数运算律的公理化
    - 矩阵乘法的结合律与交换性
- point_id: math-g5-t1-u02-p06
  unit_id: unit-02
  lesson_id: math-g5-t1-u02-l05
  subject: math
  grade: 5
  term: term-1
  point_name: 用估算解决实际问题
  learning_objectives:
  - 能用「估大」「估小」判断总价的范围并作出判断
  - 能说明估算在解决「够不够」问题中的作用
  applicable_question_types:
  - reading
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g5_t1_2024
    page_ref:
    - P20
    anchor_text: P20：「妈妈带 100 元去超市购物。她买了 2 袋大米，每袋 30.98 元；还买了 0.8 kg 肉，每千克 26.48 元。剩下的钱还够买一盒 10 元的鸡蛋吗？够买一盒 20 元的鸡蛋吗？」估大：30.98×2+26.48×0.8<31×2+27×0.8=83.6<89；估小：>30×2+25×0.8=80。「有时我们只需要知道结果的大致范围，这时就可以通过估算解决问题。」
  teaching_boundary:
    scope_allowed:
    - 用估大/估小确定范围
    - 根据范围作出判断
    - 说明估算的合理性
    scope_excluded:
    - 区间估计与置信区间
    - 误差分析
