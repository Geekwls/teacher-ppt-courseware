lessons:
- lesson_id: math-g5-t1-u02-l01
  unit_id: unit-02
  subject: math
  grade: 5
  term: term-1
  lesson_number: 1
  lesson_name: 小数乘整数
  page_range: P7-P8
  official_examples:
  - 买 3 个 9.5 元的 需要多少钱？9.5×3=28.5（元）。
  - 9.5 元=9 元 5 角：9 元×3=27 元，5 角×3=15 角，27 元+15 角=28.5 元。也可以把 9.5 元看作 95 角，95×3=285（角）=28.5 元。
  - 0.72×60=43.2。利用乘数和积的变化规律：0.72×100=72，72×60=4320，4320÷100=43.2。（小数末尾的 0 可以去掉）
  - 上面两个例题中积和第一个乘数的小数位数相同。
- lesson_id: math-g5-t1-u02-l02
  unit_id: unit-02
  subject: math
  grade: 5
  term: term-1
  lesson_number: 2
  lesson_name: 小数乘小数
  page_range: P9-P11
  official_examples:
  - 五（1）班校园试验田是一个长 4.2 m、宽 0.8 m 的长方形，面积是多少平方米？4.2×0.8=3.36（m²）。
  - 先按照整数乘法算出积，再点小数点；点小数点时，看乘数中一共有几位小数，就从积的右边起数出几位，点上小数点。
  - 0.56×0.04：乘得的积的小数位数不够，要在前面用 0 补足位数，再点小数点（0.0224）。
  - 人的嗅觉细胞约有 0.049 亿个，狗的嗅觉细胞个数是人的 45 倍，狗约有 0.049×45≈2.2（亿个）嗅觉细胞（得数保留一位小数）。
- lesson_id: math-g5-t1-u02-l03
  unit_id: unit-02
  subject: math
  grade: 5
  term: term-1
  lesson_number: 3
  lesson_name: 积与乘数的大小关系（倍的关系）
  page_range: P12
  official_examples:
  - 五（1）班花生产量 3.9 kg，五（2）班是它的 0.8 倍，五（3）班是它的 1.2 倍：3.9×0.8=3.12（kg），3.9×1.2=4.68（kg）。
  - 一个数（0 除外）乘大于 1 的数，积比原来的数大；一个数（0 除外）乘小于 1 的数，积比原来的数小。
- lesson_id: math-g5-t1-u02-l04
  unit_id: unit-02
  subject: math
  grade: 5
  term: term-1
  lesson_number: 4
  lesson_name: 整数乘法运算律推广到小数
  page_range: P17-P18
  official_examples:
  - 0.7×1.2=1.2×0.7；(0.8×0.5)×0.4=0.8×(0.5×0.4)；(2.4+3.6)×0.5=2.4×0.5+3.6×0.5。
  - 整数乘法的交换律、结合律和分配律，对于小数乘法也适用。
  - 简便计算：0.25×4.78×4=0.25×4×4.78=1×4.78=4.78；0.65×202=0.65×(200+2)=0.65×200+0.65×2=130+1.3=131.3。
- lesson_id: math-g5-t1-u02-l05
  unit_id: unit-02
  subject: math
  grade: 5
  term: term-1
  lesson_number: 5
  lesson_name: 用估算与分段计费解决实际问题
  page_range: P20-P22
  official_examples:
  - 妈妈带 100 元购物，2 袋大米每袋 30.98 元，0.8 kg 肉每千克 26.48 元。估大：30.98×2+26.48×0.8<31×2+27×0.8=62+21.6=83.6<89；估小：>30×2+25×0.8=60+20=80。所以总价在 80 元与 89 元之间，够买 10 元的鸡蛋，不够买 20 元的。
  - 出租车分段计费：3 km 及以内 8 元，超过 3 km 的部分每千米 1.5 元（不足 1 km 按 1 km 计算）。行驶 6.3 km 按 7 km 计费，车费=3 km 以内的费用+超过 3 km 的费用=8+1.5×4=14（元）。
