page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学五年级上册电子课本》逐页实证核定：课本 PDF 共 79 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P77。本单元真实版面为 P7–P23，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P7「小数乘整数」（买 3 个 9.5 元的 需要多少钱？9.5×3=28.5 元；9.5 元=9 元 5 角，9 元×3=27 元，5 角×3=15 角，27 元+15 角=28.5 元）；P8「0.72×60=43.2」（利用乘数和积的变化规律：0.72×100=72，72×60=4320，÷100 得 43.2；小数末尾的 0 可以去掉）；P9「小数乘小数」（长 4.2 m、宽 0.8 m 的长方形面积 4.2×0.8=3.36 m²；4.2×10=42，0.8×10=8，42×8=336，÷100 得 3.36）→「先按照整数乘法算出积，再点小数点；点小数点时，看乘数中一共有几位小数，就从积的右边起数出几位，点上小数点」；P10「0.56×0.04=0.0224」（乘得的积的小数位数不够，要在前面用 0 补足位数再点小数点）；P11「积的近似数」（人的嗅觉细胞约 0.049 亿个，狗的嗅觉细胞个数是人的 45 倍，0.049×45≈2.2 亿个，得数保留一位小数）；P12「倍的关系」：3.9×0.8=3.12，3.9×1.2=4.68；「一个数（0 除外）乘大于 1 的数，积比原来的数大；一个数（0 除外）乘小于 1 的数，积比原来的数小」；P17「整数乘法运算律推广到小数」（0.7×1.2=1.2×0.7；(0.8×0.5)×0.4=0.8×(0.5×0.4)；(2.4+3.6)×0.5=2.4×0.5+3.6×0.5；0.25×4.78×4=0.25×4×4.78；0.65×202=0.65×200+0.65×2）；P20「估算解决问题」（妈妈带 100 元，2 袋大米每袋 30.98 元，0.8 kg 肉每千克 26.48 元，30.98×2+26.48×0.8<89，>80）；P21「分段计费」（出租车 3 km 及以内 8 元，超过 3 km 的部分每千米 1.5 元，不足 1 km 按
  1 km 计算；6.3 km 按 7 km 计费，车费=8+1.5×4=14 元）。
unit_overview: 本单元是在整数乘法与小数意义的基础上，系统学习小数乘法。教材编排为：小数乘整数 → 小数乘小数 → 积的近似数 → 倍的关系（积与乘数的大小比较）→ 整数乘法运算律推广到小数 → 用估算与分段计费解决实际问题 → 整理和复习。核心算理是「转化」：把小数乘法通过乘数与积的变化规律（或小数点移动）转化为整数乘法，算出积后再按乘数中小数的位数点上小数点。
