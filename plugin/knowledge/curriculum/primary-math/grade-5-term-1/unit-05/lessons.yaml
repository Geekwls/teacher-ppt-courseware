- lesson_id: math-g5-t1-u05-l01
  unit_id: unit-05
  subject: math
  grade: 5
  term: term-1
  lesson_number: 1
  lesson_name: 用含字母的式子表示数量关系
  page_range: P55-P56
  official_examples:
  - 爸爸比小红大 25 岁。用小红的年龄 a 表示爸爸的年龄：爸爸的年龄=小红的年龄+25=a+25。
  - 在数学中，我们经常用像 a、a+25、b=a+25 这样的字母或含有字母的式子简洁地表示数或数量之间的关系。
  - 当 a=11 时，b=a+25=11+25=36；当 b=57 时，a=b−25=57−25=32。
  - 「a+25 既可以表示爸爸的年龄，也可以表示小红和爸爸年龄的关系。」
- lesson_id: math-g5-t1-u05-l02
  unit_id: unit-05
  subject: math
  grade: 5
  term: term-1
  lesson_number: 2
  lesson_name: 用字母表示运算律、公式与等式的性质
  page_range: P58-P60
  official_examples:
  - 在月球上能举起的物体质量=在地球上能举起的物体质量×6。用 m 表示在地球上能举起的物体质量，在月球上能举起的物体质量就是 m×6，可以写成 6m（省略乘号时，一般把数字写在字母前面；1 与字母相乘时，1 通常省略不写）。n=6m。
  - 运算律用字母表示：加法交换律 p+q=q+p；加法结合律 a+b+c=a+(b+c)；乘法交换律 a×b=b×a；乘法结合律 a×b×c=a×(b×c)；分配律 a×(b+c)=a×b+a×c。
  - 用 C 表示周长，S 表示面积：正方形 C=4a、S=a×a；长方形 C=2(a+b)=2a+2b、S=ab。两个 a 相乘可以写作 a²，读作 a 的平方。
  - 路程公式 s=vt。当 v=250 米/分、t=20 分时，s=250×20=5000（m）。
  - 等式的性质：如果 a=b，那么 a+c=b+c，a−c=b−c，ac=bc，a÷c=b÷c（c≠0）。
- lesson_id: math-g5-t1-u05-l03
  unit_id: unit-05
  subject: math
  grade: 5
  term: term-1
  lesson_number: 3
  lesson_name: 用含字母的式子表示规律
  page_range: P65-P67
  official_examples:
  - 1 张桌子可以坐 4 人，2 张桌子拼在一起可以坐 6 人，3 张桌子可以坐 8 人……m 张桌子拼在一起可以坐（2+2m）个人，即 n=2+2m（m=4 时 n=2+2×4=10）。
  - 复兴号列车平均每小时行驶 320 km，从甲站到乙站用了 a 小时，从乙站到丙站用了 b 小时，从甲站到丙站的路程 s=320(a+b)=320a+320b。
  - 数列用字母表示第 n 个数：1，2，3，4，…（第 n 个数是 n）；2，4，6，8，…（第 n 个数是 2n）；1，3，5，7，…（第 n 个数是 2n−1）；1，4，9，16，…（第 n 个数是 n²）。
  - 探秘百数表：用 a 表示左上角的数，它右面的数是 a+1，下面的数是 a+10，对角的两个数之和相等。
