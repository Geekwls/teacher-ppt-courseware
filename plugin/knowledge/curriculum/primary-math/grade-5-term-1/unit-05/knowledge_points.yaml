    anchor_text: P62：标准体重=身高−105，刘叔叔身高 a cm，标准体重是（a−105）kg。P66：列车从甲站到丙站行驶的路程 s=320(a+b)，当 a=2、b=3 时，s=320×(2+3)=1600（km）。
  teaching_boundary:
