page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学五年级上册电子课本》逐页实证核定：课本 PDF 共 79 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P77。本单元真实版面为 P55–P71，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P55「爸爸比小红大 25 岁」→「爸爸的年龄=小红的年龄+25」，用小红的年龄 a 表示爸爸的年龄：a+25；P56「在数学中，我们经常用像 a、a+25、b=a+25 这样的字母或含有字母的式子简洁地表示数或数量之间的关系」，「当 a=11 时，b=a+25=36；当 b=57 时，a=b−25=32」；P58「在月球上能举起的物体质量=在地球上能举起的物体质量×6」，m×6 写成 6m（「省略乘号时，一般把数字写在字母前面。1 与字母相乘时，1 通常省略不写」），n=6m；P59 运算律与公式用字母表示（加法交换律 p+q=q+p；正方形 C=4a、S=a×a；长方形 C=2(a+b)=2a+2b、S=ab；两个 a 相乘写作 a²，读作 a 的平方）；s=vt（当 v=250 米/分、t=20 分时，s=250×20=5000 m）；P60「等式的性质」：如果 a=b，那么 a+c=b+c，a−c=b−c，ac=bc，a÷c=b÷c（c≠0）；利用等式的性质求未知数（a+20=37 → a=17；6m=9 → m=1.5）；P65「用 n 表示 m 张桌子拼在一起可坐的人数」：n=2+2m（m=4 时 n=10）；P66「复兴号平均每小时行驶 320 km，甲到乙用 a 小时、乙到丙用 b 小时，总路程 s=320(a+b)=320a+320b」；P67 数列用字母表示（第 n 个数）；P70「探秘百数表」（用 a 表示左上角的数，右面是 a+1，下面的数是 a+10，对角两数之和相等）。
unit_overview: 本单元是小学阶段代数思维的启蒙单元，也是 2024 版教材整合加强的「数与代数」核心单元。教材编排为：用含字母的式子表示数量关系 → 用字母表示运算律、公式与等式的性质 → 代入求值 → 用含字母的式子表示规律（数列、百数表）→ 用含字母的式子解决实际问题 → 整理和复习。核心是让学生经历「由具体的数到一般的字母」的抽象过程，体会字母既能表示一个数，也能表示两个量之间的关系，并初步感受「字母可以像数一样参与运算」。
numeric_upper_bound: 1000000
