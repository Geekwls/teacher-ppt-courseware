page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学五年级上册电子课本》逐页实证核定：课本 PDF 共 79 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P77。本单元真实版面为 P39–P54，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P39「轴对称」（点 A 与点 A′到对称轴的距离都是 3 小格；「轴对称图形上的对应点到对称轴的距离都相等」）；P40「根据对称轴补全轴对称图形」（「先找到几个关键点，画出它们的对应点，再连起来」）；P41「平移」（「图形的形状、大小没有变化」「点 B 移动的距离和点 C 移动的距离相等」）；P42「画出下图向右平移 8 格后的图形」；P43「平移的应用」（把左边这部分剪下来再向右平移 6 格变成一个长方形，6×4=24 cm²）；P46「旋转」（指针从「12」走到「1」，绕点 O 按顺时针方向旋转了 30°；从「3」到「6」绕点 O 按顺时针方向旋转了 90°；三角尺的每条直角边都绕点 O 按顺时针方向旋转了 90°，长度没有变，点 O 的位置不变）；P47「画出三角形 AOB 绕点 O 顺时针旋转 90° 后的图形」（把线段 OB、OA 分别绕点 O 顺时针旋转 90° 画出 OB′、OA′，再将 A′、B′ 连起来）；P50「设计图案」（利用图形的平移、对称和旋转设计图案）；P52 整理和复习（轴对称：对应点连线与对称轴垂直，对应点到对称轴的距离相等；平移：对应点移动方向相同，移动距离相等；旋转：对应点都绕旋转中心按同一方向旋转相同的角度；「在平移和旋转中，图形的大小都不变」）。
unit_overview: 本单元是在二年级「平移与旋转」直观认识的基础上，系统学习图形的运动。教材编排为：轴对称（对应点到对称轴的距离相等、补全轴对称图形）→ 平移（特征与作图）→ 平移的应用（求组合图形面积）→ 旋转（三要素：旋转中心、方向、角度）→ 用平移和旋转拼组图形 → 设计图案 → 整理和复习。核心是让学生从「运动」的角度刻画图形的变换，抓住每种运动的本质特征（轴对称：对应点到对称轴距离相等；平移：方向与距离；旋转：中心、方向、角度），并体会运动不改变图形的大小和形状。
