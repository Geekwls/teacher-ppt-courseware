  pedagogical_focus:
    key_point: 以「铺地砖」的真实情境引出「什么样的图形能不留空隙地铺满平面」
    difficulty: 学生易认为所有多边形都能密铺
    typical_misconceptions:
    - error_pattern: 认为正五边形可以单独密铺
      misconception_type: 条件判断错误
    - error_pattern: 只说图形能密铺而说不出理由
      misconception_type: 解释不充分
  variation_strategy:
  - 判断图形能否单独密铺并说明理由
  - 用图形运动设计密铺图案
