page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学五年级上册电子课本》逐页实证核定：课本 PDF 共 79 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P77。本单元真实版面为 P1–P6，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P1 单元扉页「用 4 个 摆组合体（组合体中的每一个小正方体至少要有一个面与其他小正方体重合）」「下面的图形分别是小红和小亮从什么方向看到的？连一连（从前面看、从上面看、从左面看）」；P2「摆一摆，看一看。从上面看这 3 个组合体，图形相同吗？从左面和前面看呢？」→「从上面看，图形相同；从左面看，图形也相同；从前面看，图形不相同」→结论「从同一方向观察不同组合体，看到的图形可能相同，也可能不同」；P3「按要求摆组合体（1）从前面看到的是…（2）从三个方向看到的图形如下…」；P4 练习一（连一连、画出从前面/上面/左面看到的图形）；P5「从不同方向观察同一个组合体所看到的图形，请把这个组合体摆出来」；P6 生活中的数学「当我们从某一方向观察一个物体时，所看到的平面图形叫作物体的一个视图…主视图、俯视图、仰视图、左视图、右视图和后视图」。
unit_overview: 本单元是小学阶段「图形与几何」领域「观察物体」的第二次系统学习（三上已初步接触）。教材编排为：用 4 个同样的小正方体摆组合体 → 从前面、上面、左面三个方向观察同一组合体看到的形状 → 根据从不同方向看到的形状还原（摆出）组合体 → 练习一（连一连、画视图、还原与计数）→ 生活中的数学（视图与三视图）。核心是让学生经历「实物—视图—还原」的双向转换，发展空间观念与推理能力。
