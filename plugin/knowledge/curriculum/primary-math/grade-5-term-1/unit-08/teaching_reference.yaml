  pedagogical_focus:
    key_point: 以摸球、转盘等试验活动让学生亲身体验随机现象
    difficulty: 学生易把「可能」与「一定」混淆；易把可能性大小与结果次数等同
    typical_misconceptions:
    - error_pattern: 把「可能」当成「一定」
      misconception_type: 确定性判断错误
    - error_pattern: 根据少量试验次数下结论
      misconception_type: 概率理解偏差
  variation_strategy:
  - 用「一定」「可能」「不可能」描述事件
  - 比较可能性的大小并说明理由
