- lesson_id: math-g5-t1-u03-l01
  unit_id: unit-03
  subject: math
  grade: 5
  term: term-1
  lesson_number: 1
  lesson_name: 除数是整数的小数除法
  page_range: P24-P25
  official_examples:
  - 4 名同学兑换了 22 元，平均每人兑换了多少元？22÷4=5.5（元）。
  - 4 名同学兑换了 22.4 元，平均每人兑换了多少元？22.4÷4=5.6（元）。「商的小数点为什么要和被除数的小数点对齐？」
  - 除数是整数的小数除法：1. 按照整数除法的法则去除，商的小数点要和被除数的小数点对齐；2. 如果除到被除数的末尾仍有余数，就在余数后面添 0 继续除。
  - 5.6÷7=0.8：整数部分 5−7 不够商 1，要先商 0，再点小数点。
- lesson_id: math-g5-t1-u03-l02
  unit_id: unit-03
  subject: math
  grade: 5
  term: term-1
  lesson_number: 2
  lesson_name: 循环小数
  page_range: P26-P27
  official_examples:
  - 王鹏跑 400 m 用时 75 秒，他平均每秒跑多少米？400÷75=5.333…（余数总是 25，商的小数部分总是重复出现 3）。
  - 一个数的小数部分，从某一位起，一个数字或者几个数字依次不断重复出现，这样的小数叫作循环小数。
  - 一个循环小数的小数部分，依次不断重复出现的数字，就是这个循环小数的循环节。例如 5.333…的循环节是 3，7.14545…的循环节是 45。
  - 小数部分的位数有限的小数是有限小数（如 0.9375）；位数无限的小数是无限小数（如 0.2142857…）。
  - 1÷7=0.142857…，2÷7=0.285714…，3÷7=0.428571…（循环节 142857 的循环排列）。
- lesson_id: math-g5-t1-u03-l03
  unit_id: unit-03
  subject: math
  grade: 5
  term: term-1
  lesson_number: 3
  lesson_name: 一个数除以小数
  page_range: P33-P34
  official_examples:
  - 奶奶编「中国结」，编一个要用 0.85 m 丝绳。用 7.65 m 丝绳可以编几个？7.65÷0.85=9（个）。
  - 根据商不变的规律，把除数 0.85 和被除数 7.65 同时扩大到原来的 100 倍，变成 765÷85=9。
  - 除数是小数的除法：1. 先移动除数的小数点，使它变成整数；2. 除数的小数点向右移动几位，被除数的小数点也向右移动几位（位数不够的，在被除数的末尾用 0 补足）；3. 然后按除数是整数的小数除法进行计算。12.6÷0.28=45。
- lesson_id: math-g5-t1-u03-l04
  unit_id: unit-03
  subject: math
  grade: 5
  term: term-1
  lesson_number: 4
  lesson_name: 商的近似数与「进一」「去尾」法
  page_range: P37-P38
  official_examples:
  - 32 元买了一袋 2.7 kg 的红豆，每千克大约多少钱？32÷2.7≈11.85（元）。「一般情况下，钱数按「四舍五入」法精确到「分」取近似值就可以了。」
  - 2.7÷0.8=3.375（瓶），能装满 3 瓶，但要把红豆装完，需要准备 4 个瓶子——这里要用「进一」法。
  - 在解决实际问题时，要根据问题的需要确定如何取商的近似值（四舍五入法、进一法、去尾法）。
