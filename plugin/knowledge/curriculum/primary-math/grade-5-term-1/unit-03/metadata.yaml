page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学五年级上册电子课本》逐页实证核定：课本 PDF 共 79 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P77。本单元真实版面为 P24–P38，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P24「除数是整数的小数除法」（4 名同学兑换 22 元，平均每人 22÷4=5.5 元；4 名同学兑换 22.4 元，22.4÷4=5.6 元）→「商的小数点要和被除数的小数点对齐」；P25「除数是整数的小数除法」法则：1. 按照整数除法的法则去除，商的小数点要和被除数的小数点对齐；2. 如果除到被除数的末尾仍有余数，就在余数后面添 0 继续除（如 5.6÷7=0.8，整数部分 5−7 不够商 1，要先商 0 再点小数点）；P26「循环小数」（王鹏跑 400 m 用时 75 秒，400÷75=5.333…，余数总是 25）；P27「一个数的小数部分，从某一位起，一个数字或者几个数字依次不断重复出现，这样的小数叫作循环小数」，循环节（5.333…的循环节是 3，7.14545…的循环节是 45）；有限小数（0.9375）、无限小数（0.2142857…）；1÷7=0.142857…，2÷7=0.285714…（循环节 142857）；P33「一个数除以小数」（编一个中国结要用 0.85 m 丝绳，7.65 m 可以编几个？7.65÷0.85=9 个）；P34 除数是小数的除法法则：1. 先移动除数的小数点，使它变成整数；2. 除数的小数点向右移动几位，被除数的小数点也向右移动几位（位数不够的，在被除数的末尾用 0 补足）；3. 然后按除数是整数的小数除法进行计算（12.6÷0.28=45）；P37「商的近似数」（32 元买 2.7 kg 红豆，32÷2.7≈11.85 元/千克；2.7÷0.8=3.375 瓶，装满 3 瓶，需准备 4 个瓶子——「进一」法）；P38 整理和复习（除数是整数/小数；「四舍五入」法、进一法、去尾法）。
unit_overview: 本单元是在小数乘法的基础上学习小数除法。教材编排为：除数是整数的小数除法 → 循环小数与有限/无限小数 → 一个数除以小数 → 商的近似数 → 用「进一法」「去尾法」解决实际问题 → 整理和复习。核心算理仍是「转化」：除数是整数时按整数除法计算、商的小数点与被除数对齐；除数是小数时先把除数转化为整数（被除数同步移动小数点），再按除数是整数的方法计算。
