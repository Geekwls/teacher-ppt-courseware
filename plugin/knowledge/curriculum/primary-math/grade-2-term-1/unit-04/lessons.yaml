  lesson_name: 第四单元 厘米和米（单元整体）
  page_range: P55-P67
  official_examples:
  - 认识长度单位厘米和米，会用尺子量物体的长度（限整厘米），知道 1 米 = 100 厘米，能估计并测量常见物体的长度。（注：P49–P54 为「校园小导游」综合实践活动，P68–P72 为「身体上的尺子」，不单独登记为单元。）（例题原文待核验）
