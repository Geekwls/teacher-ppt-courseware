    question_type: fill_blank
    difficulty: basic
    points_per_item: 3
    item_count: 4
    target_points:
    - math-g2-t1-u01-p01
    guidelines: 根据分类结果回答「哪种最多/最少」等。
  - slot_id: slot-03
    section: 三、判一判：分类标准与结果
    question_type: choice
    difficulty: basic
    points_per_item: 3
    item_count: 4
    target_points:
    - math-g2-t1-u01-p02
    guidelines: 判断同一组物体按不同标准分类的结果是否可能不同，总数是否不变。
  - slot_id: slot-04
    section: 四、填一填：逐层分类
    question_type: fill_blank
    difficulty: variation
    points_per_item: 5
    item_count: 3
