  - slot_id: slot-05
    section: 五、整理数据：填写统计表
    question_type: fill_blank
    difficulty: basic
    points_per_item: 5
    item_count: 3
    target_points:
    - math-g2-t1-u01-p04
    guidelines: 根据给定的调查记录填写统计表并回答问题。
  - slot_id: slot-06
    section: 六、提问题：根据数据提问并解答
    question_type: reading
    difficulty: variation
    points_per_item: 9
    item_count: 2
    target_points:
    - math-g2-t1-u01-p04
    guidelines: 根据统计表提出两个不同的数学问题并解答。
  - slot_id: slot-07
    section: 七、想一想（开放题）
    question_type: reading
    difficulty: challenge
    points_per_item: 13
    item_count: 1
    target_points:
