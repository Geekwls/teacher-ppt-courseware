  title: 第一单元 分类与整理标准练习卷命题蓝图
  target_practice: 单元综合巩固与能力提升练习
  total_score: 100
  suggested_time_minutes: 60
  difficulty_ratio:
    basic: 0.6
    variation: 0.3
    challenge: 0.1
  question_slots:
  - slot_id: slot-01
    section: 一、分一分：按给定标准分类并填表
    question_type: fill_blank
    difficulty: basic
    points_per_item: 5
    item_count: 3
    target_points:
    - math-g2-t1-u01-p01
    guidelines: 给出物体图，按指定标准分类并把每类个数填在表格中。
  - slot_id: slot-02
