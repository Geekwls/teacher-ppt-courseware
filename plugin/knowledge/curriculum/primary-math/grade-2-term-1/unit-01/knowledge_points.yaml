    - P9
    anchor_text: P9「把全班同学分为两组，你想怎样分？用自己喜欢的方式表示分类的结果，并与同伴交流。」「成长小档案：用图表表示分类的结果真清楚啊！」
  teaching_boundary:
    scope_allowed:
