lessons:
- lesson_id: math-g2-t1-u01-l01
  unit_id: unit-01
  subject: math
  grade: 2
  term: term-1
  lesson_name: 按给定的标准分类并记录结果
  page_range: P1-P2
  official_examples:
  - 把下面的气球分类：按形状分类，每种气球各有几个？将结果表示出来。哪种气球最多？哪种最少？
  - 把下面的蔬菜分类：按蔬菜的种类分一分，将结果表示出来；哪种蔬菜最多？哪种最少？
  - 做一做：按形状分一分，再涂一涂、填一填。
- lesson_id: math-g2-t1-u01-l02
  unit_id: unit-01
  subject: math
  grade: 2
  term: term-1
  lesson_name: 分类标准不同，结果不同但总数不变
  page_range: P3-P4
  official_examples:
  - 分两组做游戏，可以怎样分组呢？我按大人和孩子分；我按性别分。
  - 「分类标准不同，结果可能不同，但总数不变。」
  - 将下面的动物分成两类，可以怎样分？把下面的衣服分成两类，将结果整理在表格中。
- lesson_id: math-g2-t1-u01-l03
  unit_id: unit-01
  subject: math
  grade: 2
  term: term-1
  lesson_name: 逐层分类：按一定标准分类后可以继续分
  page_range: P5-P6
  official_examples:
  - 丽丽不小心打翻了纽扣盒。这些纽扣怎样分类？小组讨论：怎样分类？
  - 第二次分类的结果，还可以继续分吗？回顾分类过程，对比每次分类结果，你有什么发现？
  - 「我发现按一定标准分类后，还可以再分。」「像这样逐层分类后，更方便使用纽扣。」
- lesson_id: math-g2-t1-u01-l04
  unit_id: unit-01
  subject: math
  grade: 2
  term: term-1
  lesson_name: 数据的整理与简单统计（调查并记录）
  page_range: P7-P8
  official_examples:
  - 调查二（2）班同学最喜欢的动物，结果如下（每个图形代表 1 名同学）：最喜欢哪种动物的人数最多？
  - 按形状分类，填写下表；将这些算式分成两类，可以怎样分？把分类的结果记录在下表中。
  - 把下面的道路交通标志分类。
- lesson_id: math-g2-t1-u01-l05
  unit_id: unit-01
  subject: math
  grade: 2
  term: term-1
  lesson_name: 整理与交流：自定标准分类
  page_range: P9
  official_examples:
  - 把全班同学分为两组，你想怎样分？用自己喜欢的方式表示分类的结果，并与同伴交流。
  - 把上面的图形分为两类，可以怎样分？上面的分类结果，还可以继续分吗？
  - 成长小档案：「用图表表示分类的结果真清楚啊！」「可以按不同的标准分类。有些分类的结果还可以再分。」
