  subject: math
  grade: 2
  term: term-1
  point_name: 乘法的初步认识（几个几相加与乘法算式）
  learning_objectives:
  - 理解乘法的含义，知道求几个相同加数的和可以用乘法；会读写乘法算式并说出各部分名称
  - 能在练习中正确运用本知识点
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t1_2024
    page_ref:
    - P11
    - P13
    anchor_text: 课本 P11-P13 例1/例2 游乐园与圆片实证：小飞机5个3相加（3+3+3+3+3=15）、小火车4个6相加、过山车7个2相加；引出乘法算式 3×5=15（乘数、乘号、乘数、积，读作3乘5等于15）与 4×6=24/6×4=24。
  teaching_boundary:
    scope_allowed:
    - 把连加算式改写成乘法算式
    - 说出乘法算式中各部分名称
    - 乘法算式的读法
    scope_excluded:
    - 乘法交换律的抽象概括
    - 两位数乘一位数
