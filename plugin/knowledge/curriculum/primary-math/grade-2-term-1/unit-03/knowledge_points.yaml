  point_name: 平均分与除法的初步认识
  learning_objectives:
  - 理解平均分的含义，会把一些物体平均分成几份或按每几个一份来分；认识除法算式及各部分名称
  - 能在练习中正确运用本知识点
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g2_t1_2024
    page_ref:
    - P30
    - P33
    anchor_text: 课本 P30-P33 实证：秋游分面包/糖果情境认识平均分（每份分得同样多）；P33 熊猫分竹笋认识除法算式（12÷4=3，被除数、除号、除数、商，读作12除以4等于3）。
  teaching_boundary:
    scope_allowed:
    - 平均分的两种分法
    - 除法算式的读写与各部分名称
    scope_excluded:
