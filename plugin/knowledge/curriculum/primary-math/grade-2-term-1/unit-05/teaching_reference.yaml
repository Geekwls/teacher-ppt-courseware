teaching_references:
- point_id: math-g2-t1-u05-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 由已学口诀类推编制新口诀，发现口诀间的规律
    difficulty: 口诀记忆混淆（如「七八五十六」与「六八四十八」）
    typical_misconceptions:
    - error_pattern: 口诀背错导致得数错误
      misconception_type: 口诀记忆不牢
    - error_pattern: 由口诀写算式时漏写一个
      misconception_type: 口诀与算式对应不全
  variation_strategy:
  - 按规律整理乘法口诀表
  - 对口令、开火车背口诀
- point_id: math-g2-t1-u05-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 由「想乘法算除法」迁移到 7～9 的口诀
    difficulty: 求商时口诀选择错误
    typical_misconceptions:
    - error_pattern: 计算 56÷8 时口诀选错
      misconception_type: 口诀对应不准
    - error_pattern: 口算速度慢，不能达到表内除法熟练要求
      misconception_type: 口诀未熟练
  variation_strategy:
  - 由一句口诀写出乘、除两类算式
  - 限时口算表内乘除法综合
- point_id: math-g2-t1-u05-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 借助画图与「求几个几的和/平均分」的判断选择运算
    difficulty: 不能区分乘法与除法问题
    typical_misconceptions:
    - error_pattern: 把「平均分」问题用乘法解决
      misconception_type: 运算选择错误
    - error_pattern: 列式后无法说清理由
      misconception_type: 数学表达不足
  variation_strategy:
  - 给同一情境分别提出用乘法与除法解决的问题
  - 比较两道题的异同并说明理由
