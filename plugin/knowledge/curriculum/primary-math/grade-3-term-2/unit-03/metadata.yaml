unit_overview: >
  本单元系统学习长方形、正方形的本质特征及周长概念与计算。
  使学生经历从具体实物到抽象图形的提炼过程，通过量一量、折一折、比一比等活动，
  掌握长方形对边相等、4个直角；正方形4边相等、4个直角的几何特征。
  建立周长表象，理解长方形周长公式 (长+宽)×2 与正方形周长公式 边长×4 的推导算理，
  并能灵活运用转化思想解决靠墙围篱笆、拼摆小正方形等周长实际问题。
