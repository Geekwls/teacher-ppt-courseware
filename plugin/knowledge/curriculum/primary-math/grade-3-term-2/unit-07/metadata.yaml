unit_overview: >
  本单元是在学生熟练掌握万以内整数、初步认识分数（分母是10的十进分数）以及元角分、米分米等常见计量单位的基础上进行教学的。
  让学生经历小数产生的过程，体会引入小数的必要性。
  掌握一位小数的含义：十分之几可以用零点几表示；熟练读写一位小数；
  结合具体实物量及数轴比较一位小数的大小；
  掌握简单的一位小数加法、减法竖式计算方法，深刻理解‘小数点对齐就是相同数位对齐’的算理，发展数感与运算能力。
