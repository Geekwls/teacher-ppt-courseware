unit_overview: >
  本单元是在学生已经掌握简单的单式统计表与画“正”字整理数据的基础上，进一步学习复式统计表。
  体会从两个单式统计表合并为一个复式统计表的必要性，理解复式统计表的结构特征（复合表头）。
  掌握根据原始数据整理填表、计算各行“合计”与全表“总计”的方法，
  并能通过对比分析两组或多组数据，做出合理的判断与预测，发展初步的数据意识。
