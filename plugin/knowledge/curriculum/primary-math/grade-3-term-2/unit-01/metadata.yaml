unit_overview: >
  本单元是小学阶段学习图形运动的起始单元，通过观察生活中的典型自然现象和物体运动，
  直观感知轴对称图形、平移和旋转的特征。
  重点认识轴对称图形并能找出对称轴；在方格纸上识别图形平移的方向和距离；
  辨析平移与旋转现象在现实生活中的本质区别（平移沿直线运动、大小方向不变；旋转绕固定点转动）。
