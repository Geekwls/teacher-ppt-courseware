unit_overview: 本单元学习 20 以内的退位减法，教材按「十几减 9 → 十几减 8、7、6 → 十几减 5、4、3、2」的顺序编排，引导学生经历「破十法」「想加算减」等多种算法，并在比较中择优；同时用退位减法解决简单的实际问题。单元末设整理和复习。
