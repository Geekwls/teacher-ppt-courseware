  point_name: 十几减 9：破十法与想加算减
  learning_objectives:
  - 理解「十几减9」的算理，会用「破十法」计算（先把十几分成 10 和几，10 减 9 再加几）
  - 会用「想加算减」的方法（想 9 加几等于十几）计算
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: partial
  provenance:
    source_id: pep_math_g1_t2_2024
    page_ref:
    - P9
    - P10
    - P11
    anchor_text: P9「十几减9」：「原来有15个气球，送出9个。」「15−9=6：10−9=1，5+1=6。」「想：9加几等于15？」「15−9=6：15−5=10，10−4=6。」
  teaching_boundary:
    scope_allowed:
    - 用破十法或想加算减计算十几减 9
    - 说出计算过程
    scope_excluded:
    - 20 以外的退位减法
    - 两位数减两位数的竖式
