teaching_references:
- point_id: math-g1-t2-u05-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 由横式过渡到竖式，强调「相同数位对齐」与「从个位算起」
    difficulty: 书写竖式时数位不对齐，或从十位算起
    typical_misconceptions:
    - error_pattern: 竖式中十位与个位错位
      misconception_type: 对位错误
    - error_pattern: 从十位开始算导致进退位混乱
      misconception_type: 计算顺序错误
  variation_strategy:
  - 把横式改写成竖式并计算
  - 用竖式与口算互相验证
- point_id: math-g1-t2-u05-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 在竖式中把「凑十」「破十」的过程用进位点、退位点表示出来
    difficulty: 忘记进位点/退位点，或退位后未把十位减 1
    typical_misconceptions:
    - error_pattern: 36+28 竖式忘进位得 54
      misconception_type: 进位遗漏
    - error_pattern: 52−27 退位后十位未减 1
      misconception_type: 退位处理错误
  variation_strategy:
  - 说出竖式中每一个数的含义
  - 用竖式计算并验算
- point_id: math-g1-t2-u05-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 重视「读题—找条件—分析—列式—检验」的完整过程
    difficulty: 不能区分「求相差数」与「求剩余」
    typical_misconceptions:
    - error_pattern: 把「求相差数」的问题用加法解决
      misconception_type: 数量关系误判
    - error_pattern: 两步问题只算一步
      misconception_type: 条件遗漏
  variation_strategy:
  - 画图（线段图）表示数量关系
  - 比较不同问题的异同
