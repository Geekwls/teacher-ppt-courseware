teaching_references:
- point_id: math-g1-t2-u04-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 以「十」为单位把整十数加减转化为 10 以内加减法
    difficulty: 把整十数加减当作个位相加（如 30+20 算成 5）
    typical_misconceptions:
    - error_pattern: 30+20 算成 5
      misconception_type: 计数单位意识缺失
    - error_pattern: 50−30 算成 20 但说不出理由
      misconception_type: 算理表述缺失
  variation_strategy:
  - 用小棒（捆）演示整十数加减并说理
  - 由 3+2=5 推出 30+20=50
- point_id: math-g1-t2-u04-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 按「个位与个位相加、十位与十位相加」的对位思想口算
    difficulty: 把两位数加一位数误加到十位上
    typical_misconceptions:
    - error_pattern: 23+4 算成 63
      misconception_type: 对位错误
    - error_pattern: 45−20 算成 25（减错位）
      misconception_type: 对位意识薄弱
  variation_strategy:
  - 说一说先算什么、再算什么
  - 看小棒图写算式并说理
- point_id: math-g1-t2-u04-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 用「凑十」「破十」的旧知迁移到 100 以内
    difficulty: 进位或退位时忘记处理十位
    typical_misconceptions:
    - error_pattern: 28+5 算成 23（忘进位）
      misconception_type: 进位遗漏
    - error_pattern: 32−7 算成 25（退位后十位未减 1）
      misconception_type: 退位处理错误
  variation_strategy:
  - 圈一圈、画一画表示进位与退位过程
  - 说出口算的完整步骤
