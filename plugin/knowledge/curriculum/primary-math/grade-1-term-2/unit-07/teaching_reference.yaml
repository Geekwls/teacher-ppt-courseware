teaching_references:
- point_id: math-g1-t2-u07-p01
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 复习重在构建知识网络，而非重复练习
    difficulty: 能算题但说不出本册知识结构
    typical_misconceptions:
    - error_pattern: 不能说出本册学了哪几类内容
      misconception_type: 结构化整理缺失
    - error_pattern: 把口算与笔算混用导致效率低
      misconception_type: 策略选择不当
  variation_strategy:
  - 合作绘制「100 以内加减法」知识图
  - 按「口算/笔算」给算式分类并说理
- point_id: math-g1-t2-u07-p02
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 在综合情境中辨析数量关系，鼓励多种解法
    difficulty: 情境稍复杂即无法提取数量关系
    typical_misconceptions:
    - error_pattern: 信息较多时找不准相关条件
      misconception_type: 信息筛选能力不足
    - error_pattern: 只求答案不复述过程
      misconception_type: 反思意识薄弱
  variation_strategy:
  - 给同一情境提出多个问题
  - 交流不同解法并比较优劣
- point_id: math-g1-t2-u07-p03
  ref_book: ''
  ref_page: 待补（教参未 OCR）
  pedagogical_focus:
    key_point: 培养问题意识：从「做题」到「提问」
    difficulty: 提问与已知条件无关
    typical_misconceptions:
    - error_pattern: 提出的问题无法用已知条件解决
      misconception_type: 问题意识与逻辑性不足
    - error_pattern: 只会一种问法
      misconception_type: 发散不足
  variation_strategy:
  - 根据同一幅图提出 3 个不同的问题
  - 互相评价问题是否合理
