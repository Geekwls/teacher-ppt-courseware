page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学一年级下册电子课本》逐页实证核定：课本 PDF 共 20 页，页脚印刷页码实测偏移 = 5（PDF#6 = 印刷 P1）；本册可读印刷页区间为 P1–P14。本单元真实版面为 P1–P7（第二单元起始页 P8），全部落在可读区间内，故记为 verified。已据原文逐页取证：P1「认识平面图形」（长方形、三角形、正方形、平行四边形、圆；画一画、分一分）、P2「涂一涂」「画出喜欢的图案」「在钉板上围一围」、P3「拼一拼」「试一试」（2 个同样的长方形/三角形拼组、正方形对折剪开）、P4「用七巧板拼三角形」与「你知道吗」（七巧板）、P5「整理和复习」、P6–P7「练一练」与「思考题」「成长小档案」。
unit_overview: 本单元是「图形的认识」的起始单元，从立体图形的面上抽象出长方形、正方形、三角形、平行四边形、圆五种平面图形，通过画一画、分一分、涂一涂、围一围、拼一拼、剪一剪等活动认识图形，并用七巧板拼图发展空间观念与初步的推理意识。单元末设「整理和复习」与「练一练」，并含思考题「把一张长方形纸剪成大小相等的两部分，你能想出哪些剪法」。
