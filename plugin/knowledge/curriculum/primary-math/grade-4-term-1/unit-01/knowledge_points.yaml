- point_id: math-g4-t1-u01-p06
  unit_id: unit-01
  lesson_id: math-g4-t1-u01-l06
  subject: math
  grade: 4
  term: term-1
  point_name: 整万、整亿数的改写
  learning_objectives:
  - 能把整万、整亿的数改写成用「万」或「亿」作单位的数
  - 能说明改写前后数的大小不变（用「=」连接）
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g4_t1_2024
    page_ref:
    - P16
    anchor_text: P16「数的改写」：「有时为了读写方便，会把整万或整亿的数改写成用『万』或『亿』作单位的数。」红细胞：25000000 个 = 2500 万个；白细胞：30000 个 = 3 万个；200000000 = 2 亿；530500000000 = 5305 亿。「可以先分级，找到亿位，再改写。」
  teaching_boundary:
    scope_allowed:
    - 把整万数改写成用「万」作单位的数
    - 把整亿数改写成用「亿」作单位的数
    - 说明改写与求近似数的区别（一个用「=」，一个用「≈」）
    scope_excluded:
    - 科学记数法的系统讲解
    - 有效数字与量纲分析
- point_id: math-g4-t1-u01-p07
  unit_id: unit-01
  lesson_id: math-g4-t1-u01-l07
  subject: math
  grade: 4
  term: term-1
  point_name: 用「四舍五入」法求近似数
  learning_objectives:
  - 能说出「四舍五入」法的含义，并能按要求省略万位或亿位后面的尾数求近似数
  - 能区分近似数与准确数
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g4_t1_2024
    page_ref:
    - P17
    anchor_text: P17：「182068≈18 万，218309≈22 万。千位上的数小于 5，把万位后面的尾数舍去，改写成 0；千位上的数大于 5，向前一位进 1，再把万位后面的尾数舍去，改写成 0。这种求近似数的方法叫『四舍五入』法。是『舍』还是『入』，要看省略的尾数部分的最高位上的数是小于 5 还是大于或等于 5。」
  teaching_boundary:
    scope_allowed:
    - 省略万位后面的尾数求近似数
    - 省略亿位后面的尾数求近似数
    - 区分近似数与准确数
    scope_excluded:
    - 统计推断与抽样误差的系统讲解
    - 有效数字规则的国际标准
