page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学四年级上册电子课本》逐页实证核定：课本 PDF 共 73 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P70。本单元真实版面为 P1–P23，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P1 单元扉页（第七次全国人口普查部分地区数据：北京 21893095 人、广东 126012510 人…）；P2「亿以内数的认识」（一万一万地数，10 个一万是十万…个（一）、十、百、千、万、十万、百万、千万、亿都是计数单位；每相邻两个计数单位之间的进率都是十）；P3 数位顺序表与自然数（最小的自然数是 0，没有最大的自然数）；P4「读出下面各数」与含两级数的读法三条规则（先读万级再读个级；万级的数按个级的读法读再添「万」字；每级末尾不管有几个 0 都不读，其他数位上有一个 0 或连续几个 0 都只读一个 0）；P6 亿以内数的写法（先写万级再写个级；哪个数位上一个也没有就在那个数位上写 0）；P10 练习一（数的不同表示方式，如 440000=400000+40000）；P10「亿以上数的认识」（10 个一亿是十亿，10 个十亿是一百亿，10 个一百亿是一千亿；十进制计数法）；P11–P12 亿以上数的读写；P15「数的大小比较」（位数多的数就大；位数相同从最高位比起）；P16「数的改写」（25000000=2500 万，200000000=2 亿）；P17「求近似数」（四舍五入法：182068≈18 万，218309≈22 万）；P21 整理和复习（知识结构图）。
unit_overview: 本单元是四年级上册的起始单元，也是小学阶段「数」的认识的最后一次大扩展：由万以内数扩展到亿以内乃至亿以上数。教材编排为：亿以内数的认识（计数单位、数位、数级、十进制计数法）→ 亿以内数的读法与写法 → 亿以上数的认识与读写 → 万以上数的大小比较 → 整万、整亿数的改写 → 用「四舍五入」法求近似数 → 整理和复习。核心是让学生在「数位—数级—计数单位」的结构中理解大数的组成，并把读写方法归结为「先分级，再从高位起按级读写」。
numeric_upper_bound: 1000000000000
