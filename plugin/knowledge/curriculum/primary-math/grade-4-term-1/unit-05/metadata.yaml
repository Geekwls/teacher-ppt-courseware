page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学四年级上册电子课本》逐页实证核定：课本 PDF 共 73 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P70。本单元真实版面为 P58–P69，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P58「加法模型」（学校图书馆星期一借阅图书的人数表：上午来了多少人？15+32=47（人）；下午来了多少人？24+50=74（人）；一共来了多少人？47+74=121（人）；「总量 = 分量 + 分量」「分量 = 总量 − 分量」）；P59–P60 用加法模型解决问题（小丽有 100 元钱，要买 3 本不同的书：34+21+49=104>100 不可以，34+21+26=81<100 可以…）；P62「总价 = 单价 × 数量」（小票情境：每盒牛奶 18 元买 3 盒花 54 元；每千克苹果 9 元买 4 kg 花 36 元；单价=总价÷数量，数量=总价÷单价）；P63 促销问题（节省的钱 = 原来的总价 − 现在的总价 =（12−9）×4=12 元）；P66「速度、时间与路程」（小红 675 m 用 9 分钟，小丽 480 m 用 6 分钟，小丽每分钟走 80 m、小红每分钟走 75 m）；P67「路程 = 速度 × 时间」「速度 = 路程 ÷ 时间」「时间 = 路程 ÷ 速度」；P69 成长小档案：「总量=分量+分量、总价=单价×数量、路程=速度×时间是常用的数量关系」。
unit_overview: 本单元是 2024 版教材新增的「数量关系」单元，用**模型**的观点统整小学阶段最常见的三组数量关系。教材编排为：加法模型（总量 = 分量 + 分量，及减法是加法的逆运算）→ 用加法模型解决实际问题 → 乘法模型之一：总价 = 单价 × 数量 → 用乘法模型解决促销比较问题 → 乘法模型之二：路程 = 速度 × 时间 → 练习与整理。核心是让学生从「解决一道题」上升到「识别并运用一类数量关系」，体会加法模型与乘法模型在结构上的区别与联系。
