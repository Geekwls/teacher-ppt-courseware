page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学四年级上册电子课本》逐页实证核定：课本 PDF 共 73 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P70。本单元真实版面为 P24–P27，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P24「1亿有多大」（学校组织同学们参观印刷厂，仓库里摆满了纸张。「好高啊，这纸有 1 亿张吧？」→ 1 亿张纸有多高）；P25「算一算」：100 张纸厚 1 cm，10000 张纸高 100 cm（也就是 1 m），10000 个一万是一亿，一亿张纸摞起来就有 10000 m 高，「哇，比珠穆朗玛峰还高」；P26「分析问题—得出结论」：1 亿粒大米大约重 2 t，1 秒写一个字写 1 亿个字要一刻不停三年多；P27「小讲堂」：把 1 dm 平均分成 1 亿份，一份才是 1 纳米；1 亿名同学手拉手可以绕地球赤道 3 圈半。
unit_overview: 本单元是 2024 版教材新增的「综合与实践」主题活动，安排在「万以上数的认识」之后。教材以「1 亿张纸摞起来有多高」为核心任务，引导学生经历「提出问题—设计方案—测量推算—得出结论—回顾反思」的完整探究过程：先量出 100 张纸的厚度（1 cm），再借助「100 个一百是一万」「10000 个一万是一亿」的倍数关系推算 1 亿张纸的高度（10000 m），从而把抽象的「1 亿」转化为可感知的量。随后学生自主提出并研究「1 亿粒大米有多重」「写 1 亿个字要多久」等问题，在小讲堂中拓展到纳米与地球周长。本单元不引入新的运算规则，重在发展数感与量感，并积累数学活动的经验。
