page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学四年级上册电子课本》逐页实证核定：课本 PDF 共 73 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P70。本单元真实版面为 P39–P57，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P39「口算乘法」（每筐有 16 盒草莓，3 筐有多少盒？16×3=48；10×3=30，6×3=18，30+18=48；想一想 160×3）；P40（每袋有 6 个橙子，10 袋有多少个？6×10=60；每盒有 12 个苹果，20 盒有多少个？12×20=240）；P43「笔算乘法」（一套书有 12 册，学校买了 13 套，一共多少册？12×13=156；12×10=120，12×3=36，120+36=156）；P44「乘数是两位数的乘法怎样计算？1. 先用一个乘数个位上的数去乘另一个乘数，得数的末位与乘数的个位对齐。2. 再用这个乘数十位上的数去乘另一个乘数，得数的末位与乘数的十位对齐。3. 然后把两次乘得的数加起来。」P48（106×63=，因数末尾有 0 的简便算法）；P49「积的变化规律」（一个乘数不变，另一个乘数乘几或除以几（0 除外），积也乘或除以几）；P50 用计算器探索规律（11×11=121，111×111=12321…）；P53「用估算解决问题」（张老师带 2600 元买 18 套服装，可以买哪几款？）；P55 整理和复习（知识结构图：口算乘法 / 笔算乘法 / 用估算解决问题）。
unit_overview: 本单元是整数乘法的收尾单元，也是乘法学习的最后一次扩展：由三位数乘一位数扩展到多位数乘两位数。教材编排为：口算乘法（两位数乘整十数、整百数）→ 笔算乘法（两位数乘两位数、因数末尾有 0 的乘法）→ 积的变化规律 → 用计算器探索规律 → 用估算解决问题 → 整理和复习。核心是把「多位数乘两位数」的笔算拆解为两次「乘一位数」的积再相加，并理解每一步积的末位对齐规则；同时通过「积的变化规律」把计算与数感、估算结合起来。
