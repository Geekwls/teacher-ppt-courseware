page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学四年级上册电子课本》逐页实证核定：课本 PDF 共 73 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P70。本单元真实版面为 P28–P38，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P28「角的再认识」（角也可以从旋转的角度来认识，角可以看作由一条射线绕着它的端点，从一个位置旋转到另一个位置所形成的图形；一条射线绕它的端点旋转半周形成平角，旋转一周形成周角）；P29 锐角、直角、钝角、平角、周角之间的关系与比较；P30「角的度量」（人们将圆平均分成 360 份，将其中 1 份所对的角作为度量角的单位，它的大小就是 1 度，记作 1°；1 周角=360°，1 平角=180°，1 直角=90°；量角器是把半圆分成 180 等份制成的）；P31 量角的步骤；P32 画角的步骤（画一个 60° 的角）；P34「测量长度、测量面积、测量角都是看被测量的图形包含了多少个相应的度量单位」；P36 整理和复习（知识结构图）。
unit_overview: 本单元在二年级「角的初步认识」的基础上，从**旋转**的角度重新认识角，并系统学习角的度量。教材编排为：角的再认识（平角、周角）→ 锐角、直角、钝角、平角、周角之间的关系 → 角的度量单位「度」与量角器 → 量角 → 画角 → 整理和复习。核心是把角纳入「度量」的一般框架：先确定度量单位（1°），再用工具（量角器）数出被测量的角包含多少个 1°。本单元还通过「测量长度、面积、角都是看包含多少个相应的度量单位」的对比，帮助学生形成结构化的度量观念。
