page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学六年级上册电子课本》逐页实证核定：课本 PDF 共 77 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P75。本单元真实版面为 P48–P73，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P48–P49「圆和扇形的认识」（用圆规画圆；「圆心：针尖固定的一点，通常用字母 O 表示；半径：连接圆心和圆上任意一点的线段，通常用字母 r 表示；直径：通过圆心并且两端都在圆上的线段，通常用字母 d 表示」；墨子云「圆，一中同长也」）；P50「同一个圆所有的半径都相等，所有的直径都相等，直径长度是半径的 2 倍」（d=2r）；「圆心确定了圆的中心位置，半径决定了圆的大小」；P51「弧 AB」「一条弧和经过这条弧两端的两条半径所围成的图形叫作扇形」「顶点在圆心的角叫作圆心角」；「扇形的大小与这个扇形的圆心角的大小有关」；P55「圆的周长」「围成圆的曲线的长是圆的周长」；P56「一个圆的周长总是它的直径的 3 倍多一些」「任意一个圆的周长除以它的直径，所得的结果是一个固定的数，我们把它叫作圆周率，用字母 π 表示」「π=3.1415926535…」「C=πd 或 C=2πr」；祖冲之把圆周率精确到小数点后 7 位；P57（汽车轮子直径 75 cm，3.14×75=235.5 cm=2.355 m；4710 km=4710000 m，4710000÷2.355=2000000 圈）；P60–P61「圆的面积」（用数方格的方法估出圆的面积大约是半径平方的 3.1 倍；把圆等分成 8、16、32 份拼成近似长方形，「长方形的长近似于 πr，宽近似于 r」，「圆的面积=πr×r=πr²」，即 S=πr²）；刘徽「割圆术」；P63「圆环的面积」（外圆直径 26.3 cm、内圆直径 5.4 cm 的青玉御题蚕纹璧；3.14×(26.3/2)²−3.14×(5.4/2)²）；P64–P65「外方内圆」「外圆内方」；P71 整理和复习（圆是轴对称图形，有无数条对称轴；C=2πr 或 C=πd；S=πr²）。
unit_overview: 本单元是小学阶段「图形与几何」领域最后也是最重要的一个平面图形单元。教材编排为：圆和扇形的认识（圆心、半径、直径、弧、圆心角）→ 圆的周长（圆周率、C=πd、C=2πr）→ 圆的面积（化曲为直、S=πr²）→ 圆环与组合图形面积（外方内圆、外圆内方）→ 用圆设计图案 → 整理和复习。核心是「化曲为直」的转化思想：把圆的周长与面积转化为直线图形的周长与面积来研究，并认识圆周率 π 是一个固定的无限不循环小数。
