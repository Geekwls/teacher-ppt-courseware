page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学六年级上册电子课本》逐页实证核定：课本 PDF 共 77 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P75。本单元真实版面为 P1–P15，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P1「用有序数对确定位置」（在座位表中，张亮在第 2 列、第 3 行，位置可以用有序数对（2，3）表示；王艳的位置用有序数对表示是（…），赵雪的位置是（…），看一看它们有什么不同；（6，3）表示的是王乐的位置）；P2「同一列，有序数对的第一个数都相同」；「（2，a）表示的是哪些同学的位置？」；P5「用方向和距离确定位置」（渔船距搜救船 1500 m，「渔船在搜救船的东偏南 25° 方向上」「渔船在搜救船的南偏东 65° 方向上」→「两种说法都对，但一般习惯用不大于 45° 的角来描述」，「用 1 cm 表示 500 m，渔船距离搜救船 3 cm，也就是实际距离 1500 m」）；P6「确定平面内一个物体的准确位置，要先确定参照点，还需要知道物体相对于参照点的距离和方向」；P8「一艘货船位于搜救船北偏西 40° 方向上，距离搜救船 1000 m」；P10「小明放学回家的路线」（第 1 段以学校为参照点，向南偏东 30° 方向走 200 m 到达邮局；「描述路线时，每段路线都是以起点为参照点确定方向的」）；P11 整理和复习（「平面内同一个点既可以用一个有序数对，又可以用方向和距离确定位置」「这两种方法都需要两个条件」）；P5 生活中的数学（北京的地理位置是东经 116°24′、北纬 39°54′）。
unit_overview: 本单元是小学阶段「图形与几何」领域「确定位置」的核心单元。教材编排为：用有序数对确定位置（列与行）→ 用方向和距离确定位置（参照点 + 方向 + 距离）→ 在平面图上标出物体的位置 → 用方向和距离描述路线 → 整理和复习。核心是让学生理解「确定平面内一个点的位置需要两个条件」，并能在「有序数对」与「方向和距离」两种方法之间建立联系。
numeric_upper_bound: 100
