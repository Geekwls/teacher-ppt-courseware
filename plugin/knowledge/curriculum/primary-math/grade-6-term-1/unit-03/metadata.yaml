page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学六年级上册电子课本》逐页实证核定：课本 PDF 共 77 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P75。本单元真实版面为 P32–P43，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P32「倒数的认识」（乘积是 1 的两个数互为倒数；3/5 的倒数是 5/3；6 的倒数是 1/6；1 的倒数是 1，0 没有倒数）；P33「一个数除以整数」（一块 4/5 公顷的蔬菜种植基地平均分给 2 个种植小组，每个小组 4/5÷2=2/5 公顷；平均分给 3 个小组 4/5÷3=4/15 公顷）→「一个数除以整数（0 除外），等于乘这个整数的倒数」；P34–P35「一个数除以分数」（160 g 牛奶是砂糖的 4/5，砂糖质量=160÷4/5=160×5/4=200 g；鸡蛋的质量是 2/5 kg，是面粉质量的 2/3，面粉质量=2/5÷2/3=2/5×3/2=3/5 kg）→「除以一个数（0 除外），等于乘这个数的倒数」；P36「除法是乘法的逆运算」并由此推导「4÷2=4×1/2」；P39「工程问题（假设法）」（甲队每天修全长的 1/12，乙队每天修全长的 1/18，同时从两端开工，1÷(1/12+1/18)=7.2 天修完）；P41 整理和复习（「已知一个数的几分之几是多少，求这个数」用除法计算）。
unit_overview: 本单元是在分数乘法的基础上学习分数除法。教材编排为：倒数的认识 → 一个数除以整数 → 一个数除以分数 → 用除法解决「已知一个数的几分之几是多少，求这个数」的问题 → 工程问题（用假设法把工作总量看作「1」）→ 整理和复习。核心算理是「除以一个数（0 除外），等于乘这个数的倒数」，并从「除法是乘法的逆运算」说明这一法则的合理性。
