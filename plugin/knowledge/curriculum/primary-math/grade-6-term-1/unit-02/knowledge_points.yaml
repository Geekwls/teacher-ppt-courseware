- point_id: math-g6-t1-u02-p01
  unit_id: unit-02
  lesson_id: math-g6-t1-u02-l01
  subject: math
  grade: 6
  term: term-1
  point_name: 分数乘整数的计算方法
  learning_objectives:
  - 能按「分子乘整数、分母不变」计算分数乘整数
  - 能先约分再计算，并能说明算理
  applicable_question_types:
  - fill_blank
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P16
    anchor_text: P16：3/10×2=(3×2)/10=6/10=3/5（张）。「分数乘整数，用分子乘整数的积作分子，分母不变。能约分的可先约分，再计算。」
  teaching_boundary:
    scope_allowed:
    - 计算分数乘整数
    - 先约分再计算
    - 说明分数乘整数的算理
    scope_excluded:
    - 有理数乘法的代数结构
    - 分数与比的关系
- point_id: math-g6-t1-u02-p02
  unit_id: unit-02
  lesson_id: math-g6-t1-u02-l02
  subject: math
  grade: 6
  term: term-1
  point_name: 一个数乘分数的计算方法
  learning_objectives:
  - 能按「分子相乘、分母相乘」计算一个数乘分数
  - 能结合图形理解「求一个数的几分之几是多少」用乘法
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P17
    - P18
    anchor_text: P17–P18：2×5/8=10/8=5/4（公顷）；「一个数乘分数，用分子相乘的积作分子，用分母相乘的积作分母。整数可以看成分母为 1 的分数。」
  teaching_boundary:
    scope_allowed:
    - 计算分数乘分数
    - 结合图形说明算理
    - 把整数看成分母为 1 的分数
    scope_excluded:
    - 分数乘法的面积模型
    - 有理数乘法的一般法则
- point_id: math-g6-t1-u02-p03
  unit_id: unit-02
  lesson_id: math-g6-t1-u02-l03
  subject: math
  grade: 6
  term: term-1
  point_name: 分数混合运算与运算律
  learning_objectives:
  - 能按整数混合运算的顺序计算分数混合运算
  - 能运用乘法运算律进行简便计算
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P21
    - P22
    anchor_text: P21：2.1×5/8=1.3125，2.4×5/8=1.8（分数与小数互化）。P22：「分数混合运算的顺序和整数混合运算的顺序相同。整数和小数的乘法运算律在分数运算中依然适用。」3/5×12+2/5×12=(3/5+2/5)×12=12。
  teaching_boundary:
    scope_allowed:
    - 按顺序计算分数混合运算
    - 运用运算律简便计算
    - 分数与小数的互化
    scope_excluded:
    - 有理数运算律的公理化
    - 代数式的化简
- point_id: math-g6-t1-u02-p04
  unit_id: unit-02
  lesson_id: math-g6-t1-u02-l04
  subject: math
  grade: 6
  term: term-1
  point_name: 连续求一个数的几分之几是多少
  learning_objectives:
  - 能解决「连续求一个数的几分之几是多少」的问题
  - 能画线段图或示意图分析数量关系
  applicable_question_types:
  - reading
  - writing
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P27
    - P28
    anchor_text: P27：4800×3/5=2880（m²），2880×1/4=720（m²）；综合算式 4800×3/5×1/4=720（m²）。「也可以先求出器械类健身区域面积占整个休闲场所的几分之几。」
  teaching_boundary:
    scope_allowed:
    - 用分数乘法连续求一个数的几分之几
    - 画图分析数量关系
    - 用综合算式表达
    scope_excluded:
    - 复合函数与链式相乘
    - 比例关系
- point_id: math-g6-t1-u02-p05
  unit_id: unit-02
  lesson_id: math-g6-t1-u02-l05
  subject: math
  grade: 6
  term: term-1
  point_name: 求比一个数多（少）几分之几的数是多少
  learning_objectives:
  - 能解决「求比一个数多（少）几分之几的数是多少」的问题
  - 能用两种方法（先求相差量或先求分率）列式
  applicable_question_types:
  - reading
  - writing
  - choice
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P29
    - P30
    anchor_text: P29：100−100×1/4=75（kg），或 100×(1−1/4)=75（kg）。P30：75×(1+4/5)=135（次）。「画线段图能清晰地表示出数量关系，要注意理解其中的分数表示谁是谁的几分之几。」
  teaching_boundary:
    scope_allowed:
    - 用两种方法列式
    - 画线段图分析
    - 确定「单位 1」的量
    scope_excluded:
    - 增长率与复合增长
    - 百分数应用的前置
