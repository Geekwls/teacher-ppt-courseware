page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学六年级上册电子课本》逐页实证核定：课本 PDF 共 77 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P75。本单元真实版面为 P16–P31，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P16「分数乘整数」（做一朵花需要用 3/10 张纸，做 2 朵花需要 2 个 3/10 张，3/10×2=(3×2)/10=6/10=3/5 张；做 8 朵花 3/10×8=…）→「分数乘整数，用分子乘整数的积作分子，分母不变。能约分的可先约分，再计算」；P17–P18「一个数乘分数」（面积 2 公顷的育苗基地，5/8 用来种柳树苗，种柳树苗的面积是2×5/8=10/8=5/4 公顷；「求一个数的几倍是多少，用乘法计算」）→「一个数乘分数，用分子相乘的积作分子，用分母相乘的积作分母」；P21「分数、小数混合运算及运算律」（松鼠欢欢身体长 2.1 dm，尾巴约是身体长度的 5/8，2.1×5/8=1.3125 dm；松鼠乐乐身体长 2.4 dm，2.4×5/8=1.8 dm，「可以把 2.1 化成分数，也可以把 5/8 化成小数」）；P22「分数混合运算的顺序和整数混合运算的顺序相同」「整数和小数的乘法运算律在分数运算中依然适用」（如 3/5×12+2/5×12=(3/5+2/5)×12=12）；P27「连续求一个数的几分之几是多少」（休闲场所 4800 m²，运动健身区域占 3/5，器械类健身区域占运动健身区域的 1/4，4800×3/5×1/4=720 m²）；P29「求比一个数多（少）几分之几的数是多少」（厨余垃圾原来约 100 kg，减少了 1/4，100−100×1/4=75 kg，或 100×(1−1/4)=75 kg）。
unit_overview: 本单元是在分数意义与分数加减法的基础上学习分数乘法。教材编排为：分数乘整数 → 一个数乘分数（分数乘分数）→ 分数、小数混合运算及运算律 → 连续求一个数的几分之几是多少 → 求比一个数多（少）几分之几的数是多少 → 整理和复习。核心是把「求几个相同分数的和」与「求一个数的几分之几是多少」统一到分数乘法，并归纳出「分子相乘的积作分子、分母相乘的积作分母」的计算方法。
numeric_upper_bound: 10000
