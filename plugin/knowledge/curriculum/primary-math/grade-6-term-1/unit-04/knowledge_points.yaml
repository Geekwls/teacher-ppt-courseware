    - P46
    anchor_text: P45：「正数和负数可以用来表示相反意义的量。」P46：收支记录「正数表示收入，负数表示支出」（父母工资 +9500、给老人 −2000、压岁钱 −200、买年货 −500）。
  teaching_boundary:
