  point_name: 负数的意义与读写法
  learning_objectives:
  - 能正确读、写正数和负数，能说出负数表示的实际意义
  - 能识别生活中的正数与负数
  applicable_question_types:
  - fill_blank
  - choice
  - reading
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P44
    - P45
    anchor_text: P44：北京 −4℃~0℃；吐鲁番盆地最低点的海拔是 −154.31 m。P45：「一个数前面有「−」和没有「−」，表示了相反的含义。」「我们以前学过的数，如 6、4.7、…是正数；−6、−4.7、…是负数。」
  teaching_boundary:
    scope_allowed:
    - 读写正负数
    - 说出负数的实际含义
    - 在情境中识别正负数
    scope_excluded:
    - 实数系的完备化
    - 数学史上的数系扩充
