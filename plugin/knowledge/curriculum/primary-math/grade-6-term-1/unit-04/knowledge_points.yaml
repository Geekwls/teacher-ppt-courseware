- point_id: math-g6-t1-u04-p03
  unit_id: unit-04
  lesson_id: math-g6-t1-u04-l03
  subject: math
  grade: 6
  term: term-1
  point_name: 0 的意义（既不是正数也不是负数）
  learning_objectives:
  - 能说出 0 既不是正数也不是负数
  - 能说明 0 在正负数中的分界作用
  applicable_question_types:
  - choice
  - fill_blank
  verification_status: verified
  provenance:
    source_id: pep_math_g6_t1_2024
    page_ref:
    - P45
    anchor_text: P45：「0 是正数还是负数呢？」（0 既不是正数，也不是负数；0 是正数与负数的分界。）「负数应该标在 0 的左边。」
  teaching_boundary:
    scope_allowed:
    - 判断 0 的正负
    - 说明 0 的分界作用
    - 在数轴上标出负数
    scope_excluded:
    - 数系中 0 的特殊地位
    - 数学史中「零」的引入
