page_evidence_note: 页码于 2026-10-10 依据用户提供的《2024版人教版小学数学六年级上册电子课本》逐页实证核定：课本 PDF 共 77 页，页脚印刷页码实测偏移 = 2（PDF 序号 − 印刷页码）；本册可读印刷页区间为 P1–P75。本单元真实版面为 P44–P47，**全部落在可读区间内**，故记为 verified。已据原文逐页取证：P44「寻找负数」（北京 −4℃~0℃；吐鲁番盆地最低点的海拔是 −154.31 m；海平面为分界）；P45「认识负数」（电子账单 −85.00、+500.00；珠穆朗玛峰 8848.86 m；「一个数前面有「−」和没有「−」，表示了相反的含义」；「以 0℃ 为分界线，分为零上温度和零下温度，−10℃ 表示零下 10℃」；「我们以前学过的数，如 6、4.7、…是正数；−6、−4.7、…是负数。正数和负数可以用来表示相反意义的量」；「负数应该标在 0 的左边」）；P46「应用负数」（春节期间收支记录：父母工资 +9500、给老人 −2000、压岁钱 −200、买年货 −500；「正数表示收入，负数表示支出」；坐位体前屈成绩用负数记录）；P47 小讲堂（我国数学家刘徽用「正算赤、负算黑」区分正负数；「有了负数，小的数减大的数的结果就可以表示出来，例如 8−10=−2」）；P47 成长小档案（「能正确地读、写正数和负数；知道 0 既不是正数，也不是负数」）。
unit_overview: 本单元是小学阶段「数与代数」领域数系扩充的关键单元，也是 2024 版教材新增的活动化单元。教材编排为：寻找负数（在生活中发现负数）→ 认识负数（正数、负数的意义，0 的分界作用）→ 应用负数（用负数表示相反意义的量）→ 小讲堂（负数的历史与数学应用）→ 成长小档案。核心是让学生结合温度、海拔、楼层、收支等具体情境，理解负数表示「与正数相反意义的量」，并明确 0 既不是正数也不是负数。
numeric_upper_bound: 10000
