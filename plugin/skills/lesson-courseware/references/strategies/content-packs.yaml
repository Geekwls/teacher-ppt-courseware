# 学科内容包 (content-packs.yaml)
#
# 用途: 承载 PagePlanner 在教学设计缺失时的"兜底文案"。
# 纪律: 规划层只做选择与编排, 不得在代码里再写一段学科教学内容。
# 结构: default 为通用兜底, subjects.<subject> 按需覆盖 (对象深合并, 数组整体替换)。
# 变更需走 PR 评审: 这些文字会直接上屏, 属于教学内容资产。

version: 1

default:
  end_subtitle: "认真练习，熟能生巧"
  end_notes: "今天的课就上到这里。课后请按要求完成分层作业：必做部分人人过关，选做和挑战量力而行。同学们，下课！"
  end_notes_no_homework: "今天的课就上到这里。请同学们课后认真复习，巩固今天学到的核心知识与方法。同学们，下课！"

  board_design:
    branches:
      - head: "核心知识"
        items:
          - "核心概念感知"
          - "规律方法归纳"
      - head: "综合应用"
        items:
          - "迁移应用拓展"
          - "思维素养提升"

  homework:
    notes: "今天的分层作业：基础必做题全员完成；选做题供学有余力的同学提升；挑战题鼓励联系生活自主探究。"
    tiers:
      - tier: "必做"
        desc: "【基础巩固】认真完成课后配套练习题，扎实掌握本节课核心知识与基本方法。"
      - tier: "选做"
        desc: "【能力拓展】尝试完成教材中的思维拓展思考题，检验知识迁移应用能力。"
      - tier: "挑战"
        desc: "【综合实践】在生活中寻找一个能运用所学知识解决的实际问题，记录探索思路。"

  split:
    # 算理步骤膨胀拆页时, "数形建模"子页的观察提示
    model_reasoning_items:
      - "① 观察数轴从 0 开始跳跃"
      - "② 每次增加一个相同的计数单位"
      - "③ 记录跳跃终点位置"
    model_conclusion: "★ 发现：相同加数相加，在数轴上表现为相同步长的连续跳跃。"
    # 未提供 reasoning_steps 时的算理兜底三步
    reasoning_fallback_items:
      - "想：20 是 2 个十"
      - "2 个十 × 3 = 6 个十"
      - "6 个十就是 60"
    # 长文本品读拆页: 设问页引导语 / 朗读符号提示 / 无核心句时的写作启示
    reading_intro_body: "结合上页原文重点语句，深入探究下列核心问题并交流分享："
    reading_conclusion_with_guide: "朗读提示：“／”处稍作停顿，红色加粗的词读得重一些、慢一些。"
    reading_conclusion_fallback: "★ 写作启示：观察景物要调动多重感官，融情入景。"

subjects:
  chinese:
    end_subtitle: "多读多写，日积月累"
    end_notes: "今天的课就上到这里。课后请认真完成分层作业，工整书写生字，熟读精读重点段落。同学们，下课！"
    end_notes_no_homework: "今天的课就上到这里。请同学们课后多读课文，品味语言，积累优美词句。同学们，下课！"
    board_design:
      branches:
        - head: "课文主线"
          items:
            - "上学：各族相聚 欢声笑语"
            - "上课：安静听读 动物驻足"
            - "下课：摔跤跳舞 边疆欢乐"
        - head: "语文要素"
          items:
            - "关注新鲜词句"
            - "品读生动拟人"
            - "体会童真童趣"
        - head: "字词书写"
          items:
            - "左窄右宽 左右避让"
            - "字形匀称 重心平稳"
    homework:
      notes: "今天的分层作业：生字书写人人过关；熟读精读品味语言；挑战题鼓励联系生活观察写话。"
      tiers:
        - tier: "必做"
          desc: "【基础巩固】在田字格本上工整书写本课生字与核心词语，朗读课文重点段落。"
        - tier: "选做"
          desc: "【能力提升】有感情地朗读课文，在摘抄本上摘抄 2~3 处有新鲜感的优美词句。"
        - tier: "挑战"
          desc: "【思维拓展】观察生活中的一处熟悉场景，尝试运用拟人手法写 1~2 句生动的话。"

  math:
    end_subtitle: "勤学多思，融会贯通"
    end_notes: "今天的课就上到这里。课后请按要求完成分层作业：认真练习，订正错题，理清算理。同学们，下课！"
    end_notes_no_homework: "今天的课就上到这里。请同学们课后回顾今天的核心概念与解题思路。同学们，下课！"
    board_design:
      branches:
        - head: "算理直观"
          items:
            - "观察数形直观"
            - "明确计数单位"
            - "数轴规律对应"
        - head: "核心算法"
          items:
            - "转化思考口算"
            - "算式计算规范"
            - "总结提升法则"
    homework:
      notes: "今天的分层作业：基础练习全员过关，理清算理与规范；拓展题检验迁移能力；挑战题在生活中应用数学。"
      tiers:
        - tier: "必做"
          desc: "【基础练习】完成教材配套练习题，熟练掌握基本概念、算理与解题步骤。"
        - tier: "选做"
          desc: "【变式拓展】尝试完成教材中的思维思考题，检验知识迁移与灵活应用能力。"
        - tier: "挑战"
          desc: "【生活应用】在生活中寻找一个能运用本课数学知识解决的实际问题，记录思考过程。"

  english:
    end_subtitle: "多听多说，熟能生巧"
    end_notes: "今天的课就上到这里。课后请按要求完成分层作业，多听多读多表达。Goodbye, class!"
    end_notes_no_homework: "今天的课就上到这里。请同学们课后多听多说，熟能生巧。Goodbye, class!"
    homework:
      notes: "今天的分层作业：听读跟读人人过关；角色操练流畅脱稿；挑战题鼓励结合生活真实交际。"
      tiers:
        - tier: "必做"
          desc: "【听读巩固】大声跟读课文对话与核心词汇 3 遍，注意语音、语调与连读。"
        - tier: "选做"
          desc: "【角色操练】与同伴或家长进行课文角色扮演，流畅脱稿运用本课核心句型。"
        - tier: "挑战"
          desc: "【情境交际】结合真实生活场景创编一段 3~4 轮的英文小对话，下节课展示分享。"
